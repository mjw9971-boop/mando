# VTD·어댑터 상수의 단일 출처 (vtd_adapter/config.py 가 읽는다)
# 단위: m, m/s, m/s^2, rad. km/h 는 *_kph 키와 로그 출력에서만.
#
# 여기에는 **VTD 연결·차량 제원·추정기·배치 판정** 상수만 둔다.
# 판단(IDM·forecast·lateral PID) 상수는 team_code/config.py (PDM-Lite) 가 단일 출처다.
# 옛 자체 planner/shield 상수(caps/signal/lead/ttc/lane_change/cross/shield)는
# PDM-Lite 이식으로 폐기 — 필요해지면 kr_rules.py 도입 시 여기로 되살린다.

comm:
  host: 192.168.50.11
  port: 9910
  send_hz: 20
  watchdog_s: 1.0
  # 실측 확정 (2026-08-19, VTD 2025.2): +1.0.
  # -1.0 이면 직선 구간에서 발산하며 courseRespawn 리셋이 발생한다.
  # corr(steering, yaw_rate) = -0.93 으로 확인 (logs/run_20260819_185936.jsonl).
  steer_sign: 1.0
  connect_retry_s: 1.0
  recv_bufsize: 65536

camera:
  # IG 표시 전용 팔로워 뷰 — batch_run 이 매 시나리오 Init 완료 후·Start 전에
  # SCP <Camera> 1회로 적용한다. GUI 프리셋 "Relative - follower view" 동일 값.
  # 9910 GT·제어·채점에는 영향 없음. 전송 실패는 경고만 하고 배치는 계속된다.
  # 각도(dh/dp/dr)는 rad (VTD 2025.2 Doc/SCP_HTML: ViewRelative 단위 확인).
  enabled: true
  player: Ego
  dx: -6.5      # 자차 로컬 [m] — 뒤 6.5 m
  dy: 0.0
  dz: 2.6       # 위 2.6 m
  dh: 0.0
  dp: 0.0
  dr: 0.0
  show_owner: true   # <Camera showOwner> — 자차 표시

vehicle:
  # Ioniq 6 제원: 전장 4855 / 축거 2950 / 앞 오버행 855 / 뒤 오버행 1050 mm
  wheelbase: 2.944
  max_steer: 0.48
  length: 4.848
  width: 1.886
  height: 1.507
  front_overhang_m: 0.855
  # 경로 계획의 연결로 **'급회전' 경고 상한** (build_route 소비):
  #     R_min < 축거/tan(최대조향) × 이 값  →  리포트 [5] 가 WARN + tight_turns 기록.
  #
  # **통행 금지 임계는 더 이상 이 키가 아니다** — route.banned_r_min_m (기본 3.0)
  # 이 정한다 (2026-09-08 완화, 근거는 docs/BACKLOG.md B-29). 이 키는 "중심선을
  # 정확히 추종한다면 못 도는" 경계로만 남아, 그 대역을 지날 때 감속 진입임을
  # 리포트에 알리는 용도다. 옛 동작(=금지)으로 되돌리려면 route.banned_r_min_m
  # 을 5.65 로 올린다.
  #
  # 1.0 = 기하 최소반경 그대로 (2.944/tan(0.48) = 5.65 m).
  #
  # 옛 값 0.7(임계 3.96 m)의 근거였던 "R 4.52 m 연결로((550,0,-1)/junction 2)는
  # 여러 런에서 통과, t_off 최대 0.85 m" 는 **현행 제어기에 무효다**: 그 실측은
  # 2026-08-24(커밋 3202623) 것이고, 이틀 뒤 9ec313a 가 판단 자리를 정속 stub 으로
  # 비우고 phase3 에서 PDM-Lite 를 넣기 **전**이라 횡제어기가 지금과 다르다.
  # 근거 로그도 저장소에 없다 (최고 로그 2026-08-30 < 도입 08-24).
  #
  # 현행 제어기 실측 (2026-09-04, logs/ 49개 전수 · R<10 m 연결로 15개):
  #   R ≤ 5.06  → 4/4 이탈   |t_off| 1.68~2.46 m (차로 반폭 1.5 m 초과)
  #   R 5.43~6.47 → 경계     |t_off| 1.06~1.48 m
  #   R ≥ 7.70  → 5/5 양호   |t_off| 0.40~0.54 m
  #   ※ (2838,0,-1) R 4.94 는 3틱 표본이라 약하다 — 빼도 결론은 같다.
  # 1.0 은 실측 이탈군을 전부 잡고 양호군을 하나도 건드리지 않는 경계다.
  # ※ 위 실측은 **커브 감속(speed.curvature_cap, 2026-09-08) 이전**이다. 그
  #   이탈군은 R 에 무관하게 25 km/h 로 진입한 결과라, 지금은 √(a_lat·R) 상한이
  #   R 5.0 을 3.5 m/s 로 누른다. 그래서 이 대역을 '금지' 가 아니라 '경고' 로
  #   내렸다. 그래도 이 표는 **경고 대역의 근거**로 계속 유효하다.
  #
  # 속도 하향은 해결책이 아니다: (2921,0,-1) R 5.06 은 0~10 km/h 로 361틱을
  # 기어가면서도 |t_off| 1.43 m 를 유지했다. 추월집중_05_우회전5 의 두 런도
  # 진입 26.2 / 24.2 km/h 에 t_off 1.69 / 1.87 m 로 역전이다.
  #
  # 비용 실측: CSV 11개 전부 빌드 성공 · 경로 불변 (경유점 짝이 지정한 연결로에
  # 대안이 없으면 infeasible_forced 로 강제 통과 + 경고, rc=0 이라 batch 는 돈다),
  # 시나리오 생성 20/20 성공 (개수 미달 없음, gen_scenarios._route_feasible 이
  # walk 경로 단계에서 걸러 다른 시작점으로 재시도한다).
  # 위 비용 실측은 이 키가 **금지** 임계이던 시절 것이다 — 완화 뒤 실측은
  # docs/BACKLOG.md B-29 (39경로: 동일 37 · 짧아짐 2 · 실패 0, 총 −1,767 m).
  min_turn_margin: 1.0

# 붉은 노면 = 감속(보호) 구간. **감속 구간의 단일 출처다.**
# 붉은 포장은 xodr 에 없고 osgb 텍스처(StyleSrfBikeway, R131 G59 B59)로만 있어
# 월드 정점을 미리 뽑아 두었다. tools/build_lane_graph.apply_red_spans 가 이걸
# 차로 s 구간(red_spans)으로 바꾸고, school_zone bool 은 bool(red_spans) 로 남는다.
# 파일이 없으면 red_spans 를 만들지 않고 경고만 남긴다 (이전 동작).
red_zone:
  verts_json: data/red_surface_verts.json
  # 정점 하나마다 볼 kd 후보 점 수. 도로 전폭을 덮으므로 차로 여러 개에 동시에
  # 귀속돼야 한다 — 최근접 하나만 보면 옆 차로가 빈다.
  kd_candidates: 24
  # 차로 반폭에 더할 여유 [m]. 차로 경계 위에 찍힌 정점을 흡수한다.
  half_margin_m: 0.30
  # s 구간 병합 간격 [m]. 이보다 벌어지면 다른 구간으로 끊는다.
  span_gap_m: 3.0
  # 잡음 파편 제외 임계. 인접 차로 끝점(s=0 · s=length)에 스치는 정점이 파편을
  # 만든다. 실측 2026-09-05: 실체 124구간 4,252.9 m 대 파편 174개 합 **4.2 m** 로
  # 1000배 갈려 임계 선택에 민감하지 않다.
  min_verts: 20
  min_len_m: 1.0
  # 30 노면표시(roadmark_speed_30 · RM_518)를 제한속도로 쓸지 (tools/build_lane_graph
  # speed_cfg 가 읽는다 — lane_graph 를 다시 만들어야 반영된다).
  #
  # 대회 규칙상 **붉은 노면만** 보호구역이고, 붉지 않은 도로는 30 표시가 있어도
  # 도로 기본 제한(50)이 적용된다. 이 맵의 30 표시는 붉은 포장과 일치하지 않는다 —
  # 실측 2026-09-05: speed_limit=30 인 386 차로 14,548 m 중 **10,237 m 가 붉지 않다**
  # (RM_518 이 붙었는데 안 붉은 차로도 81개다. 어느 표시도 프록시가 못 된다).
  # 그 10 km 에서 27 km/h 로 묶여 완주 제한시간을 넘긴다 — replay 실측으로
  # 비붉은 30 구간 주행거리의 60.8% 가 캡(25 km/h)에 붙어 있다.
  #
  # false = 30 표시를 제한속도로 쓰지 않는다. 그 도로에 다른 표시가 없으면
  #         speed_limit 이 None 이 되어 런타임 carry 가 앞 값(대개 50)을 물고 간다.
  #         붉은 구간의 감속은 red_zone(아래) 이 따로 책임진다.
  # true  = 이전 동작 (30 표시 = 제한속도 30).
  roadmark_30_as_limit: false
  # 호환 모드 — red_spans 를 **읽지 않는** 제어기가 붉은 차로에서 최소한 30 을
  # 읽게, 차로 단위 speed_limit 도 limit_kph 로 세운다 (speed_src='red_compat').
  # 팀원 브랜치·구 배포가 이 lane_graph 를 그대로 쓸 수 있게 하는 안전망이다.
  #
  # 차로 단위라 **부분만 붉은 차로는 전 구간이 30 이 된다** — 예 (173,0,-1) 은
  # 414.7 m 중 236.7 m 만 붉은데 전체가 30 이다. 과다 감속이지만 안전 쪽이다.
  # red_spans 를 읽는 제어기(speed.red_span_enable)는 이 값을 무시하고 span 으로
  # 판정하므로, 둘을 동시에 켜도 과다 감속이 생기지 않는다.
  # false 면 붉은 차로의 speed_limit 은 노면표시 결과 그대로(대개 None)다.
  lane_level_compat: true
  # 보호구역 법정 제한속도 [km/h]. 붉은 구간 안에서 이 값이 speed_limit 을
  # 대신한다 (채점기 항목 2 의 기준이고, 제어기는 여기서 speed.margin_kph 를
  # 뺀 값을 목표로 삼는다).
  limit_kph: 30.0
  # 구간 이탈 쪽 여유 [m] — **제어기**가 캡 해제를 s1 이 아니라 s1 + 이 값까지
  # 미룬다. 정점 매핑 오차(최근접 거리 p95 1.72 m)와 차로 매칭 흔들림 때문에
  # 경계 직후에 재가속하면 실제로는 아직 구간 안일 수 있다.
  # **채점기는 이 값을 쓰지 않는다** — 실제 경계(마진 0)로 판정한다. 채점기가
  # 구간을 넓히면 규칙보다 엄해져 우리 리포트가 실채점과 어긋난다.
  exit_margin_m: 2.0

speed:
  # 제한속도에서 항상 빼고 달릴 여유. 감점이 시간보다 비싸다.
  # (phase3: VtdRoutePlanner 가 speed_limits 에 반영)
  margin_kph: 5.0
  # 붉은 구간(감속 구간)을 **차로 s 로** 판정할지 (lanegraph.speed_limit_at).
  # true = red_spans 안이면 red_zone.limit_kph, 붉은 차로인데 구간 밖이면
  #        호환값(speed_src='red_compat')을 무시하고 None → carry.
  #        부분만 붉은 차로가 전 구간 과다 감속되지 않는다.
  # false = 차로 단위 speed_limit 을 그대로 쓴다 (호환 모드면 전 구간 30).
  # 기본 on — 못 읽으면 항목 2 중대라 조용히 꺼지는 쪽이 더 위험하다.
  red_span_enable: true
  # 구역 제한속도를 **carry 에 넣지 않는다** (2b-C).
  # carry 규칙("표시 없는 도로는 직전 값 유지")은 그대로다. 바뀌는 것은 carry 를
  # 먹이는 값뿐 — lanegraph.road_limit_at (표시값만, 붉은 구간의 limit_kph 와
  # 호환 모드의 red_compat 30 제외) 이 carry 를 채우고, 구역 값은 그 위에 min 으로
  # 얹는다.
  # 왜: 켜기 전 실측(replay 54)에서 붉은 구간을 나온 뒤에도 30 이 carry 로
  # 따라가 **붉지 않은 구간 2,913.5 m** 가 25 km/h 로 묶였다. 채점기도 같은
  # 값을 봐서 붉은 적 없는 차로 3곳에 항목 1 위반 7건이 났다.
  # false = 이전 동작 (구역 값이 carry 에 들어간다).
  red_limit_no_carry: true
  # 붉은 구간(보호구역) **진입 전** 감속 — kr_rules._red_approach_profile.
  #     v_ceiling = sqrt(red_zone_target_kph² + 2 · approach_decel_mps2 · d)
  # d 는 다음 구간 진입점까지 남은 경로거리다. 구간 안에서는 후보를 안 낸다 —
  # 거기서는 제한속도(red_zone.limit_kph − margin_kph)가 이미 상한이다.
  #
  # 왜: 50 도로(45 km/h)에서 27 km/h 로 줄이려면 a=2.0 에 25 m 가 든다. 붉은
  # 구간은 중앙 25.1 m 이고 124개 중 43개가 18 m 미만이라, 진입 뒤에 줄이면
  # 구간 안에서 초과가 난다 (항목 2 는 1 km/h 초과 경미 / 5 초과 중대).
  # 실측 2026-09-05: 27경로 진입 19건 중 3건은 앞 구간과의 틈이 1.0~9.0 m 뿐이라
  # 그 사이에서 50 으로 가속하면 되돌릴 방법이 없다. 이 후보가 그 틈에서 천장을
  # 27.9 / 34.6 km/h 로 눌러 애초에 못 올라가게 한다.
  # false = 이전 동작 (진입 전 감속 없음).
  red_approach_enable: true
  # 진입 목표 속도 [km/h]. 위반 임계 31(=30+1)에 여유 4 를 뒀다. 구간 안 상한은
  # 이 값이 아니라 제한속도 − margin_kph (= 25 km/h) 다.
  red_zone_target_kph: 24.0
  # 진입 감속에 쓸 감속도 [m/s²]. speed.a_min(-6.0) 보다 훨씬 완만하다 — 미리
  # 눌러 두는 천장이지 제동이 아니다.
  approach_decel_mps2: 2.0
  # 진입점 탐색 거리 [m]. 45 km/h → 27 km/h 에 25 m 이므로 60 이면 충분하다.
  red_lookahead_m: 60.0
  # 종방향 명령 한계 (phase3 VtdLongitudinalController 가 사용)
  a_max: 2.0
  a_min: -6.0
  a_emergency: -8.0
  jerk_max: 2.0
  # 정지 유지 브레이크 (v_target=0 & v<0.2)
  a_hold: -1.0
  # 보행자 의도 감지 (P4, 2026-09-01 실전주행_교통류_01 t=430 접촉 −6).
  # PDM forecast_walkers 는 등속 2 s 예측(default_forecast_length)이라 예측
  # 도달거리가 v_ped·2 + pedestrian_minimum_extent(1.5) 다. 서 있던 보행자는
  # min_walker_speed(0.5) 하한만 적용돼 2.5 m 밖에 못 뻗어, 횡 6 m 에서
  # 걸어나오면 v_ped 가 1.7 m/s 가 돼서야 회랑에 닿는다 — 실측 0.5 s 지연으로
  # 필요감속이 3.31 → 4.29 m/s² 가 되어 a_dec_max(4.0)를 넘겨버렸다.
  # 여기서는 예측선 교차를 기다리지 않고 **경로 쪽 횡속도**로 후보를 만든다.
  # 0 이면 비활성 = 보행자를 PDM 예측에만 맡기는 이전 동작.
  ped_intent_v: 0.3
  # 위 후보의 필요 감속이 |control.a_dec_max| 의 이 배수를 넘으면 jerk 램프를
  # 건너뛰고 a_emergency 를 즉시 낸다 (보행자 후보 한정). 0 이면 비활성.
  # 실측: 후보 생성 후 −4.0 도달까지 1.0 s 가 걸려 그 사이 12.1 m 를 갔다.
  ped_emergency_ratio: 0.75
  # 보행자 래치 위치 기반 해제 (A-1, 2026-09-02 실전주행_교통류_02_좌회전8 id4).
  # 래치는 '지나감(뒤로 감)·관측 끊김' 으로만 풀렸는데, 횡단을 **마치고** 길가에
  # 선 보행자는 둘 다 아니라 로그 끝까지(118 s) 정지했다. 회랑 밖(|lat| >
  # ped_release_lat_m)에서 경로 쪽으로 오지 않고(v_toward ≤ 0) 멈췄거나(보행자
  # speed < ped_stop_v) 차도 밖(|lat| > ped_offroad_lat_m)이면 ped_release_s
  # 연속 시 해제. 도로 위를 걷는 동안은 되돌아올 수 있어 유지한다.
  # ped_release_lat_m 0 이면 비활성 = 이전 동작.
  ped_release_lat_m: 2.5
  ped_release_s: 1.5
  ped_stop_v: 0.2
  # ped_offroad_lat_m 은 코스 최대 폭의 보수값 — 4차로(2+2)에서 6.0 은 반대 차로
  # 한복판이라 '차도 밖' 이 아니다. 차선 그래프 기반 산출은 A-3.
  ped_offroad_lat_m: 12.5
  # backstop — 래치 후 이 시간이 지났고 지금 회랑 밖이면 조건 무관 해제.
  # 회랑 안이면 유지 (보행자가 경로 위에 서 있는 한 절대 안 푼다).
  ped_backstop_s: 30.0
  # ── 걷는 채로 등장한 보행자 래치 (A-4, 2026-09-03) ─────────────────────
  # _ped_intent 는 정지 관찰(obj_static_s)을 마친 보행자만 래치했다. GT 80 m 안으로
  # 걸어 들어오거나 걷는 상태로 스폰된 보행자는 그 전제에 걸려 래치가 없고, A-2 로
  # PDM 상자가 0.5 가 되어 PDM 검출도 3.44 → 2.44 m 로 늦어진다 (무단횡단 직결).
  # 정지 관찰 없이도 연속 ped_walkin_s 동안 보행자 속도 ≥ ped_intent_v ∧ 경로 쪽
  # 횡속도 ≥ ped_walkin_v ∧ |lat| < ped_walkin_lat_m 이면 래치. 정지 관찰 경로(0.3 /
  # 1틱)보다 임계·시간을 두는 것은 노이즈 여유. 래치 후 동작·해제는 A-1 그대로.
  # false = 이전 동작.
  ped_walkin_enable: true
  ped_walkin_v: 0.5
  ped_walkin_s: 0.5
  ped_walkin_lat_m: 8.0
  # ── 다중 보행자 회랑 홀드 (P4-M, 2026-09-04 실주행 101405). 기본 false. ───
  # 실측: id4·id5 가 12 m 앞 회랑(|lat| < 2.5)을 횡단하는 동안(k205~266) 의도
  # 후보는 정지 프로파일 √(2·a·(s_rel − 앞범퍼 − s0)) ≈ 5.1 m/s 였고, 적신호
  # IDM 후보(1.2 → 2.3)가 더 낮아 그쪽이 winner 가 되며 정지(0.01 m/s)에서
  # 재가속했다(k238~266, accel +0.7 → +0.95, 종거리 12.3 → 11.4 m). 판정은
  # 보행자 전부를 보지만(최저 v_allow) 회랑 안이라도 v_allow 가 0 이 아니었다.
  # true 면 회랑(ped_release_lat_m — A-1 해제와 같은 축) 안 보행자는 누구든
  # 홀드 래치 → v_allow = 0 을 min() 후보로 낸다. 해제는 A-1 규칙 그대로
  # (회랑 밖 ∧ 멀어짐 ∧ (멈춤 ∨ 차도 밖) 연속 ped_release_s, backstop 포함).
  # 회랑 밖 의도 래치의 접근 프로파일은 바꾸지 않는다. reasons.ped 에 평가된
  # 보행자 전부(all)와 홀드 id(hold)를 남긴다. false = 이전 동작.
  ped_multi_enable: true
  # 관측 드롭아웃 coast [s] — 이 시간 안의 미관측은 이탈이 아니다(직전 기여 유지).
  # 만료 + 재관측 없음 → 해제. release(ped_release_s)는 관측된 틱에서만, coast 는
  # 미관측 틱에서만 세므로 둘은 합산되지 않는다. ped_multi_enable 일 때만 의미.
  ped_hold_coast_s: 0.5
  # ── 횡단보도 앞 서행 (A-3, 2026-09-03). 기본 false = 비활성. ─────────────
  # 전방 횡단보도(레인그래프 crosswalks, 없으면 정지선) ±ped_crosswalk_zone_m 안에
  # |lat| < ped_crosswalk_lat_m 로 **서 있는**(speed < ped_stop_v) 보행자가 있으면,
  # 보행자 앞(idm_pedestrian_minimum_distance + 앞범퍼)에 정지 프로파일(④′ 형태)로
  # 서서 ped_crosswalk_wait_s 를 채운 뒤 보행자를 지날 때까지 v ≤ ped_crosswalk_creep_v
  # 로 통과한다. min() 후보다 — 오버라이드가 아니다. 대기는 정지 중(v < ped_stop_v)
  # 이고 계획 정지점 앞 ped_crosswalk_zone_m 안일 때만 센다 (먼 적신호 정지는 제외). _ped_intent 래치가 선 보행자는 그쪽이 맡고, 회랑 안
  # (|lat| < ped_release_lat_m) 보행자는 이 규칙 대상이 아니다(그건 정지).
  ped_crosswalk_creep_enable: false
  ped_crosswalk_zone_m: 10.0
  ped_crosswalk_lat_m: 4.0
  ped_crosswalk_wait_s: 3.0
  ped_crosswalk_creep_v: 2.0
  # 경로 종점(route_end) 계획 정지점 = 기준점 − stop_gap_route_end − 앞범퍼.
  # 완주 임계(end_margin_m)가 이 값을 따른다. (구 stop_gap_m — 정지선 정지와는
  # 무관하다: 정지선은 PDM red-light IDM 소관, 아래 stop_gap_stopline_m 참조)
  stop_gap_route_end_m: 4.0
  # ── 종료 구간 정적 장애물 무시 (2026-09-08, 실주행 1차) ────────────────
  # 종료선 앞 finish_gate_m 부터 경로 꼬리 끝까지, **정지 객체**를 회피·standoff
  # ·회랑 판정에서 뺀다 (_corridor_blockers 하나가 그 셋의 단일 관문이다).
  # 왜: 종료 지점은 주최측이 라바콘 2개로 표시하고, 그 콘은 좁은 연결로에서
  # 주행 회랑 안에 들어올 수 있다. 실측 실경로_01_PathShape03 은 콘을 장애물로
  # 잡아 종료선 17 m 앞에서 영구 정지했다(미완주). 생성기 쪽은 콘을 도로 끝으로
  # 옮겨 고쳤지만(gen_placement.cone_at_road_edge), **주최측 콘 위치는 우리가
  # 못 정한다** — 대회에서 같은 일이 그대로 난다.
  # 하필 이 구간은 다른 안전망도 전부 죽어 있다: route_end.active_m(150 m) 안이라
  # _obstacle_cause 가 거짓이고, 그래서 BREAKOUT·크립·never_stall 이 전부 안 선다.
  # 움직이는 객체는 계속 본다 (속도 임계는 overtake.blocker_speed_max 를 그대로
  # 읽는다 — "회피가 정지로 보는 속도" 의 단일 출처다). PDM 의 IDM 추종과
  # 보행자 정지도 그대로다 — 여기서 빼는 것은 kr 의 회랑 계열 판정뿐이다.
  # false = 이전 동작.
  # true (2026-09-08): replay 검증 통과 — 같은 로그 rs ≥ 835 구간에서 v_target
  # < 0.2 인 틱이 489(24.4 s) → **0**, standoff 후보 495틱 → **0**.
  # 51 로그: decision 이 달라진 3건 전부 **진단 키만** 늘었고 v_target·state 는
  # 전 틱 동일 — 켜도 속도가 바뀌는 로그가 하나도 없다.
  finish_gate_ignore_enable: true
  # 게이트를 **자차 위치**가 아니라 **객체 위치**로 판정할지 (2026-09-09).
  # 자차 기준은 판정 시점이 늦다 — 회피 시프트는 자차가 종료 구간에 들어오기
  # 훨씬 전에 결정된다. 실측 20260909_093415/실경로_02: 종료선 콘 2개의
  # **객체 route_s 가 749.2 로 종료선과 같은데**, 자차 rs 700 (s_rel 49.3)에서
  # 이미 시프트가 생성돼 rs 723~751 을 0.9 m/s 로 25 초 왕복했고 종료 차로
  # (418,2,-1) 이 아니라 -2 로 끝났다(횡오프셋 −3.07 m). 자차 기준 게이트를
  # 30 → 49.3 초과로 넓혀도 그 순간을 못 덮는다 — 판정 축 자체가 틀렸다.
  # 객체 기준이면 같은 콘이 **감지 즉시** 빠진다 (자차 rs 192.5, 556 m 앞).
  # false = 이전 동작(자차 route_s 기준).
  finish_gate_by_object_enable: true
  # 종료선 앞 몇 m 부터 적용할지 [m]. 10 → 30 → **10** (2026-09-09).
  # 30 이었던 이유는 **자차 기준 판정 때문**이었다 — 콘이 회랑에 들어오는
  # 순간(blocker_dist_max 30 m) standoff 가 서는데 자차 기준 게이트는 10 m 앞에서야
  # 열려 이미 선 뒤였다(실경로_01: 24.0 m standoff 등장 → 17.3 m 정지).
  # 객체 기준으로 바꾸면 그 이유가 통째로 사라진다 — 게이트는 자차가 어디 있든
  # 열려 있다. 그러면 **좁을수록 낫다**: 이 창 안의 정지 차량도 kr 회랑에서
  # 빠지므로, 실제 장애물을 놓칠 여지를 종료선 코앞으로 줄인다.
  # 10 이 충분한 근거: 콘은 종료 지점을 표시하는 물건이라 종료선 위에 선다.
  # 실측 실경로_02 콘 2개 = route_s 749.2, finish_s 749.2 (오차 0.0 m).
  finish_gate_m: 10.0
  # ── 적색 점멸 일시정지 (B3 / 채점 항목 9, 중대 −6) ──────────────────────
  # 9910 state 6 = 점멸. 이 맵의 점멸 컨트롤러는 117 하나뿐이고 **적색**으로
  # 확정됐다 (배포본 7개 전부 blink=117, Signal 373 type 1000020=적, 실기 육안
  # 2026-09-01). 황색 점멸은 이 맵에 없다. 6 은 **지속 플래그**라 램프 on/off
  # 위상이 9910 에 안 실린다 (실측: 629틱 35.7 s 동안 6 고정, 전이 0회).
  #
  # 켜면 state 6 → TrafficLightState.FlashRed 로 매핑된다. PDM 에는 "녹색이
  # 아닌 것" 이라 **적신호 IDM 이 정지선까지 정지 프로파일을 그린다** — 상한형이
  # 아니라 정지 축이다 (CLAUDE.md 확정 사실). kr 은 "충분히 섰나" 만 판정해
  # signal_release 로 풀어 준다. 래치는 신호 id 단위라 같은 선에 다시 안 선다.
  # false = 이전 동작 (6 → 녹색, 무정차 통과 = 항목 9 중대).
  # true (2026-09-09): 단위 테스트로 정지·유지·재출발 3단계 확인, replay 로
  # ④′ 정지 프로파일이 정지선 −0.55 m 에서 v_target 0 을 내는 것까지 확인.
  # 폐루프 확인은 배치에서 한다.
  signal_flash_stop_enable: true
  # 정지 유지시간 [s]. 규정은 0.5 s 이고 채점기(detect_blink_stop)는 그 값을
  # **넘겨야** 인정하므로 여유를 둔다. 판정 임계(2 m·정지속도)는 새로 만들지
  # 않고 scoring.stop_ok_m / score.stop_speed_mps 를 그대로 읽는다.
  flash_hold_s: 0.8
  # ── 연결로 곡률 감속 (B1 / 실주행 1차 [2], 2026-09-08) ─────────────────
  # 실측 실경로_01_PathShape03 rs 89~107: 연결로 797(R 6.47 m)에 6.8 m/s 로
  # 진입해 조향이 −0.480 에 **9 m 동안 포화**하고 t_off 가 1.36 m 까지 벌어진
  # 뒤 +0.480 으로 되튀었다(차로유지 감점). 그 구간 reasons.curvature 는 전 틱
  # None — 곡률을 보는 속도 후보가 **아예 없었다**.
  # 앞 curvature_lookahead_m 경로의 최대 곡률로 상한을 만든다:
  #     v_cap = √(curvature_a_lat_max / κ_max)
  # 정지선 프로파일과 같은 자리의 min() 후보다 (오버라이드 아님).
  # false = 이전 동작.
  # true (2026-09-08): [3](b) 램프 맞춤으로 rs 390~410 의 경로 R 이 3.0 → 20.7 m
  # 로 회복돼 그 구간 과감속(2.75 m/s) 우려가 사라졌다. 연결로 797(R 6.5)에서는
  # 의도대로 4.02 m/s 로 누른다.
  curvature_cap_enable: true
  # 앞을 보는 거리 [m]. 전이가 시작되기 전에 속도가 내려가 있어야 하므로
  # 15 m = 6.8 m/s 에서 약 2.2 s 앞이다.
  curvature_lookahead_m: 15.0
  # 허용 횡가속 [m/s²]. **이름을 a_lat_max 로 쓰면 안 된다** — 같은 speed 매핑에
  # 아래 _shift_speed_cap 용 a_lat_max(1.5)가 이미 있어서, 중복 키가 되면 YAML 이
  # 뒤엣것을 채택해 이 값이 조용히 무시된다 (2026-09-08 실제로 그렇게 짜서
  # v_cap 이 4.03 대신 3.12 로 나왔다).
  # 2.5 는 시프트 전이 쾌적값(1.5)과 마찰 한계 사이다 — 연결로는 이미 저속이라
  # 조금 더 허용해도 승차감이 무너지지 않는다.
  # R 6.5 m 에서 v_cap = √(2.5·6.5) = 4.03 m/s (14.5 km/h).
  curvature_a_lat_max: 2.5
  # 이 값보다 큰 곡률만 본다 [1/m]. 직선의 수치잡음이 상한을 만들지 않게 한다
  # (1/200 m = R 200 m 이상은 무시). 0 이면 전부 본다.
  curvature_min_kappa: 0.005
  # ── 차선변경 구간 속도 상한 (실주행 1차 [3](a), 2026-09-08) ────────────
  # 실측 실경로_01_PathShape03 rs 413~455: 도로 418 에서 차선변경 4회 연속인데
  # 자차가 그 구간에서 8 → 13.3 m/s 로 **가속**했다 (붉은 구간이 rs 290 에서
  # 끝나 제한 50). 램프 길이는 v × lc_move_s 라 속도에 비례하므로 39 m 로
  # 구워졌고 hop 간격 20 m 를 넘어 겹쳤다 — 경로가 2차로를 한 번에 건너는
  # S자가 되어 heading_err +31°, 조향 포화 4회, |t_off| 1.85 m.
  # (b) 램프 맞춤만으로는 부족하다: 48 km/h 에 17 m 램프면 요구 횡가속이
  # 5 m/s² 라 더 흔들린다. **속도와 램프를 같이** 잡아야 한다.
  # 창 진입 전 감속은 정지선 프로파일과 같은 식이다: v = √(cap² + 2·a·d).
  # false = 이전 동작.
  # true (2026-09-08): rs 400~460 v_target 최대 12.50 → 5.56 m/s.
  lc_speed_cap_enable: true
  # 차선변경 창 안 속도 상한 [km/h]. 20 km/h = 5.56 m/s → 램프 v×lc_move_s =
  # 16.7 m 로 hop 간격 20 m 안에 들어간다.
  # 지시등 3 s 선행은 20 km/h 에서 16.7 m 라 hop 간격 20 m 에 여전히 못 미친다 —
  # 그건 이 항목으로 못 고친다 (경로 생성이 hop 을 더 벌려야 한다).
  lc_speed_cap_kph: 20.0
  # 다음 창이 이번 창 끝에서 이 거리 안에 시작하면 **연속 hop** 으로 보고
  # 창 사이에서도 상한을 유지한다 [m]. 사이에서 가속하면 다음 램프가 다시
  # 길어져 겹친다.
  lc_hop_chain_sep_m: 25.0
  # 창을 이만큼 앞에서부터 본다 [m]. 접근 프로파일은 멀면 값이 커서 어차피
  # min() 에 지지만, 후보를 계속 만들면 진단이 전 구간에 찍혀 "언제 실제로
  # 걸렸나" 를 못 읽는다 (실측: 창 거리 제한 없이 두니 18,868틱 중 18,017틱에
  # 후보가 존재했다 — 구속한 틱은 그중 일부다).
  # 60 m 는 20 km/h 로 줄이는 데 필요한 거리(√ 프로파일로 약 47 m)에 여유를 둔 값.
  lc_speed_cap_look_m: 60.0
  # 정지선(적신호) 정지: 앞범퍼가 정지선 앞 이 거리에 서도록 run_agent 가
  # PDM 의 idm_red_light_minimum_distance 를 (이 값 + 앞범퍼 3.8)로 주입한다
  # (PDM 원문 무수정). 대회 7번: 범퍼가 선 앞 2 m 이내 정지 = 정상, 통과 = 중대.
  # 실측 오버런 산포 −2.3~+2.2 m — 넘김(중대) 방지를 우선해 1.5 (백로드 완화는
  # 별도 작업으로 후속).
  #
  # 2026-09-07 1.5 → 2.0 (승인). 근거: 020738 16런 + 014910 적신호 정지 82건
  # 실측(scratchpad/stopgap). 최종 정지 앞범퍼 중앙값 −0.83 (PDM IDM 착지
  # −0.59 / ④′ 프로파일 착지 −1.17 — 착지 모드가 0.6 m 갈린다), 넘음 5건.
  # 운전자 관찰상 정지선 밀착이 위험해 보여 당긴다. 2.0 이면 예상 중앙값
  # −1.33 (IDM −1.09 / 프로파일 −1.67), 넘음 5 → 0. 2.3 이상은 프로파일
  # 착지의 절반이 규정·채점기 원거리 경계(score.stop_ok_m 2.0) 를 넘어 경미가
  # 되므로 쓰지 않는다. rtor_stop_zone_m(2.0) 은 규정 2 m 와 같은 축이라 유지.
  # 이 값은 네 정지 후보(PDM IDM · _stopline_profile · _stopline_hold 무장 ·
  # 황색 STOP 래치)의 s0 를 한꺼번에 움직인다 — 다른 키는 없다.
  # 주의: 야간 배치 오버슛 4건(07 t=88·532, 11 t=328, 16 t=117, +0.07~+0.34)은
  # 여유 부족이 아니라 **저속 접근(4~6 m/s) 에서 PDM IDM 이 선 8 m 앞까지
  # 속도를 유지시키고 프로파일이 4 m 앞에서야 구속해 jerk 램프가 못 따라간**
  # 별개 원인이다. 이 값으로 선 안(−0.2~−0.45) 에는 들어오지만 원인은 남는다.
  stop_gap_stopline_m: 2.0
  # 정지선 정지 유지 시간 [s] — 규정 "0.5 s 이상 정지" + 여유 (kr_rules 홀드,
  # 실측 0.4 s 만에 재출발한 사례가 감점 대상이라 도입)
  stopline_hold_s: 1.0
  # 규정이 요구하는 **최소** 정지 시간 [s]. 녹색 전환 시 이미 이만큼 서 있었으면
  # stopline_hold_s 의 잔여를 즉시 버린다 (B-1). 못 채웠으면 모자란 만큼만 남긴다.
  # 실측(2026-09-01 실전주행_교통류_01) 녹색 후 출발 1.65~2.90 s 중 0.30~1.15 s 가
  # 이 잔여였다 — 매 틱 재무장하던 옛 동작 탓이다.
  stopline_hold_min_s: 0.5
  # 정지 유지 홀드를 걸 정지선 근접 창 [m, 앞범퍼 기준] — 언더슛 정지(실측
  # −4.5 m)도 잡아서 최소 0.5 s 는 채운다 (위치 경미는 남아도 무정차 중대는 방어)
  stopline_hold_near_m: 6.0
  # 적신호 정지선 정지 프로파일의 쾌적 감속 [m/s²] (kr_rules._stopline_profile).
  # v_allow = √(2·a·(정지선거리 − s0)) 를 min() 후보로 덧대 단조 감속을 만든다.
  # PDM 의 적신호 IDM 은 차간모형이라 접근 중 가속을 요구하고(실측 err/dt +10.5),
  # 종방향이 브레이크를 풀어 타행 2.5 m → 정지선 −0.12 m 착지가 나왔다.
  # 0 으로 두면 후보를 만들지 않는다 = 이 기능만 끄는 스위치.
  # 3.0 은 잠정값 — 종단 급제동 체감은 실주행 후 튜닝 (2026-08-30).
  stop_profile_a: 3.0
  # 황색 딜레마 원샷 판정의 판정 감속 [m/s²] (kr_rules._yellow_latch).
  # 황색 인지 순간 1회만 판정한다: v ≤ √(2·a_yellow·(정지선거리 − s0)) → STOP
  # (적색과 동일 취급: 프로파일·홀드 발동), 아니면 GO (신호·정지선 유래 후보
  # 미생성, 현재 속도 유지 통과). 결정은 접근당 래치 — GO 중 적색 전환에도
  # 번복하지 않는다 (교차로 한복판 급제동 방지).
  #
  # **STOP 우선**이 채점표에서 나온 편향이다: 황색 정지를 감점하는 항목이 없고
  # (항목8 5 s 카운트는 녹색 틱만 센다), 적색 통과·걸침은 항목7 중대다. 게다가
  # 채점기는 **통과 순간의 신호**로 판정하므로 GO 로 나갔다 적색에 걸리면 그대로
  # 중대다. 그래서 STOP 영역을 넓게 두는 편향 자체는 유지한다 — 다만 **설 수
  # 있다고 판정한 것은 실제로 설 수 있어야** 한다. 그게 아래 4.0 → 3.0 이다.
  # 이건 **판정 전용** 상수다. STOP 이면 실행은 stop_profile_a(3.0)로 한다 —
  # 판정과 실행을 같게 두면 STOP 정의상 진입 시 프로파일이 느슨해 늦게 구속되고,
  # 그때는 최대 감속을 여유 0 으로 요구해 jerk 램프인에 진다 (폐루프 12조건에서
  # 걸침 6건). 실행을 작게 두면 진입 즉시 구속되고 여유가 남는다 (걸침 0건).
  #
  # 4.0 → 3.0 → **4.0** (2026-09-09). 아침에 3.0 으로 내린 이유는 "판정이 jerk
  # 램프 지연분을 안 본다" 였다 — 그 진단은 맞았지만 **처방이 틀렸다**.
  # 지연분은 v·t/2 로 **속도에 비례**하는데 상수를 내리면 저속 접근까지 똑같이
  # 보수적으로 만든다. 그리고 같은 지연이 실행 축(stop_profile_a)에도 있어서
  # 판정만 고쳐서는 정지선 침범이 안 없어졌다 — 20260909_093415 에서 침범이
  # 9건(최대 +3.28 m) 그대로 났다.
  # 지금은 `speed.stop_jerk_compensate_enable` 이 **판정·실행 두 축 모두**에서
  # d_eff 에서 v·(a/jerk_rate)/2 를 뺀다. 그러면 이 상수는 다시 원래 의미
  # ("확실히 실행 가능한 최대 감속" = a_dec_max 와 같은 4.0)로 돌아간다.
  # **상수 두 개가 같은 일을 하면 안 된다** — 지연 보정은 보정식 한 곳에만 있다.
  # 값이 실행 상수 stop_profile_a(3.0)와 다시 갈라졌고, 역할도 원래대로 다르다.
  # 0 으로 두면 판정하지 않는다 = 황색을 PDM 원문에만 맡기는 기존 동작.
  a_yellow: 4.0
  # ④′ 정지 프로파일·황색 판정에서 **jerk 램프 지연분**을 거리에서 뺄지.
  # 둘 다 √(2·a·d) 인데 이 식은 "지금부터 a 를 즉시 낸다" 를 전제한다. 실제로는
  # a 도달에 t = a / (jerk_dec_mult × jerk_max) 가 걸리고 그동안 평균 감속이
  # 절반이라 **v·t/2 를 더 간다** (a 3.0 / jerk 6.0 → t 0.5 s → 12 m/s 에서 3.0 m).
  # 실측 20260909_093415 정지선 침범 9건: 접근 속도가 전부 43~49 km/h 고 침범량
  # 최대 +3.28 m — 보정량과 같은 자릿수다. 예: 실전주행_교통류_07 rs 870.8 은
  # 신호가 28 m 밖에서 이미 적색인데 ④′ 가 −7.6 m 에서야 구속했다.
  # 속도 의존이라 저속 접근은 거의 영향이 없다 (상수를 낮추는 것과 다른 점).
  # false = 이전 동작.
  stop_jerk_compensate_enable: true
  # 황색 판정 **거리 한계** [m] (2026-09-09). 0 = 무제한(이전 동작).
  # 황색 딜레마는 정지선이 가까울 때만 존재한다. 거리 조건이 없으면 300 m 밖
  # 황색에도 STOP 이 래치되고, 그 래치(y_decision)가 `_obstacle_cause` 를
  # 거짓으로 만들어 **크립·BREAKOUT·never_stall 을 전부 죽인다** — 20 m 앞
  # 정지 차량에 막혀도 탈출구가 하나도 안 열린다.
  # 실측 20260909_093415 (quick 7건 중 blocked 4건의 뿌리):
  #   11_직진10   rs 477.7  황색 STOP 래치 d_line **150.8 m** (장애물 20.1 m)
  #   18_연속교차로14 rs 2590.5 황색 STOP 래치 d_line **317.3 m** (장애물 22.0 m)
  # 값은 speed.red_lookahead_m(60)와 같은 눈금이다 — "적색이 의미를 갖는 거리".
  # 그 밖의 황색은 도착 전에 적색→녹색으로 한 바퀴 돈다.
  yellow_decide_max_m: 60.0
  # PDM 의 `traffic_light_hazard` 를 **장애물이 정지선보다 훨씬 앞일 때** 무시할지.
  # (2026-09-09) PDM 은 적신호가 앞에 있으면 hazard 를 세우는데, 그걸 그대로
  # "신호가 정지 원인" 으로 보면 정지선이 **150 m** 밖인데 20 m 앞 정지 차량에
  # 막힌 경우까지 신호 대기로 분류돼 **크립·BREAKOUT·never_stall 이 전부 안 열린다**.
  # 실측 20260909_093415 (quick 7건 중 blocked 4건의 뿌리):
  #   11_직진10  정지 1635틱 중 **1167틱**이 traffic_light_hazard 분기
  #              (장애물 20.1 m / 정지선 150.8 m)
  #   18_연속교차로14 같은 꼴 (장애물 22.0 m / 정지선 62.0 m)
  # 기준은 새로 만들지 않는다 — 대기열 판정의 overtake.queue_head_max_m(25)를
  # 그대로 읽는다 ("대기열 선두는 정지선을 향해 선다", _head_near_stopline 과 같은 잣대).
  # 장애물이 없거나 정지선과 가까우면 이전 동작 그대로다. false = 이전 동작.
  tl_hazard_far_blocker_enable: true
  # 적신호 접근에서 **가속 금지** (2026-09-09). PDM 의 red-light IDM 은
  # 차간모형이라 남은 거리가 s* 보다 조금만 커도 **가속을 요구한다**. ④′ 는
  # √ 프로파일이라 그 구간에서 아직 v 위에 있어 min() 에서 지고, 차가 붙었다가
  # 급제동한다 — 이것이 "정지선 앞 찔끔찔끔" 의 정체다.
  # 실측 20260909_093415/실경로_02: 적색 접근 667틱 중 **290틱(43.5 %)** 이
  # 목표 > 현재속도, 최대 **+4.17 m/s** (slf −14.7 에서 v 5.44 인데 목표 6.15).
  # 감속은 그대로 두고 **가속만** 막는다. 거리 한계는 speed.red_lookahead_m 를
  # 그대로 읽는다 (300 m 밖 적색까지 걸면 정상 주행이 죽는다).
  # 상한형이라 cap 축이다 (err/dt 금지 — CLAUDE.md 확정 사실). false = 이전 동작.
  no_accel_toward_red_enable: true
  # 정지선 앞에 **선 뒤** 미세 전진을 막는 래치 (2026-09-09).
  # stopline_hold_s(0.5 s)가 끝나면 ④′·IDM 이 0.03~0.12 m/s 를 내주어 0.2 m 씩
  # 기어간다 — 실측 02 정지 3회 중 2회, 07 5회 중 2회에서 v 가 0.1 을 넘었다.
  # 정지 대상이 살아 있는 동안만 0 이고, 녹색이 되면 대상이 사라져 **저절로**
  # 풀린다 (출발 지연 0). false = 이전 동작.
  stopline_creep_latch_enable: true
  # 교차로 통과 가드 상한 [m] — 앞범퍼가 정지선을 넘은 뒤 교차로 진입이
  # 관측되지 않아도 이 거리를 지나면 가드를 푼다 (고착 방지).
  yellow_guard_max_m: 60.0
  # ── RTOR 적색 신호 우회전 (2026-09-06 승인, kr_rules._rtor_tick) ─────────────
  # 우회전 접근로의 적신호에서 정지선 앞 정지(항목 7) 를 마친 뒤, 선두이고
  # 보행자·교차 차량이 없으면 저속으로 우회전을 진행한다. 출발 경로는 B-3 와
  # 같다 — _stop_target 이 None, signal_release 가 True (신호 정지 후보만 놓는다.
  # IDM 추종·standoff·보행자·보호구역·제한속도는 min() 그대로). 래치는 (신호 id,
  # 정지선 s) 로 붙어 정지선을 지나 다음 신호로 넘어가면 적용되지 않는다.
  # 리셋 = fresh 녹색 / 뒷축이 교차로 차로를 벗어남 / 정지선 + rtor_release_dist_m.
  # false = 이전 동작 (틱 단위 동일). **VTD 폐루프 검증 전에는 켜지 않는다.**
  rtor_enable: true
  # 앞차 없이 유지된 stale red(미보고 후 마지막 신호 Red)도 적색으로 인정
  rtor_allow_stale_red: true
  # 수동 제외 신호(controller) id — 화살표 신호 교차로 등 (데이터로 판정 불가)
  rtor_exclude_tl_ids: []
  # 정지선 s ~ +이 거리 안의 turn_right 이벤트를 같은 교차로로 짝짓는다 [m]
  # (실측 이벤트 s 는 정지선 +0.1~0.2 m)
  rtor_turn_event_window_m: 5.0
  # 정지 판정 속도 상한 [m/s] 와 정지 구역 [m, 앞범퍼 → 정지선]
  rtor_stop_v_max: 0.3
  rtor_stop_zone_m: 2.0
  # 구역 안 정지 누적 시간 [s] — 항목 7 의 0.5 s ×2. 조건이 깨지면 0 부터.
  # (−3 m 이중 정지의 첫 정지는 구역 밖이라 세지 않는다)
  rtor_stop_hold_s: 1.0
  # 정지선~회전 종료 경로 주변 이 반경 안 보행자는 차단 [m] (회랑 홀드·의도
  # 래치·PDM walker 플래그와 별도의 추가 방어)
  rtor_ped_guard_m: 8.0
  # 교차 차량 차단 — 거리 [m] 또는 TTC [s]. 대상은 lg.locate 로 잡은 차로의
  # successor 가 자차 다음 교차로에 속하고 자차 도로가 아닌 차량(1차), locate
  # 실패 차량은 자차 프레임 좌측/전방 접근만 본다(2차). 정지 차량은 제외.
  rtor_cross_gap_m: 40.0
  rtor_cross_ttc_s: 6.0
  # 래치 중 속도 상한 [km/h] — min() 후보 (교차로 30 km/h·곡률 상한과 min)
  rtor_go_speed_kph: 15
  # 교차로 차로 이탈 판정이 안 될 때의 안전 상한 [m, 뒷축 s − 정지선 s]
  rtor_release_dist_m: 30.0

ego:
  # 소멸 차로 → successor 인계 첫 틱의 t_off 클램프 산물 보정 (vtd_adapter/ego.py).
  # 자차가 successor 시작점 앞에 있으면 끝점까지 거리 대신 접선 연장 기준으로 t 를 잰다.
  # 2026-09-06 배치 01: 로그 t_off −1.34 vs 실제 +0.06 (rs 1007/1067/1823).
  # false = 이전과 동일. 옛 로그 재채점은 scoring.lane_departure_taper_handover_m.
  handover_tangent_enable: false

percep:
  horizon_m: 200.0
  coast_s: 1.5
  # courseRespawn 감지 문턱. 실제 리셋 이동량이 3.3 m 남짓이라 그보다 낮아야 한다.
  jump_m: 2.0
  speed_lpf: 0.3
  # 속도 추정 슬라이딩 창 [s] (Σ변위/Σ벽시계 dt). 9910 송신 간격이
  # 40/80 ms 로 불규칙해 틱 단위 d/dt 는 못 쓴다 (2026-08-23 실측).
  speed_win_s: 0.4
  # respawnPoseToleranceM=1.5 라 실제 리셋 이동량은 3 m 남짓이다.
  reset_route_s_drop_m: 5.0
  # 경로 차로에서 몇 칸까지 걸어가 route 인덱스를 찾을지. 1 = 이전 동작
  # (2칸 시프트 중 off_route 로 떨어져 route_s 가 섹션 길이만큼 뒤로 뛴다).
  route_index_hops: 1
  stall_dt_s: 0.2          # 이보다 긴 틱 간격은 '스톨'로 분류
  stall_teleport_m: 50.0   # 스톨이라도 이동량이 이보다 크면 텔레포트 = 리셋
  reset_speed_factor: 3.0
  reset_abs_speed: 30.0
  reset_toff_jump_m: 2.0
  # 공식 확인: 객체는 수평거리 80 m 이내만, 가까운 순 최대 30개
  gt_range_m: 80.0
  range_margin_m: 5.0
  # ── 정적 장애물 인식 (경로 전방) ────────────────────────────────────────
  # PDM 의 선행차 판정은 "경로 2.5 m 이내 + 진행방향 35° 이내" 다. 정적 장애물
  # (라바콘·공사 자재·비스듬히 선 차·파손물)은 heading 이 아무 방향이나 될 수
  # 있어 35° 조건에서 빠지고, IDM 감속이 안 걸려 OBB 충돌예측이 코앞에서 급제동
  # 하는 것만 남는다. 그래서 **정지한 객체는 방향을 묻지 않고** 경로를 막는지만 본다.
  obstacle_speed_max: 0.5     # 이 속도 미만이면 정적으로 본다 [m/s]
  # 막는가 판정: 경로 중심까지 횡거리 < 차폭/2 + 객체폭/2 + 이 여유 [m].
  # 크기에 비례하므로 라바콘(0.3 m)은 1.4 m 안, 승용차(1.8 m)는 2.1 m 안에서 잡힌다.
  # 갓길에 비켜 선 물체까지 세우지 않으려면 이 값을 키우지 말 것.
  obstacle_clearance_m: 0.3

control:
  # 종방향 (VtdLongitudinalController). 가속: P (kp — 기존 검증값).
  kp: 0.8
  # 감속: PDM IDM 의 target 은 "1틱 전방 속도"라 P 로 따르면 의도 감속이
  # kp·dt(1/25)로 희석돼 정지선을 지나친다 (폐루프 시뮬 11.4 m 오버런).
  # (target−v)/dt = IDM 의도 감속을 이 상한으로 클램프해 실행한다.
  # -4.0 은 실기 신호 접근 감속 실측(-3.98)과 같은 축. a_min(-6)은 hazard 전용.
  a_dec_max: -4.0
  # 감속 방향 jerk 완화 배수 (제동 진입 지연 방지 — 시뮬: ×3 에서 종점 3.5 m 전 정지)
  jerk_dec_mult: 3.0
  # ── 정상상태 속도 상한의 감속 축 (실주행 2차 [1], 2026-09-08) ────────────
  # 위 a_dec_max 는 **PDM IDM 의 "1틱 전방 목표"** 를 실행하는 축이다:
  # (target−v)/dt 가 곧 IDM 의도 감속이라 1/dt = 20배 증폭이 의도된 것이다.
  # 그런데 곡률 상한([2])·차선변경 상한([3])은 "이 속도를 넘지 마라" 인
  # **정상상태 상한**이라 그 식이 성립하지 않는다. 같은 축에 태우면 목표가
  # 실속도보다 0.20 m/s 낮기만 해도 −4.0 이 나간다.
  #
  # 실측 20260908_222954/실경로_01: 목표 위(v_target > v+1)인데 급제동한 구간이
  # 11곳, min accel −3.9. rs 363.8~366.0 은 목표 5.56 m/s 인데 **완전 정지**했다.
  # 되먹임 구조다 — 20배 증폭으로 −4.0 → jerk 램프(+0.1/틱)로 푸는 데 1.75 s →
  # 그 사이 상한 아래로 언더슛 → 다음 창에서 다시 포화.
  #
  # 상한을 따를 때는 P 로 부드럽게 붙이고 이 값으로만 클램프한다. 상한형 후보가
  # **최종 목표를 정한 틱에만** 적용된다 (kr_rules 의 cap_binds) — 정지선·보행자·
  # standoff 가 이기면 그쪽 실행축(err/dt)이 그대로다.
  # false = 이전 동작(전부 err/dt).
  cap_soft_dec_enable: true
  # 상한 추종 감속의 최대치 [m/s²]. −1.5 는 곡률 상한의 전방주시 15 m 가
  # 전제한 감속과 같은 축이다 — 6.9 → 4.0 m/s 를 15 m 에 줄이는 데 1.05 필요.
  # 여유를 조금 둔 값이고, 더 급한 감속이 필요한 상황(정지선·보행자)은 애초에
  # 상한형 후보가 아니라 위 a_dec_max 축으로 간다.
  a_cap_dec_max: -1.5
  # 상한 추종 P 이득. 가속측 kp 와 같은 값으로 둔다 (비대칭을 만들 이유가 없다).
  kp_cap_dec: 0.8
  # 순수 제한속도도 상한으로 볼지. PDM 의 중재 전 목표(제한속도 ∧ 교차로 상한)를
  # **아무도 줄이지 않은** 틱이면 최종 목표는 IDM 의 1틱 전방 값이 아니라 그냥
  # 상한이다. 실측 rs 55.6~65.0: 제한 6.94 m/s 에 v 7.26 (0.32 초과) 인데 −4.0 이
  # 나가 4.25 m/s 까지 밀렸다 — 제한을 지키려던 게 12 m 짜리 급제동이 됐다.
  # 적신호·선행차·정지 프로파일이 이기면 목표 < 중재 전 목표라 여기 안 걸린다.
  # false = 이전 동작.
  cap_limit_target_enable: true
  # B-2 좁은 패치 — 정지해 있는데 목표가 살아 있으면 제동 잔량을 램프 없이 턴다.
  # 실측 2026-09-01 실전주행_교통류_01 t=414.1~417.1: 교차 차량에 급제동(−4.0)한
  # 뒤 그 차가 지나가 winner=none / v_target=8.33 이 됐는데도 jerk 램프(+0.1/틱)
  # 때문에 3.00 s 를 더 서 있었다 (녹색 신호 중). 정지 후보가 하나도 없고 목표가
  # release_v 이상인데 v < release_eps 면, 남은 제동 명령을 0 으로 즉시 해제한다.
  # ④′ 접근 중에는 v 가 커서 걸리지 않고, 목표 0(홀드·프로파일 종단)은 상위
  # a_hold 분기가 먼저 반환하므로 정지 위치에 영향이 없다.
  # release_eps: 0 이면 비활성 = 이전 동작.
  release_eps: 0.2
  release_v: 0.5

map:
  # tools/build_lane_graph.py 의 xodr 파싱 상수.
  #
  # laneOffset 중복 s 타이브레이크 (작업18, 2026-09-04).
  # 이 맵의 laneOffset 표에는 **같은 s 에 레코드가 둘** 있는 곳이 51 군데다.
  # 앞 구간을 닫는 종결자(b=0)와 다음 구간을 여는 램프(b≠0)가 같은 s 를 갖는데,
  # 둘의 s 가 부동소수 오차만큼(도로 2803 은 6.4e-12) 어긋나 있어 정렬이
  # 문서 순서를 뒤집는다. poly_eval / poly_eval_arr 은 "s 이하의 마지막 조각"을
  # 고르므로 뒤로 밀린 종결자가 실제 램프를 덮어쓴다.
  #   도로 2803: road_s 25.951~28.351 에서 오프셋이 1.9 로 고정 → 차로 -1 의
  #   폭만 1.90→3.30 으로 커지면서 (2803,2,-2) 중심선이 1.195 m 안쪽으로 팬다.
  #   실주행 추월집중_05_우회전5 에서 이 V 노치가 조향 포화·차선이탈을 만들었다.
  # true = 같은 s(간격 < 1e-3)의 레코드는 **xodr 문서 순서**를 따른다.
  # false = 이전 동작(순수 s 정렬).
  #
  # 안전성: 맵 전 도로를 0.1 m 간격으로 훑어 조각 선택이 달라지는 지점을 전수
  # 분류한 결과, 바뀌는 8 개 도로 전부가 "종결자 → 램프" 한 방향이고 역방향은
  # 0 건이다. width·elevation 은 이 맵에 동률 쌍이 0 건이라 영향이 없다.
  # 값을 바꾸면 lane_graph.pkl 재빌드가 필요하다.
  laneoffset_stable_order: true
  # 같은 s 로 볼 간격 [m]. xodr 의 s 는 e-12 ~ e-9 수준으로 흔들린다.
  laneoffset_tie_tol_m: 0.001

route:
  # ── 연결로 통행 금지 임계 R_min [m] (2026-09-08, 회전 금지 완화) ────────
  # 지도가 실제 도로 기반이라 junction 연결로는 **실차가 도는 길**이다.
  # 옛 임계 vehicle.min_turn_margin×최소회전반경(=5.65 m)은 "중심선 정확 추종"
  # 기준이라 과보수였다 — 근거였던 실측 이탈 4/4 는 커브 감속이 없어 25 km/h
  # 로 진입한 결과다. speed.curvature_cap_enable([2], 2026-09-08)이 R 5.0 에서
  # v ≤ √(2.5·5.0)=3.5 m/s 로 눌러 주므로 그 전제가 사라졌다.
  # 주최측 규정은 "지정 경로 이탈 시 감점" 이라 **우회가 급회전보다 나쁘다**.
  # 3.0 = 지도 결함 안전망 (기하 최소반경 5.65 의 절반 — 이보다 작은 R 은
  # 실도로 연결로로 보기 어렵다). 3.0~5.65 는 통행 허용 + 리포트 WARN
  # "급회전 연결로" + rt['tight_turns'] 기록.
  # 옛 동작으로 되돌리려면 5.65 (= vehicle.wheelbase/tan(max_steer)) 를 넣는다.
  banned_r_min_m: 3.0
  # 소멸(테이퍼) 차로 꼬리 블렌드 길이 [m] (VtdRoutePlanner._build).
  # 끝 폭이 vehicle.width 미만으로 줄어드는 차로는 중심선이 이웃 경계로 수렴하다
  # successor 중심선(반폭 ≈1.5 m 옆)으로 순간이동한다 — 2026-08-26 실기에서
  # 이 킹크가 조향 풀포화·차선이탈 진동을 만들었다. 마지막 이 길이 구간을
  # successor 중심선으로 코사인 블렌드해 연속으로 만든다.
  taper_blend_m: 15.0
  # 탐색(build_route dijkstra)에서 소멸 연결로 진입에 벌점을 줄지 (2026-09-06, P7).
  # ── 형식 무관 전역 경로 탐색 (작업 R) ────────────────────────────────
  # 켜면 구간별 탐욕 대신 DP(Viterbi)로 차로 열을 정한다. 경유점이 (진입,진출)
  # 짝인지·홑점인지·공유점인지 모르는 채로 전체 최소를 찾는다.
  # 왜: 탐욕은 경유점마다 가장 가까운 차로를 확정하고 되돌리지 않는다. 그 차로에서
  # 다음 경유점으로 가는 길이 블록 한 바퀴여도 알 수 없다 — 2026-09-06 PathShape03
  # CSV(10점) 실측: seq 9 에서 0.52 m 짜리 차로를 잡아 마지막 구간이 2081 m 가
  # 됐다. 2.42 m 짜리 옆 차로를 잡으면 23 m 다. 전역 DP 는 그 교환을 본다.
  # 짝 해석은 대조용으로만 돌려 결과가 다르면 리포트에 WARN 한 줄.
  # 2026-09-06 검증 뒤 기본 true. false 는 롤백용으로 남긴다 (46경로 off 동일 확인).
  global_dp_enable: true
  dp_match_radius_m: 8.0          # 점당 후보 반경. 0개면 헤딩완화 → ×1.5 → 건너뜀
  # 한 구간의 경로거리가 max(floor, ratio × 직선거리) 를 넘으면 **넘은 만큼 ×
  # penalty** 를 비용에 더한다. 막지는 않는다 — 층 단위로 잘라내면 그 층에서
  # 살아남은 상태가 다음 층에서 전부 막히는 일이 생긴다 (실측: 32 m 전이가
  # 앞 층 가지치기로 사라져 815 m 우회가 됐다).
  # 정상 구간 748개 실측: 비율 중앙 1.00 · p99 1.41, 2.0 초과 3건이 전부 병증이다.
  dp_detour_ratio: 3.0
  dp_detour_floor_m: 400.0
  dp_detour_penalty: 10.0
  # ── 연속 차선변경 hop 사이 **필요 간격** [m] ─────────────────────────
  # min_hop_gap_m 과 축이 다르다. 저쪽은 "전이 하나가 목표 차로에서 먹는
  # 진행거리"(dijkstra 비용식), 이쪽은 "앞 전이가 끝나고 다음이 시작되기까지
  # 필요한 거리"(제어기 램프 lc_move_len + 지시등 선행 signal.lc_lead_s).
  # DP 벌점(dp_step_penalty)과 리포트 간격 게이트가 이 키를 본다.
  # 실측(2026-09-06): 50 km/h 에서 필요 간격은 37.5+37.5 = 75 m 인데 상수 45 는
  # 30 m 모자라고, min_hop_gap_m 20 m 는 1.60 s 로 규정 3 s 의 절반이다.
  # 다만 min_hop_gap_m 을 올리는 것은 답이 아니다 — 비용식에도 들어가서
  # 45 로만 올려도 대회 CSV(PathShape03)가 896 → 2223 m 로 터진다.
  lc_hop_sep_m: 45.0
  # 위를 상수 대신 구간 제한속도로 계산할지 (lc_move_len(v) + v × lc_lead_s).
  # false = 상수(현재 동작).
  lc_hop_sep_speed_enable: false
  # 연속 차선변경 hop 사이 간격 부족분 × 이 값을 구간 비용에 더한다. 차선변경은
  # route_s 를 진행시키지 않아 두 번이 같은 자리에 겹칠 수 있는데, 제어기 램프는
  # 한 번에 lc_move_max_m 까지 쓴다 — 겹치면 재샘플 폴리라인이 튀고 생성기
  # 폴리라인 게이트에 걸려 시나리오가 폐기된다 (2026-09-06: 19개 중 3개).
  # 0 = 벌점 없음(안전망만). 아래 안전망은 이 값과 무관하게 항상 돈다.
  # 실측(2026-09-06, 07·10·18 세 경로): 1.0 이면 스텝 3.14/1.06/0.42 →
  # 0.15/0.13/0.10 m 로 내려가고 총연장 +0.1 m, 차선변경 횟수 변화 0.
  # 3·10·30 도 결과가 같아 1.0 이 필요한 최소값이다.
  dp_step_penalty: 1.0
  # ── 넓은 도로 대응: 후보 반경 재시도 ─────────────────────────────────
  # 지도에 같은 방향 3차로 이상인 도로가 78개고 그중 33개는 첫↔끝 차로 중심거리가
  # 8 m 를 넘는다 (최대 15.84 m, 도로 1926). 경유점이 한쪽 차로에 찍히면 반대쪽
  # 끝 차로가 기본 반경 밖이라 DP 후보에 아예 안 들어온다 — 그 교차로 회전이
  # 반대쪽 차로에서만 되면 못 본다.
  # 켜면 한 층의 최선 전이가 우회 벌점을 물거나 전부 막혔을 때, **그 점만**
  # "도로 같은 방향 전체 차로를 덮는 반경"(상한 dp_radius_max_m)으로 후보를 다시
  # 잡아 그 층만 재계산한다. 넓혀 들어온 후보에는 경유점 거리 비례 벌점을 물려
  # 가까운 차로가 되면 그쪽이 이기게 한다. false = 이전 동작.
  # **마지막 경유점은 재시도하지 않는다** — 그 점이 완주 판정 기준(finish_xy)이라
  # 먼 차로로 옮기면 경로가 종점을 반경 밖으로 비껴간다 (실측: 가드 없이 venue
  # 계열 6경로가 종점을 11.45 m 밖으로 옮기고 경유점 투영이 사라졌다).
  # 2026-09-07 검증 뒤 기본 true — 46경로에서 발동 0건이라 현재 경로는 안 바뀌고,
  # 넓은 도로에서 반대쪽 차로가 필요할 때만 작동한다.
  dp_radius_retry_enable: true
  dp_radius_max_m: 16.0
  dp_radius_dev_penalty: 1.0
  # ── 교차로 진입·진출점에서 재시도가 무장하게 (2026-09-08) ────────────
  # 위 재시도는 "최근접 후보가 앉은 도로의 같은 방향 전폭"으로 넓힌다. 그런데
  # 대회 공식 형식은 경유점이 **전부 교차로 진입·진출부**라 최근접 후보가
  # 교차로 연결로다. 연결로는 언제나 1차로라 "전폭"이 1차로 폭이 되고, 넓힌
  # 반경이 base 그대로여서 **재시도가 아예 안 돈다**.
  # 실측 2026-09-08 PathShape04 5점: seq 3 최근접 = (1940,0,-1) junction 39
  # 연결로 → wide 8.0. 4 로 가는 우회전은 (1926,0,6)→(1943)→1927 뿐인데 그
  # 차로가 12.0 m 밖이라 후보에 없고, seq 3→4 가 29 m 직선에 771 m 우회했다
  # (총 1397 m, 경로/직선 2.16, 차로 49개).
  # 켜면 연결로일 때 **접근 도로**를 본다: 진입(predecessor) 도로의 같은 방향
  # 전폭, 그쪽이 max 밖이면(긴 연결로의 진출단) 진출(successor) 도로. 넓힌
  # 후보는 그 도로의 같은 방향 차로로만 제한한다 (다른 도로·반대 방향은 반경
  # 안이어도 제외). base 반경 안 후보는 그대로 남으므로 후보가 줄지는 않는다.
  # 2026-09-08 검증 뒤 기본 true — 경로 150개 지문이 off 와 **전건 동일**하고
  # (재시도가 실제로 무장하는 점 9개 / 경유점 1480개 중), PathShape04 5점만
  # 1397 → 753 m 로 고쳐진다. false = 이전 동작.
  dp_retry_junction_enable: true
  # 재시도 트리거에 경로/직선 비율. 우회 벌점만 보면 raw > max(dp_detour_floor_m
  # 400, dp_detour_ratio 3 × 직선) 일 때만 걸려서 **400 m 아래 우회가 전부
  # 안 보인다** — 29 m 직선에 350 m 우회여도 무표시다. 이 값을 넘으면 벌점과
  # 무관하게 재시도한다. 0 = 끔 (이전 동작).
  # 2026-09-08 검증 뒤 기본 2.0 — 경로 150개 지문 전건 동일.
  dp_retry_ratio: 2.0
  # ── 종점 차로 고정 (2026-09-07) ──────────────────────────────────────
  # DP 마지막 층에서 **비용보다 종료 차로 정합을 우선**한다: 종료 좌표(마지막
  # 경유점)가 실제로 올라앉은 차로가 후보에 있고 이어질 수 있으면 비용과
  # 무관하게 그 차로로 끝낸다. 이어질 수 없을 때만 최소비용 후보로 떨어진다.
  #
  # 왜 완주가 걸린 문제인가: 대회 규칙은 "뒷축이 **두 콘 사이** 종료선 통과"
  # 이고 콘은 종료 좌표에서 그 차로 t 방향으로 선다. 경로가 옆 차로로 끝나면
  # 종료선을 넘고도 콘 밖이라 완주로 안 쳐질 수 있다.
  # 실측(2026-09-07, 생성 경로 21개): 9개가 종료 좌표와 다른 차로로 끝났고
  # (경로 중심선에서 ±3~6 m) 그중 5개는 종료선 콘이 주행 회랑 안이었다.
  #
  # "올라앉았다" 기준은 그 차로 **반폭 안**이다 — 좌표가 차로 경계 밖이면 어느
  # 차로 것인지 애매하므로 고정하지 않는다. 새 상수 없이 lg.width_at 을 읽는다.
  # 반경 재시도(dp_radius_retry_enable)와는 무관하다: 그쪽은 마지막 경유점을
  # 이미 제외하므로 후보 목록이 겹치지 않는다.
  # false 로 두면 최소비용 후보를 쓰는 이전 동작이 그대로 재현된다.
  dp_finish_lane_lock: true
  # DP 로 지었을 때 짝 해석 대조와 폴리라인 재샘플을 돌릴지. 끄면 DP 결과를
  # 그대로 쓰고 리포트 [DP] 대조 줄과 연속성 안전망이 없다 (테스트·대량 생성용).
  dp_compare_enable: true
  # 연속 짝 공동 선택 (2교차로 lookahead). 앞 교차로 진출 차로를 고를 때 다음
  # 교차로 진입 차로까지 보고, 거기에 **차선변경 없이 닿는** 진출 차로만 남긴다.
  # 왜: 교차로 사이 도로가 짧으면 진출 차로를 잘못 고른 뒤 바꿀 자리가 없다.
  # 짝 사이는 차선변경 금지라 다음 짝 후보가 통째로 죽고 탐욕 폴백으로 넘어간다
  # (2026-09-06 G-2: 도로 2152 는 27.6 m 인데 진입 후보의 목표 s 가 27.57 이라
  # 차선변경 착지점 s+min_hop_gap_m 이 3 cm 차이로 목표를 지나쳐 탈락한다).
  # 좁혀서 후보가 0개면 좁히기 전 결과를 쓴다 — 경로를 없애지 않는다.
  # 실측(경로 59개): 교차로 사이 도로 < gap 인 구간 10건, 그중 차로가 달라
  # 차선변경이 필요한 것 1건. false = 이전 동작.
  pair_chain_enable: false
  # 위 lookahead 를 켤 사이 도로 길이 [m]. min_hop_gap_m(20) + 여유 10.
  pair_chain_gap_m: 30.0
  # 짝(교차로 진입·진출) 탐색이 0개로 끝나 기존 탐욕으로 폴백하기 **직전에**,
  # 진출 후보 풀을 같은 도로·같은 방향 **전체 차로**(섹션 제한 해제)로 넓혀
  # 한 번 더 찾을지. 왜: 짝 사이는 차선변경 금지라 진출 경유점이 찍힌 섹션에
  # 연결 가능한 차로가 하나도 없으면 후보가 통째로 죽는데, 같은 도로의 다른
  # 섹션 차로는 successor 만으로 이어지는 경우가 많다. 폴백은 조용히 먼 길을
  # 잡는다 — 2026-09-06 재현(진입 [2152,2190] → 진출 [2012] 좌회전)에서
  # 정상 205 m 대신 2226 m 경로가 나왔다. 켜면 폴백이 고른 연결로·R_min 도
  # stderr 에 찍는다. false = 이전 동작.
  pair_fallback_widen_enable: false
  # 소멸 차로 = 끝 폭 < vehicle.width (위 taper_blend · score 차로유지 제외와 같은 기준).
  # 실측 실전주행_교통류_01 junction 7: 끝 폭 0.05 m 인 (1154,0,-2) 를 탔고 옆에 폭이
  # 유지되는 (1154,0,-3) 이 있었다. 지도 전체 소멸 연결로 29개 중 28개에 오른쪽
  # 대안이 있다. 벌점은 successor 진입에만 붙는다 (도로 안 소멸 차로는 제외).
  # 대안이 차선변경을 요구하면 그 LC 비용(LC_PENALTY 25 + 회랑 부족분)과 겨루므로,
  # 벌점이 그보다 작으면 사실상 안 바뀐다. false = 이전 동작.
  #
  # true (2026-09-09). 경로 34건 전수 대조: **4건이 바뀌고 전부 같은 자리**다 —
  # junction 33 에서 (1821,0,-2)[끝 폭 **0.00 m**, 차로가 완전히 사라진다] 대신
  # (1821,0,-3)[2.71 → 3.00 m 유지] 을 탄다. 대가는 경로당 **+1.2 m** 뿐이고
  # (successor 링크라 차선변경이 필요 없다), 나머지 30건은 점 하나 안 바뀐다.
  # 회전 차로 위반 수는 19건으로 변화 없다 — 이 스위치는 그 축이 아니다
  # (그쪽은 turn_lane_bias_m 참조).
  # 바뀌는 경로: 실전주행_교통류_01_좌회전24 · 03_우회전11 · 06_좌회전 · 13_우회전11
  taper_penalty_enable: true
  taper_penalty_m: 40.0
  # 회전 방향 차로 선호 [m/칸]. 다음이 우회전 연결로면 진입 차로에서 **오른쪽에
  # 남은 차로 수**만큼, 좌회전이면 왼쪽에 남은 수만큼 비용을 더한다.
  # 0 = 끔(이전 동작).
  #
  # 왜 필요한가 — DP 비용에 이 축이 아예 없다. 실측(경로 34건, 2026-09-09):
  # **회전 차로 위반 19건**. 지도의 노면 화살표로 보면 명백하다:
  #   실전주행_교통류_07 s 477.8  진입 (146,0,1) 화살표 **L**(좌회전 전용)에서 우회전
  #   실전주행_교통류_11·15·16·08 진입 (2814,0,3) 화살표 **S**(직진)에서 좌회전
  #   실전주행_교통류_02·14      진입 (2813,0,2) 화살표 **S** 에서 우회전
  #
  # **이 상수로는 07 이 안 고쳐진다** — 대안 차로 (146,0,2) 로 가려면 회랑
  # 부족분을 물어야 하는데(아래) bias 로는 360 이 필요하다. 그건 아래
  # turn_lane_constraint_enable 이 **제약**으로 푼다 (비용 경쟁이 아니다).
  #   (146,0,2) 는 테이퍼로 열리는 차로다: 차폭(1.886)이 되는 지점이 s 27.5,
  #   **점선 구간은 s 21.0~34.5 = 13.5 m**. LC_MIN_CORRIDOR_M(25) 부족분 11.5 m
  #   × LC_SHORT_PENALTY_PER_M(20) = 230 m + LC_PENALTY 25.
  #   13.5 m 짜리 전이는 L = v·π·√(Y/2a) 로 **v ≤ 4.3 m/s (15 km/h)** 면 가능하다 —
  #   우회전 접근 속도라 무리가 아니다. (2026-09-09 정정: 이전 주석의
  #   "7 m 라 물리적으로 불가능" 은 **차폭 기준**을 점선 기준으로 잘못 읽은 것이다.)
  # 07 은 아래 회전 차로 **제약**이 푼다 — 가산점은 임시방편이라 0 으로 둔다.
  #
  # **30 으로 정했다 (2026-09-09, 사용자 결정).** 경로 34건 실측:
  #     bias   경로 변화   회전 차로 위반   총거리 합 Δ
  #        0        0          19            +0.0 m
  #        5        0          19            +0.0 m
  #       15        0          19            +0.0 m
  #       30        5        **14**       **−20.1 m**
  # 15 이하는 LC_PENALTY(25)를 못 넘어 아무것도 안 바뀐다. 30 은 위반 5건을
  # 고치면서 경로가 오히려 20 m 짧아진다 — **길어지는 경로가 하나도 없다.**
  # 바뀌는 5건: 08_우회전16 · 11_직진10 · 15_우회전25 · 16_직진20 ·
  # pair_lane_offset. 07 s477.8 은 이 값으로 안 바뀐다 (대안 차로가 7 m 뿐이라
  # bias 400 에서야 뒤집히고, 그 경로는 물리적으로 주행 불가능하다).
  # **60 (2026-09-09, 사용자 결정).** taper on 기준 경로 34건 실측:
  #     bias   경로 변화   회전 차로 위반   총거리 합 Δ   rc≠0 신규
  #        0        0          19            +0.0 m        0
  #       15        0          19            +0.0 m        0
  #       30        1          19            −3.3 m        0
  #     **60        9          12           −55.7 m        0**
  #      120       13           5           −79.2 m        (미측정)
  # 15 이하는 LC_PENALTY(25)를 못 넘어 아무것도 안 바뀐다. 60 은 위반 7건을
  # 고치면서 경로가 55.7 m 짧아지고 **길어지는 경로가 하나도 없다**.
  # 안전성: bias 는 회랑 부족분을 LC_SHORT_PENALTY_PER_M(20)로 물므로 60 이
  # 살 수 있는 부족분은 **3.0 m** 뿐이다 (회랑 22 m 까지). 07 의 13.5 m 창은
  # 부족분 11.5 m = 230 이라 못 산다 — 불가능한 차선변경을 만들 수 없다.
  turn_lane_bias_m: 60.0
  # 회전 차로 **제약** (가산점이 아니라 후보 제외). 2026-09-09.
  # 노면 화살표(lanes[k]['arrows'])가 그 회전을 허용하지 않는 차로에서는
  # 그 방향 연결로로 진입하지 않는다.
  #
  # **laneLink 는 못 쓴다.** junction connection 의 laneLink 로 차로별 허용
  # 회전 집합을 만들면 노면 표시보다 관대하다 — 실측(진입 차로 552개, 화살표
  # 보유 472개): laneLink == 화살표 327 / **laneLink 가 더 관대 69** / 화살표가
  # 더 관대 76. 그래서 "회전 방향이 laneLink 에 없으면 제외" 는 회전 차로 위반
  # 19건 중 **한 건도 못 거른다**. 예: (146,0,1) 은 화살표가 L(좌회전 전용)인데
  # laneLink 에는 L·S·R 이 다 있다. (2814,0,3) 은 화살표 S 인데 laneLink 는 L.
  #
  # 안전망: 같은 방향 이웃 중 그 회전 화살표를 가진 차로가 **하나도 없으면**
  # 막지 않는다 (지도의 데이터 공백 — 실측 road 62·100 의 우회전 등 26개
  # 접근로). 막으면 경로가 통째로 불가능해진다.
  # false = 이전 동작.
  #
  # **true (2026-09-09).** 경로 38건 전수 재빌드:
  #   빌드 실패 **0건** (실패로 보인 4건은 홀수 경유점 CSV 라 애초에 짝 해석
  #   대상이 아니다 — 제약 off 에서도 같다)
  #   기하 기준 회전 차로 위반 **19 → 3**, 화살표 기준 **31 → 13**
  #   총거리 합 **−84.5 m** (16경로가 바뀌고 **길어진 경로는 0**)
  # 남는 위반은 전부 **접근로에 그 회전 화살표를 가진 차로가 하나도 없는** 자리다
  # (190,0,1)·(310,0,1)·(1777,0,2)·(2802,0,-1) — 지도의 표시와 연결이 서로
  # 어긋나는 데이터 결함이라 경로 탐색이 고칠 수 없다. 안전망이 정확히 그 자리에서만
  # 작동했다.
  # 이 제약이 있으므로 `turn_lane_bias_m` 은 0 으로 둔다 (가산점은 임시방편이었다).
  # **false 로 되돌렸다 (2026-09-09).** 지시안의 (c) 기준이 "빌드 실패·rc≠0
  # 건수 0" 인데, 제약 on 에서 **rc≠0 이 1 → 5 로 늘었다** (신규 4건).
  # 신규 4건은 전부 같은 이유다:
  #     lane_change_right  window **13.5 m**  <= [오류] 창이 20 m 미만
  #     (실전주행_교통류_01·03·07·13 — 전부 road 146 의 (146,0,1)→(146,0,2))
  # 제약이 고르는 (146,0,2) 는 테이퍼로 열리는 차로라 점선 창이 13.5 m 뿐인데,
  # **경로 검증기 자신의 기준**(MIN_LC_WINDOW_M 20 m)이 그것을 실행 불가로
  # 판정한다. 즉 화살표는 그 차로를 요구하는데 기하가 못 따라간다 — 지도의
  # 모순이지 탐색이 고를 문제가 아니다.
  # 지시안의 "실패가 나면 bias 60 으로 복귀" 를 따랐다.
  # 코드는 남긴다 — 판정 자체는 옳고(19 → 3), 창 기준이 완화되거나 그 자리
  # 지도가 고쳐지면 그대로 켤 수 있다.
  turn_lane_constraint_enable: false
  # 연속 차선변경(hop) 사이에 있어야 하는 최소 경로거리 [m] (작업19).
  # hop 은 평행 차로로 옮겨 타는 것이라 advance() 가 진행거리를 0 으로 둔다.
  # 그래서 탐색 비용은 "3회를 100 m 에 나눠 함"과 "29.8 m 에 몰아넣음"을
  # 구분하지 못한다 — 대회장 배포 CSV(venue_20260903)에서 실제로 후자가 0.54 m
  # (총비용의 0.26 %) 차이로 뽑혔고, 램프가 hop 하나만 처리하는 탓에 경로
  # 점열에 3.402 m · 6.800 m 계단이 생겼다. 물리적으로 주행 불가다.
  # MIN_LC_WINDOW_M(20.0) 과 같은 축 — 한 번의 전이가 끝나야 다음이 시작된다.
  min_hop_gap_m: 20.0
  # 탐색이 위 간격을 비용으로 보게 할지 (작업19-3).
  # dijkstra 의 LC 분기에서 hop 이 목표 차로 안의 진행거리를 min_hop_gap_m 만큼
  # 먹게 하고(s_enter 누적), 차로 길이를 넘으면 부족분을 LC_SHORT_PENALTY_PER_M
  # 로 문다. 이걸 안 하면 "차선변경 3회를 100 m 에 나눠 함"과 "29.8 m 에
  # 몰아넣음"이 같은 비용이라, venue_20260903 에서 0.54 m(총비용의 0.26 %)
  # 차이로 후자가 뽑혔다.
  # advance() 와 LC_PENALTY(25) · LC_MIN_CORRIDOR_M(25) 은 건드리지 않는다 —
  # route_s 는 실주행거리와 일치해야 하고(차선변경 창 판정의 기준),
  # 회랑 비용은 별개 축이다.
  # false = 이전 동작(간격을 비용에 반영하지 않음).
  hop_spacing_cost_enable: true
  # 홀수 경유점 CSV 의 짝 해석 자동 판정 임계 (작업21).
  # 주최 형식은 [시작, (진입,진출)×N, 종료] = 짝수지만 홀수로 올 수도 있다고
  # 확인됐다. 홀수면 해석이 둘이다 — offset 0 = [(진입,진출)×N, 종료],
  # offset 1 = [시작, (진입,진출)×N].
  #
  # 판정 신호는 **짝 구간이 junction 차로를 실제로 지나는 비율** 하나다.
  # 짝수 기준 CSV 25개 실측(2026-09-04): 정답 offset 은 65/65 = 100 %,
  # 오답 offset 은 4/86 = 5 %. margin 최소 0.50 / 중앙값 1.00.
  # 다른 후보는 못 쓴다 — turn_connect 성공률은 97 % vs 94 % 로 판별력이 없고,
  # |Δθ|≥25° 는 42 % vs 9 % 로 약하다(직진 교차로가 많다).
  #
  # 1.00 = 짝 구간이 **전부** 교차로 연결로를 지나야 채택. 0.75 를 정당화했던
  # "연결로 사이 링크 도로로 이어지는 정당한 짝 43개 중 6개"(report() 주석,
  # 2026-09-04)는 재확인 결과 실 CSV 에 없다 — 그 6건은 전부 합성 파일
  # data/test_route_waypoints.csv(make_test_route.py 생성, 17점)에서 나왔고,
  # 진입 차로와 진출 차로가 같은 차로((173,0,-1)→(173,0,-1))라 애초에 짝이
  # 아니다. 실 배포·시나리오 계열 짝수 CSV 26개 66짝은 현재 지도에서도,
  # 옛 코드·옛 지도(cf1746d, 지도 022b9f4)에서도 전부 1.00 이다 (2026-09-05,
  # 작업22 재확인). 홀수 표본 115개 실측: 정답 표본 46/46 손실 없이 위험
  # 오답이 3 → 1 로 준다.
  # **docs/RACE_DAY_ROUTE.md ② 의 사람 판정 기준과 같은 잣대여야 한다** —
  # 문서는 "정확히 1.00 인 쪽" 을 쓰라고 한다. 자동 판정이 0.75 를 통과시키면
  # 사람과 코드가 다른 답을 낸다.
  pair_auto_min_ratio: 1.00
  # 승자와 패자의 비율 차이. 애매하면 짝 해석을 아예 안 한다(none).
  # 합성 경로(data/test_route_waypoints.csv 17점)는 0.75 vs 0.50 = margin 0.25
  # 로 여기서 걸러진다 — 짝 구조가 없는 경로이므로 걸러지는 게 맞다.
  pair_auto_min_margin: 0.50
  # 짝이 아닌 세그먼트마다 "다음 짝 진입에 유효한 차로 집합"을 pkl 에 넣을지
  # (작업10). **정보 필드다** — build_route 는 이걸 경로 계산에 쓰지 않고,
  # 아무도 안 읽으면 영향이 0 이다.
  #
  # 쓰임: 회피 시프트로 옆 차로에 나간 뒤 원래 차로로 복귀해야 하는가를
  # 제어기가 판단할 재료. 복귀 공간이 부족하면 곡률이 커져 속도가 하한(1.0 m/s)에
  # 붙거나(2026-09-03 정적회피집중_01, 27.7 s 크립) span 게이트가 회피를 기각해
  # 장애물 앞에 선다. 직진 구간이면 복귀 없이 그 차로로 다음 교차로에 들어가도
  # 되는 경우가 많다.
  #
  # 판정은 작업7-2 의 turn_connect 를 그대로 쓴다 (새 탐색 없음). 좌·우회전이면
  # 집합이 대개 1개로 좁혀져 그게 곧 복귀 강제이고, 직진이면 여러 개가 남는다.
  # 마지막 세그먼트(마지막 진출 → 종료)는 다음 짝이 없어 빈 집합이다 —
  # target='finish' 가 "제약 없음"과 "유효 차로 없음"을 구분한다.
  # false = 필드를 아예 안 넣는다 (이전 동작).
  # true (2026-09-08): 제어기가 A2(c) '교차로 앞 회전 차로 복귀 우선' 에서
  # 읽는다. 그전까지는 소비처가 없어 꺼 뒀다.
  valid_entry_lanes_enable: true
  # 차선변경 실행 시간 [s] — 도로에 진입하면 이 시간 안에 옮겨탄다.
  # 진출로가 회전이면 회전 차로에 미리 붙어 있어야 하므로, 창 맨 앞(=도로 진입로,
  # 점선이 허용하는 가장 이른 지점)에서 시작해 v × 이 시간 만에 끝낸다.
  # 고정 거리(구 LC_TRANSITION_M 25 m)는 속도에 따라 걸리는 시간이 달라져
  # 빠를 때 너무 급하고 느릴 때 너무 늘어졌다. 지시등 선행(signal.lc_lead_s)과
  # 같은 축의 시간이라 "3초 전 점등 → 3초 안에 이동" 으로 읽힌다.
  lc_move_s: 3.0
  # 위 시간으로 환산한 거리의 하한·상한 [m] (저속·고속 방어)
  lc_move_min_m: 20.0
  lc_move_max_m: 45.0
  # ── 램프를 다음 hop 안으로 맞춘다 (실주행 1차 [3](b), 2026-09-08) ──────
  # 지금 램프 길이는 lc_move_max_m(45) 만 보고 **다음 hop 까지의 거리를 안 본다**.
  # 실측 실경로_01_PathShape03 rs 413~455: 도로 418 에서 차선변경 4회가 연속인데
  # hop 간격이 20 m 인데 램프는 v(13.3 m/s) × lc_move_s(3.0) = 39 m 로 구워졌다.
  # 램프가 겹쳐 경로가 2차로를 한 번에 건너는 S자가 되고, heading_err +31°,
  # 조향 포화 4회, |t_off| 1.85 m (항목 3 차로유지 중대 + 항목 6 실선 변경).
  # 켜면 w1 ≤ 다음 hop 의 w0 − lc_ramp_hop_gap_m 로 자른다. lc_move_min_m
  # 하한보다 짧아져도 자른다 — 겹치는 것보다 짧은 게 낫다.
  # false = 이전 동작.
  # true (2026-09-08): 실경로_01 램프 37.5/37.5/30.7 → 18.0/18.0/28.9 m,
  # 따라가는 경로의 최소 곡률반경이 rs 350~470 에서 **3.03 → 20.57 m** 회복.
  lc_ramp_fit_hop_enable: true
  # 다음 램프 시작까지 남길 여유 [m].
  lc_ramp_hop_gap_m: 2.0
  # 종료선 뒤 경로 꼬리 최소 길이 [m] (tools/build_route.py 소비). 마지막 경유점
  # 매칭 차로의 잔여가 이보다 짧으면 successor 를 따라 부족분을 연장한다.
  # plan_stop_s(kr_rules) 요구량 = finish_clearance 2.0 + stop_gap 4.0 +
  # wheelbase 2.944 + front_overhang 0.855 + end_slack 1.0 = 10.799 m. 12.0 은
  # 그 요구량 + 여유. 꼬리가 부족하면 finish 정지가 클립돼 뒷축이 종료선 앞에
  # 선다 (2026-09-03 실측: 대회형식 CSV 꼬리 15.0 m — 통과, 픽스처 0.2 m — 클립).
  # 연장되면 total_length 도 같이 늘어난다 (route_total 폴백은 새 종점 기준).
  finish_tail_m: 12.0
  # false 면 꼬리 연장 안 함 (이전 동작).
  finish_tail_enable: true
  # 경유점 후보 차로 수집 (tools/build_route.py candidates). true = 반경 안의 kd
  # 점을 전부 본다. false = 개수 기반 kd.query(k=40) — 이전 동작, 현장 롤백용.
  #
  # 개수 기반은 경유점이 어떤 차로 중심선 위에 얹히면 그 차로 점들이 k 를 다
  # 채워 인접 차로·연결로가 후보에서 빠진다. kd 샘플 간격 0.5 m 라 k=40 은
  # 20 m 어치일 뿐이다. 2026-09-03 실측(radius 8 m): 반경 안 점 수 중앙 106 /
  # 최대 330, k=40 실제 도달거리 3.4~5.4 m. 대회장 CSV seq 9 는 정답 차로가
  # 5.02 m 인데 k=40 도달이 4.84 m 라 0.18 m 차이로 잘려 "seq 8->9 경로 없음"
  # 이 났다 (교차로 짝 구간이라 차선변경 금지 = 그 차로가 유일한 연결).
  candidates_ball_query_enable: true
  # 반경 안 kd 점이 이보다 많으면 가까운 순으로 자르고 경고 1줄 [개].
  # radius 8 m 에서는 미발동한다 (지도 전체 최악 330점). r>=65 m 로 --radius 를
  # 올렸을 때를 대비한 미래 방어다 (실측: r=60 m 최대 4640, r=80 m 최대 6054).
  candidates_max_points: 5000
  # 교차로 짝(진입,진출) 차로를 **함께** 고를지. true = 경유점이 찍힌 차로를
  # 힌트로만 쓰고, 그 회전을 실제로 수행할 수 있는 차로 중에서 고른다.
  #
  # 주최측 답변(2026-09-03): "경유지는 전체 패스 설정을 위해 교차로 끝·시작
  # 지점을 임의로 피팅한 것", "특정 차로값으로 제공되지 않는다. 좌회전 구간에서
  # 3차로로 경유지가 올 수도 있으며 그 경우 1차로로 주행하면 된다", "좌표는
  # 대략적인 위치다". 즉 경유점이 알려주는 건 도로·순서·회전방향 셋뿐이고
  # 차로는 정보가 아니다.
  #
  # 현재 코드는 진입 차로를 앞 세그먼트만 보고 탐욕으로 확정한 뒤 진출점을
  # 본다. 짝 사이는 차선변경 금지라 진입이 틀리면 복구가 없다 — 흔들기 실패
  # 148건이 **전부** 이 형태였고, 148/148 이 진입 차로만 다시 고르면 풀렸다
  # (2026-09-03 측정, tools/perturb_route_test.py).
  # false = 이전 동작(탐욕).
  waypoint_lane_is_hint: true
  # 진입 차로 → 진출 도로 연결을 "그 회전" 으로 인정할 비용 상한 [m].
  # allow_lane_change=False 라도 successor 를 따라 블록을 5 km 돌면 연결은 된다
  # (실측 상한 없음: p90 1455 m, 최대 5109 m). 실제 짝 43개가 쓴 연결 비용은
  # 중앙 101 / p90 184 / 최대 363 m 라 400 이면 43/43 통과하고 우회는 걸러진다.
  # "중간 경유가 전부 junction 차로" 로 조이는 방식은 쓰지 않는다 — 연결로 사이
  # 링크 도로·같은 도로 다음 섹션이 낀 정당한 짝 6/43 이 탈락한다.
  turn_connect_max_m: 400.0
  # 직진/좌회전/우회전을 가르는 헤딩 변화 임계 [deg]. tools/build_route.py 의
  # 세 곳(연결로 곡률 turn 이벤트 · 짝 기반 turn 이벤트 보강 · 리포트 표시)이
  # 모두 이 값을 읽는다. 하나만 바꾸면 리포트 표시와 방향지시등이 어긋난다.
  turn_heading_thr_deg: 25.0
  # 경유점 이탈 경고 허용치 [m] — 짝이 **아닌** 경유점(시작·종료·직선 구간)용.
  # 차로 반폭(~1.5 m) 기준은 폐기했다: 주최측이 "좌표는 대략적" 이라 했고
  # waypoint_lane_is_hint 가 회전 가능한 차로를 고르면 경유점에서 한 차로
  # (~3 m) 멀어지는 게 정상이라, 반폭으로 재면 정상 경로가 경고를 받는다
  # (2026-09-04: 정적회피집중_01 seq 2 이탈 2.86 / 한계 1.54 → rc=1 → 배치 폐기).
  # 도로 폭 급인 6.0 이면 "경로가 이 경유점을 아예 안 지난다" 만 잡는다.
  check_waypoint_max_dist_m: 6.0
  # 출발 차로 확정에서 lg.locate() 의 개수 절단(kd.query(k=16))을 우회할지.
  # true = locate 의 점수 규칙(거리 + 0.5×헤딩오차)을 반경 기반 후보집합에 다시
  # 적용해, 더 나은 차로가 나오면 그쪽을 쓰고 경고 1줄. false = locate 결과 그대로.
  #
  # 바꾸는 건 후보집합뿐이다 — locate 가 헤딩을 보고 일부러 조금 먼 차로를 고른
  # 판단은 살아 있고, candidates 만의 필터(폭 2 m 미만 포켓 배제)로 빠진 차로
  # 때문에 더 가까운 정답을 밀어내지도 않는다. "후보 1번과 다르면 덮어쓴다" 로
  # 하면 후자에서 회귀한다 (2026-09-03 지도 랜덤 12,000 표본 중 242건이 그 유형).
  #
  # 발동률은 낮다: 기준 CSV 11개 전부 미발동, 진행방향 무작위 5,639 표본에서
  # 4건(0.07%)·점수 여유 0.1 이하. 고치는 게 아니라 안전망이다. 진짜 원인은
  # vtd_adapter/lanegraph.py locate() 의 k=16 이고, 그건 제어기 런타임
  # (ego.py, kr_rules.py)도 같이 쓰므로 별건이다.
  # candidates_ball_query_enable 와 따로 둔다 — 한쪽만 되돌릴 수 있어야 한다.
  start_lane_ball_override_enable: true

route_check:
  # tools/build_route.py 의 경로 검증 리포트 임계 — 대회날 배포 CSV 를 받자마자
  # 도는 눈 검사다. 가장 위험한 실패는 에러 없이 조용히 옆 차로로 경로가 잡히는
  # 것이라, 아래 둘은 그 조용한 실패를 소리나게 만드는 게 목적이다.
  #
  # (a) 경유점 이탈 경고 = 매칭된 차로 **반폭** × 이 배수. 예전에는 --radius(8 m)
  # 를 임계로 썼는데, 차로 폭이 3 m대라 반폭(≈1.5 m)을 넘어 옆 차로가 더 가까워진
  # 뒤에도 한참 조용했다 (실측: 좌 1.7 m 흔들면 경로가 +956 m 튀는데 '경고 없음').
  # --radius 는 경유점 매칭 반경이라는 별개 용도로 그대로 둔다.
  wp_dev_halfwidth_k: 1.0
  # (b) 총 길이 이상 = 실제 경로 길이 / 경유점 직선연결 길이. 이 배수를 넘으면 경고.
  # 실측 정상 경로 7종: 1.057 ~ 1.175 (최대는 route_official_route.pkl, 회전 포함).
  # 조용히 옆 차로로 샌 케이스(좌 1.7 m): 1.372. 그 사이를 넉넉히 갈라 1.25.
  # 주의: 경유점이 성기면(2~3점) 정상 경로도 이 비율이 커진다 — 대회 형식
  # (시작 + 교차로 짝*N + 종료)처럼 촘촘할 때 의미 있는 지표다.
  length_ratio_max: 1.25
  # 짝(교차로 진입·진출) 경유점을 [1] 이탈 판정에서 빼고, [2] 의 "그 회전을
  # 수행 가능한가"(turn_connect)로 대신 볼지. false = 이전 동작(반폭 기준).
  pair_waypoint_exempt_enable: true
  # 정보성 경고(WARN)도 rc=1 을 내게 할지. false = 치명(ERROR)만 rc=1.
  # batch_run:566 은 rc!=0 을 'route 실패' 로 시나리오를 통째로 버린다. 정상
  # 경로가 정보성 경고 하나로 폐기되면 안 된다 (2026-09-03: 정적회피집중_01 이
  # 경유점 이탈 경고 2건으로 배치에서 빠졌다 — 경로 자체는 정상이었다).
  #
  # 가르는 기준 하나: **이 경로로 달리면 물리적으로 실패하거나 채점 위반이
  # 확정되는가.**
  #   ERROR(rc=1)  교차로 내부 차선변경 / 짝 회전 수행 불가 / LC 창 20 m 미만 /
  #                회전 불가 기하(R_min<3.96) / 불가피 포함된 회전 불가 연결로
  #   WARN(정보성) 경유점 이탈 / junction 차로 미경유 / 총 길이 비율
  # true = 이전 동작(모든 경고가 rc=1).
  warn_affects_rc: false
  # 짝 폴백 구간을 [2] 에서 ERROR 로 볼지. 기본 false = WARN(정보성, rc 무관).
  # 폴백 자체는 리포트에 안 남아 사후 추적이 불가능했다 (2026-09-06 G 분석) —
  # 이제 켜든 끄든 [2] 에 폴백 연결로·R_min·구간거리가 한 줄로 찍힌다.
  # 대회 당일은 rc=1 로 경로를 통째로 버리는 것보다 큰 WARN 이 낫다고 보고
  # 기본을 false 로 둔다.
  pair_fallback_is_error: false
  # 연속 hop 간 경로거리가 route.min_hop_gap_m 미만이면 ERROR (작업19-2).
  # LC 창 20 m 미만(#6)과 같은 성격이다 — 전이거리를 못 채우는 차선변경은
  # 헤딩오차·조향 포화·도로이탈로 끝난다. 창 검사가 이걸 못 잡는 이유는
  # lane_change_window 가 창 시작을 최대한 앞으로 당겨서, 같은 29.8 m 를
  # 공유하는 hop 3 개가 각각 "29.8 m 창" 으로 보고되기 때문이다.
  # 28 개 기준 경로 전수에서 걸리는 것은 venue_20260903 1 건이고, 나머지
  # 27 개의 최소 hop 간격은 63.6 m 라 임계와 3 배 여유가 있다.
  # false = 이전 동작(검사 없음).
  hop_gap_enable: true

route_end:
  # 종점 정지 (team_code/kr_rules.py): "종점에 정지한 길이 0 유령 선행차"를
  # PDM IDM 에 넣는다. 정지 위치 관례는 정지선과 동일 — 앞범퍼(뒷축 +
  # wheelbase + front_overhang)가 종점 − speed.stop_gap_route_end_m 에 선다.
  # batch 완주 임계(total − end_margin)보다 end_slack_m 만큼 안쪽이라 완주
  # 판정과 자동 정합한다 (tests/test_route_end.py 가 검증).
  # 정지 목표 기준: 'finish' = scoring.finish_xy 를 투영한 종료선을 뒷축이
  # finish_clearance_m 만큼 넘는 위치 (stop_s = min(finish_s + clearance +
  # stop_gap + 앞범퍼, total − end_slack); finish_xy 미설정이면 자동으로
  # route_total 동작 + 경고 1회). 'route_total' = 기존 경로 종점 기준.
  target_mode: finish
  # scoring.finish_xy 가 null 일 때 route.pkl 의 finish_xy(CSV 마지막 행,
  # tools/build_route.py 가 자동 기록)를 종료선으로 쓴다. score.py 도 같은
  # 우선순위 — 제어·채점이 같은 값을 본다. false 면 route 값 무시 = 기존 동작.
  finish_xy_from_route_enable: true
  idm_time_headway: 0.1     # 적신호 정지(idm_red_light_desired_time_headway)와 같은 축
  active_m: 150.0           # 이 거리 안에서만 후보 생성 (오검출 방지)
  latch_v: 0.5              # 정지 래치 진입 속도 — batch 완주 판정(v<0.5)과 같은 값
  latch_m: 12.0             # 종점에서 이 안쪽 + 저속이면 래치 (계획 정지점 d_end≈7.8)
  unlatch_m: 30.0           # d_end 가 다시 이보다 커지면(courseRespawn) 래치 해제

signal:
  # 방향지시등 (9910 turnSignal 0=OFF 1=LEFT 2=RIGHT). 채점 동적항목 "방향지시등
  # n초 전 점등". 점등 구간은 route['events'](turn_* / lane_change_*)에서 시작 시
  # 1회 계산하고, 매 틱 route_s 로 고른다 (team_code/kr_rules.py).
  # 회전 선행 점등 [s] — SPEC §3.3 (연결로 진입 전).
  turn_lead_s: 4.0
  # 차로 이동(차선변경·회피 시프트) 선행 점등 [s] — 규정값 미확정(SPEC §7-2).
  lc_lead_s: 3.0
  # 회전 지시등의 **꼬리**가 반대 방향 차로 이동에 양보할지 (2026-09-09).
  # 회전 점등 구간은 연결로 끝까지 유지된다(_turn_end_s — 도는 동안 켜 두는 것이
  # 맞다). 문제는 그 직후에 차로 인계가 오는 경우다: 회전 지점을 지나면
  # remain 이 max(0, 음수) = 0 이라 **회전이 무조건 이겨서** 반대쪽 지시등이
  # 아예 못 켜진다.
  # 실측 20260909_093415/실경로_02: 우회전 연결로가 rs 638.1 에 끝나고
  # (418,0,-4) → (418,0,-3) 인계 경계가 **647.2** 다. 좌측 점등이 9.1 m
  # (≈1.5 s)뿐이라 scoring.signal_lead_s(3.0) 미달 — 항목 13 1건.
  # 양보로 잃는 것은 없다: 채점 항목 13 은 **차로 변경** 지시등만 본다.
  # 같은 방향이면 양보하지 않는다 (그대로 유지되면 된다).
  # false = 이전 동작(회전이 언제나 우선).
  signal_turn_tail_yield_enable: true
  # 저속·정지 시 하한 [m]. 시간 기준만 쓰면 v→0 에서 선행거리가 0 이 돼
  # 적신호 대기 중 회전 지시등이 안 켜진다. 거리 하한으로 방어한다.
  # (대기 중 점등 유지는 의도된 동작 — 실제 운전과 같다)
  lead_min_m: 20.0
  # 차로 이동 판정: 앞 창 안에서 경로가 차로 중심 기준으로 이만큼 옆으로
  # 갈 예정이면 켠다. 실측(data/route.pkl): 일반 주행 0.00 m / 차선변경 3.0~3.2 m
  # → 0.5 는 블렌드 시작 후 4.7~6.7 m 에서 걸린다(= lead 시간만큼 앞서 점등).
  # 테이퍼(소멸 차로 기하 보정, 지도 전체 최대 2.36 m)는 입력에서 제외돼 있어
  # 임계를 낮게 둘 수 있다.
  lat_shift_on_m: 0.5
  # 최소 점등 [s] — 속도 추정 흔들림에 임계가 같이 흔들려 생기는 0.1 s 깜빡임
  # (2026-08-28 실측 4회) 방지. **상한이 있는 유지**라 고착되지 않는다:
  # 이 시간이 지나면 평소 규칙이 그대로 지배한다. 끄는 임계·래치는 두지 않는다.
  min_on_s: 1.0
  # 소등 지연 [s] — 회전·차로이동을 마친 뒤 이만큼 더 켜 두고 끈다 (실차 자동소등
  # 관례). min_on_s 와 분리한 값이다: min_on 은 "켜자마자 꺼지는 것" 방지이고
  # 이건 "다 돌기 전에 꺼지는 것" 방지라 목적이 다르다. 둘 다 상한이 있어 고착 없음.
  off_delay_s: 0.5

overtake:
  # 정적 장애물 회피 — 앞이 막혀 서 있기만 하면 미완주가 된다 (2026-08-28
  # 차로폭협착_01: 정차 차량에 막혀 353.7/821 m 에서 49 s 정지 후 시나리오 종료).
  # PDM 은 장애물을 "속도 0 인 선행차" 로 보고 뒤에 설 뿐이라 비켜갈 방법이 없다.
  # 발동은 kr_rules 가 VtdRoutePlanner.shift_route_around_actors 로 1회만 한다.
  enabled: true
  # 이 속도 미만이면 '정적' 으로 본다 [m/s]
  blocker_speed_max: 0.5
  # 이 거리 안의 선행차만 대상 [m]. shift_latest_m + 5 이상이어야 한다 (B-8):
  # standoff 정지(25 m)에서 _blocker 가 대상을 잡아야 REACTIVE·BREAKOUT 이
  # 무장된다. 20 이던 때는 25 m 에 서면 어느 것도 서지 않았다 (2026-09-03 실측).
  blocker_dist_max: 30.0
  # 막힌 채 정지가 이 시간 지속되면 발동 [s] — 신호 대기와 구분하는 것이 아니라
  # (신호는 앞차가 없다) 잠깐 멈춘 앞차에 성급히 반응하지 않기 위한 것
  trigger_s: 3.0
  # 목표 차로 점선 회랑 하한 [m] — 실선 차선변경(S2.2.05) 금지. build_route 의
  # LC_MIN_CORRIDOR_M 과 같은 축이다.
  min_corridor_m: 25.0
  # 목표 차로에 이 반경 안에 차가 있으면 금지 [m] (lc_clear 대용)
  clear_radius_m: 30.0
  # 시프트 기하 [m] — 전이 길이 / 장애물 앞뒤 여유
  transition_m: 12.0
  extra_before_m: 5.0
  extra_after_m: 10.0
  # 연쇄 장애물 병합 [m] (B-9, 2026-09-03 정적회피집중_01 t=74.6). 회랑에서 다음
  # 정지 객체가 앞 객체 + 이 거리 안이면 한 span 으로 묶는다 (첫 객체 앞 ~ 마지막
  # 객체 뒤). 기본 = extra_after_m + transition_m = 22: 그보다 가까우면 복귀 전이가
  # 다음 객체 위에 떨어지는데, 밀린 경로 기준으로 그 객체는 선행차 판정에서 빠져
  # (on_route False) OBB 후보가 5.7 m 에서야 섰다 → 범퍼 −2.2 m 접촉. 0 = 비활성.
  chain_gap_m: 22.0
  # span 활성 중에도 회랑·standoff·막힘 회계를 돌린다 (B-9 (5)). 시프트 생성만
  # 건너뛴다. 복귀 구간 위 장애물이 연쇄를 빠져나가도 standoff 가 25 m 앞에 세운다.
  # false = 이전 동작 (span 활성 중 아무것도 안 봄).
  span_active_standoff_enable: true
  # 시프트가 **대상을 잃으면** 즉시 원복할지 (2026-09-09).
  # 지금은 `route_index > span[1]` 에서만 원복하는데, span 끝이 경로 끝 근처면
  # 그 지점을 못 밟고 시프트가 영원히 남는다. 실측 20260909_093415/실경로_02:
  # span 끝 = rs 776.0 인데 종료선이 749.2 라, rs 722.6 부터 blocker 가 None
  # 인데도 시프트를 쥔 채 종료 차로 (418,2,-1) 대신 -2 로 끝났다
  # (횡오프셋 −3.07 m, 차로유지 −3, 지시등 3건이 전부 이 구간).
  # 콘과 무관한 일반 버그라 종료 구간에 한정하지 않는다.
  # 조건은 **좁다**: 시프트를 만든 그 id 들이 전부 사라졌을 때만 푼다.
  # "회랑이 비었다" 로는 판정할 수 없다 — 시프트 중에는 밀린 경로 기준 회랑에
  # 피한 물체가 안 들어오므로 항상 참이고, 그러면 모든 시프트가 즉시 원복돼
  # 왕복이 된다. false = 이전 동작.
  span_lost_restore_enable: true

  # ── 규칙 1: 신호 구역 억제 (2026-08-30) ─────────────────────────────
  # 대기열은 신호 앞에만 선다 — 이 구역에서는 정지 객체를 봐도 회피하지 않고
  # 선행차 추종·정지 유지를 그대로 둔다. 신호 대기 차량을 비켜가면 신호 위반.
  # 1차 키는 planner.distances_to_next_traffic_lights + 교차로 판정이다.
  # (world.summ.dist_stop_line 은 실측 27% 가 null 이고 실제 장애물 정지
  #  지점에서도 null 이었다. 같은 지점에서 1차 키는 214.8 m 로 정상. 무신호
  #  정지선은 lanegraph 원본을 직접 읽어 보조로 본다.)
  stopline_suppress_m: 30.0
  # span_into_zone 게이트 — 시프트 span(나가는 전이+복귀 전이)이 다음 정지선의
  # 이 거리 앞에서 끝나야 시작한다 [m] (B-1). 예전에는 stopline_suppress_m(30)을
  # 그대로 써서, 정지 위치 25 m + span 39 m 이면 정지선 64 m 앞부터 기각이었다.
  # _signal_zone(억제)과는 결합이 없는 별개 상수다. 0 = 정지선 자체가 경계.
  # 30.0 이면 B-1 이전 동작.
  zone_gate_margin_m: 0.0
  # 대기열 형태 판정 — 정지 객체가 종방향으로 이만큼 벌어져 2대 이상이고
  # 횡 위치가 비슷하면 대기열로 본다 (정지선 데이터가 없는 도로의 사각 보완).
  # 스태거드(케이스 B)는 종방향으로 붙고 횡으로 갈리므로 여기 안 걸린다.
  queue_gap_min_m: 3.0
  queue_lat_max_m: 1.5

  # ── 규칙 3: 선제 회피 (2026-08-30) ──────────────────────────────────
  # 정지 전에 비켜간다. blocker_dist_max(20, REACTIVE 용)와 **분리된** 상수다.
  # 실측: 9910 GT 상한이 80 m 이고 박스류도 정확히 79.9~80.0 m 에서 크기·속도가
  # 모두 채워져 온다 (percep.gt_range_m).
  detect_max_m: 80.0
  # 오프셋 전이를 늦어도 장애물 이만큼 앞에서 시작 [m] = 관찰 감속(standoff)의
  # 정지 위치. 10 → 25 (B-4, 2026-09-02): 정지 상태 전이 12 m + 전이 시작 여유
  # 5 m + 기하 여유 2 m 가 들어가려면 장애물 앞 19 m 이상이 필요한데 10 m 에서
  # 서면 geom 게이트가 영영 못 열린다 (실측 5~10 m 정차 → 매 틱 geom 기각).
  # 부작용(의도): WAIT_EXPIRED 는 s_rel > standoff(25) ∧ obj_s ≥ 6 의 좁은 창으로
  # 축소된다 — 25 m 안에 들어오면 PREEMPT 의 t_left 가 음수라 먼저 걸린다.
  # 기준점: s_rel 은 자차 뒷축 → 객체 중심. standoff 25 = 앞범퍼–객체 후미 ≈ 18 m
  # (앞범퍼 3.8 + 승용차 반길이 2.2). 실측 2026-09-03 001829/01: s_rel 24.2 정지.
  shift_latest_m: 25.0
  # standoff 정지 프로파일 **전용** 바닥 [m]. 위 shift_latest_m 과 값은 같지만
  # 소비처를 나눈다 — shift_latest_m 은 _shift_speed_cap 의 미리보기 창과
  # _try_overtake 의 PREEMPT 시간 예산에도 쓰여, 그 값을 내리면 standoff 와
  # 무관한 두 곳이 함께 움직인다 (2026-09-05 조사). 여기만 내리면 파급이 없고
  # 되돌리기도 이 값 하나다.
  # 25.0 → 22.0 (2026-09-05). 되돌리기는 이 값을 25.0 으로 두는 것 하나다.
  #   하한  기하 완성 게이트(⑥)의 정지 상태 need
  #         = transition_m 12.0 + shift_ahead_m 5.0 + shift_geom_margin_m 2.0
  #         = 19.0 m. 이보다 낮게 서면 서고 나서 시프트를 만들려 해도 매 틱
  #         geom 기각이고, BREAKOUT L3 완화(need 15.0)에 의존하게 되는데 그
  #         사다리는 신호 주기에 리셋된다 (실측 02_직진3: L1 이 0.58 s 만에
  #         cause_gone, L2 도달 실패).
  #   여유  실제 정지 위치는 바닥보다 오버슛만큼 앞이다 — 실측 0.7~2.6 m
  #         (7건). 19.0 + 2.6 = 21.6 → 22.0. 정지 직후 PREEMPT 가 t_left < 0 으로
  #         즉시 걸릴 때 s_rel(19.4~21.3)이 아직 need 19.0 을 넘으므로,
  #         시프트가 크립보다 먼저 한 번의 기회를 갖는다. 20.0 이면 그 기회가 없다.
  #   상한  잠김 7건의 최종 d 최솟값 22.4 m 보다 낮아야 그 위치에서 v_allow > 0.
  # 효과는 **정지 위치를 약 3 m 앞으로** 옮기는 것뿐이다 (실측 정지점 22.4~24.3
  # → 19.4~21.3). 영구 잠금 자체는 오버슛 때문에 어떤 값에서도 남으므로
  # standoff_creep_enable 이 전담한다 — 목적이 다른 두 수정이다.
  # v ≥ 7.33 m/s 에서는 3·v 가 지배해 이 값이 쓰이지 않는다 — 고속 접근
  # 프로파일(검증된 동작)은 문자 그대로 불변이다.
  standoff_floor_m: 22.0
  # ── standoff 기준선 **안쪽** 크립 바닥 (2026-09-05) ────────────────────
  # d < standoff 이면 v_allow = √(2a·max(0, d−standoff)) 가 항구적으로 0 이고,
  # min() 사다리에 이를 되올릴 후보가 없다 → 영구 정지. 실측 7건이 이 형태로
  # 11.5~78.2 s 멈췄다 (2026-09-04: 02_직진3 24.1 m, 05_우회전5 23.3, 100310
  # 22.4, 100458 24.3, 100836 24.2, 104648 11.4, 104807 23.8).
  # standoff_floor_m 을 낮춰도 이 잠금은 사라지지 않는다 — 실측 오버슛
  # 0.7~2.6 m 로 매번 바닥을 넘어 들어가므로 잠금 **지점만** 앞으로 옮겨진다.
  # 기준선 **바깥**(d ≥ standoff) 프로파일은 건드리지 않는다.
  # false = 이전 동작(안쪽에서 0 고정). 기본 off (실차 검증 전).
  standoff_creep_enable: true
  # 크립 속도 [m/s]. 제동거리 0.08 m + 1틱 반응 0.04 = 0.12 m 로 아래 정지
  # 여유(1.0 m)의 1/8. BREAKOUT creep_v(1.0)보다 낮게 잡는다 — 그쪽은 사다리
  # 4단계를 통과해야 열리지만 이건 d < standoff 면 언제나 열린다.
  standoff_creep_v: 0.8
  # 크립이 실제로 멈추는 곳 = **앞범퍼 ~ 객체 근접면** 여유 [m].
  #   d_stop = (wheelbase + front_overhang 3.799) + 객체 반길이 + 이 값
  # d 는 자차 **뒷축 → 객체 중심** 축이므로 앞범퍼 오프셋과 객체 반길이를
  # 반드시 더해야 한다 — 고정 2 m 로 두면 앞범퍼가 객체 중심을 1.8 m 지나쳐
  # 선다(=충돌). score.collision_dist_m(0.1)의 10 배 여유다.
  standoff_creep_gap_m: 1.0
  # 크립 게이트(_standoff_creep)의 `_obstacle_cause` 종점 배제 폭을
  # route_end.active_m(150) 대신 route_end.unlatch_m(30) 으로 좁힌다.
  # active_m 은 종점 유령차 **후보를 만드는 창**이지 "종점이 세웠다" 가 아니다 —
  # never_stall 은 같은 이유로 이미 unlatch_m 을 쓴다(_ns_cause, ns_end_m).
  # 실측 2026-09-09 run_20260909_231730 rs 485.3: d_end 138.1 m 가 150 안이라
  # 크립이 매 틱 creep_block='cause' 로 막혀 정지 차량 20.5 m 뒤에서 189 s
  # 얼었다. 적신호 억제(SHIFT_HOLD)가 아니다 — **녹색 구간에도** v_target 0 이었다.
  # false = 이전 동작(150 m).
  standoff_creep_end_narrow_enable: false
  # 큐 뒤 정지 간격 — 줄을 서는 것이지 비켜갈 것이 아니므로 시프트 전이 공간
  # (standoff_floor_m 22 m)이 필요 없다. 실측 2026-09-09: 18_연속교차로14
  # rs 78.4 에서 standoff_d 20.6 m, run_20260909_232350 rs 485 에서 20.5 m —
  # 앞차와 20 m 를 띄우고 서 있었다. 큐 판정은 `_tick_queue` 를 그대로 쓴다
  # (lane_map 의 큐 제외와 같은 축). false = 이전 동작.
  queue_close_gap_enable: false
  # 크립 지연 시계(standoff_creep_delay_s)를 배제(적신호·큐·보행자) 틱에
  # **멈추기만** 할지(true) 0 으로 되돌릴지(false).
  # 배제 틱을 안 세는 의도는 같지만, 되돌리면 신호가 도는 동안 시계가 영영
  # 만료에 도달하지 못한다. 실측 avoid_sim 12 (run_20260909_232350 재현,
  # 적 13 s / 녹 13 s): 녹색마다 0 → **9.4 s** 까지 갔다가 적색 복귀에 리셋 —
  # 10.0 에 **0.6 s 모자라** 다섯 주기 182 s 를 램프 중간(t_off 1.05 = 차로선
  # 위)에서 굳었다. false = 이전 동작.
  standoff_creep_delay_pause_enable: false
  queue_stop_gap_m: 5.0
  # (3) 목표 차로 점유 판정을 **차로 지도 free_run** 으로 바꾼다.
  # 옛 판정 `_side_is_clear` 는 축이 틀렸다: near = {target} ∪ successors ∪
  # **predecessors** 이고 반경은 **자차 중심** clear_radius_m(30) 이라
  #   · 목표 차로 **뒤**에 선 차가 기각 사유가 되고
  #   · 목표 차로 **앞 50 m** 의 차는 안 보이고
  #   · 정지 차량 무리 안에서는 늘 반경이 차 있어 **항상 occupied** 다.
  # 차로 지도는 정반대 축(앞 lane_map_ahead_m 를 차로별로)이라 그것이 옳다.
  # 판정: free_run[target] > 램프 + shift_ahead_m. 램프는 lane_plan 이 계산한
  # 값을 그대로 읽는다 (같은 수를 두 곳에서 만들지 않는다).
  # 지도가 꺼져 있거나 그 차로가 지도 밖이면 옛 판정으로 간다.
  # false = 이전 동작.
  side_clear_by_map_enable: false
  # 목표 차로 **후방** 감시 창 [m]. 이 안에 자차보다 빠른 차가 있으면 기각한다
  # (채점 항목 14). 정지 차량은 후방 위험이 아니므로 속도 조건을 건다 —
  # 옛 판정은 "있기만 하면 기각" 이라 정지 무리 안에서 영영 못 나갔다.
  # 0 = 후방을 안 본다.
  rear_clear_m: 30.0
  # (c) 전이 길이를 **속도로** 다시 계산한다. 옛 식 max(transition_m(12),
  # shift_k_s·v) 는 정지 상태에서도 12 m 를 요구하고, 그것이 geom 자기잠금의
  # 분모다 (need = 12 + 1 + 2 = 15 m 인데 standoff·크립으로 s_rel 이 7.7 m 까지
  # 내려가면 영영 못 넘는다 — 실측 기각 3,803틱의 s_rel 중앙값 3.9 m).
  # 축은 새로 만들지 않는다: `_ramp_len_m` 의 L ≥ v·π·√(Y/(2·a_lat_max)) 를
  # 그대로 쓴다 (시프트 형상과 같은 식). 5 km/h·한 칸·3.2 m 폭 ≈ 4.5 m.
  # 주행 중에는 옛 값보다 커지지 않게 min 을 씌운다 — 목적은 저속에서 과한
  # 요구를 줄이는 것이지 고속에서 늘리는 것이 아니다.
  # false = 이전 동작.
  trans_m_by_speed_enable: false
  # 전이 길이의 **추가** 하한 [m]. 진짜 바닥은 상수가 아니라 조향 한계에서
  # 유도한다: L ≥ π·√(Y/(2·κ_max)), κ_max = tan(max_steer)/wheelbase.
  # 이 차량(2.94 m, 0.480 rad)은 한 칸 3.2 m 에 **9.4 m** 다. 4.0 고정으로
  # 두면 램프가 조향 한계를 넘어 포화한다 — avoid_sim 11 에서 포화 0 → 27틱.
  trans_min_m: 4.0
  # 크립 **지연 게이트** [s] (2026-09-05, 실차 20260905_155735 근거).
  # 크립은 비가역이다 — s_rel 이 한 번 기하 게이트 need(정지 상태 19.0 =
  # transition_m 12 + shift_ahead_m 5 + shift_geom_margin_m 2) 아래로 내려가면
  # 시프트가 영영 불가능해진다. 155735 실측:
  #   · 01_좌회전2 — 정지 sod 21.9 에서 크립 즉시 시작. 시프트는 매 틱 시도됐으나
  #     right:occupied(우측 차로에 id11 정차). 크립이 4.95 s 만에 s_rel 을 19.0
  #     아래로 끌어내려 그 뒤로는 right:geom 고정.
  #   · 02_직진3 — ot_span 이 활성인 채 크립이 돌아 **시프트 시도가 0회**였다.
  #     크립 0.8 m/s > stuck_eps 0.2 라 bo_stuck_ticks 가 매 틱 리셋되고,
  #     span 활성이면 _try_overtake_inner 가 '기각'을 반환하지 않아 reject 시계도
  #     죽는다 → BREAKOUT 이 안 걸려 span 이 안 풀린다. sod 20.6(≥19.0)에서
  #     시프트를 시도할 기회를 통째로 날렸다.
  # 그래서 s_rel ≥ need 인 동안에는 크립을 **보류**하고 사다리에 기회를 준다.
  # 여는 조건(하나라도): ① s_rel < need  ② BREAKOUT L4 도달  ③ 이 시간 경과.
  # 값 10.0 근거: BREAKOUT 사다리 SHIFT_ACTIVE→L4 실측 8.95 s
  # (20260905_155049 02_직진3: 103.95→112.90; 이론 stuck_hard_s 4.0 +
  # escalate_s 1.5×3 = 8.5). ② 가 정상 경로이고 ③ 은 사다리가 아예 안 도는
  # 경우(신호 전이로 매번 리셋 등)의 안전망이라 그보다 1 s 길게 잡는다.
  # 시계는 **배제(적신호·보행자·큐·종점)에 걸린 틱을 빼고** 보류한 틱만 센다.
  # ot_blocked_ticks 를 쓰면 적신호 대기(실측 22.6 s)가 그대로 쌓여 녹색 직후
  # 지연이 이미 만료된 상태가 된다 — 실측으로 확인하고 전용 시계로 바꿨다.
  # 0 = 지연 없음(즉시 크립) = 20260905_155735 의 동작.
  standoff_creep_delay_s: 10.0
  # ── 교차로 안 자기잠금 해제 (A1, 2026-09-08) ──────────────────────────
  # 실측 근거: logs/batch/20260906_012222/실전주행_교통류_02_직진11.jsonl
  #   t=104.7 좌회전 연결로 진입 → reject='junction' 이 종료(t=138.2)까지 31.2 s
  #   연속. 같은 구간 내내 BREAKOUT level 2 / paused=True 로 **얼어 있고**,
  #   standoff_v 는 t=108.0 부터 0.0 고정. route_s 522.3 에서 30 s 무진전.
  # 왜 어떤 탈출도 안 걸리나 — 교차로 lane 에서 사다리 둘이 **상한 없이** 죽는다:
  #   · _try_overtake_inner  교차로 lane 이면 side 루프 전에 reject='junction'
  #   · _breakout_tick       교차로 lane 이면 맨 앞에서 return (bo_paused)
  #     → bo_level 이 안 오르므로 _creep_gate ②(L4)가 영영 안 열린다.
  # 남는 건 _creep_gate ③(지연 10 s)뿐인데, 그건 사다리가 도는 상황을 전제로
  # 잡은 안전망이지 "사다리가 구조적으로 없는" 교차로용이 아니다.
  # 그래서 reject='junction' 이 아래 시간 이상 연속되면 **교차로 전용으로**
  # 크립을 열고 사다리도 돌린다. 차로 시프트 금지는 그대로다 (연결로에서
  # 옆 차로로 미는 것은 어떤 단계에서도 안 한다).
  # false = 이전 동작(교차로 안에서 크립·사다리 없음).
  # true (2026-09-08): 시뮬 4케이스·02 replay·51 로그 off 지문 검증 통과.
  junction_creep_release_enable: true
  # 무장까지의 연속 기각 시간 [s].
  # 5.0 근거: **교차로 안 정지는 그 자체가 위험**이다 — 후방 차량, 신호 변경,
  # 교차 교통이 전부 자차를 향한다. 반대로 여기서 여는 것은 5 km/h 크립이고
  # (junction_creep_kph), 그것도 min() 상한이라 PDM 의 IDM·OBB 가 그대로
  # 최후 안전망으로 남는다. 위험 비대칭이 분명하므로 짧게 잡는다.
  # 교차로 **밖** 사다리가 L4 에 닿는 시간(stuck_hard_s 4.0 + escalate_s 1.5×3
  # = 8.5 s)에 맞출 이유가 없다 — 그 사다리는 교차로에서 애초에 안 돈다.
  # 실측 replay (20260906_012222 02_직진11, 이 값으로 재생):
  #   reject='junction' 첫 등장 t=104.7 → 무장 t=111.4 (벽시계 6.7 s).
  #   시계는 **연속 기각 틱**만 세므로 벽시계보다 늦다 — 진입 직후 1.7 s 는
  #   자차가 아직 굴러 들어가는 중이라 매 틱 기각이 서지 않았다.
  #   standoff_v 가 0 이던 구간 106.0~111.3 = 4.0 s (스위치 off 는 10.0 s,
  #   그것도 _creep_gate ③ delay 안전망이 겨우 열어 준 값이다).
  junction_release_s: 5.0
  # ① 모드 A 대책 — 기준선 **밖**(d ≥ standoff)에서도 거는 크립 바닥 [km/h].
  # d 가 standoff_floor_m(22.0)에 정확히 얹히면 √(2a·0) = 0 인데, 이때는
  # _standoff_creep 이 호출조차 되지 않아 크립 게이트에 **도달하지 못한다**
  # (시뮬 재현: 장애물 24 m → d 22.0 에서 60 s 무진전, creep_* 키 없음).
  # 무장되면 기준선 밖도 _standoff_creep 을 거치게 해서 이 바닥을 건다.
  # 실주행 02 는 오버슛으로 안쪽(20.1)에 들어간 모드 B 였지만, 바깥에 얹히는
  # 모드 A 도 같은 잠금이라 함께 막는다.
  junction_creep_floor_kph: 3.0
  # 교차로 안 크립 **속도 상한** [km/h]. 회전 중이라 낮게 — 무장된 동안
  # standoff 후보가 이 값을 넘지 않는다. 기본 5.0 은 바닥 3.0 보다 위이고
  # standoff_creep_v(0.8 m/s = 2.88 km/h)도 덮는다.
  # 이건 min() **상한** 후보다 (강제 전진이 아니다) — PDM 의 IDM·OBB 가
  # 그대로 최후 안전망으로 남아 앞차 간격에서 세운다.
  junction_creep_kph: 5.0
  # ── 절대 안 멈춤 (A2, 2026-09-08) ──────────────────────────────────────
  # 왜: 상한 없는 정지 조건이 아직 6가지 남아 있다 (A2 작업1 전수).
  #   ① _standoff_creep block('stop_gap') — 진짜 정지 거리 안. 상한 없음.
  #      실측 33.3 s (logs/run_20260907_154131, 2.4 m 뒤, right:no_neighbor)
  #   ② BREAKOUT CREEP_FAIL — 탈출은 _obstacle_cause 가 거짓이 되는 것 하나.
  #      코드 주석이 "정지 유지 (리스폰 대기·유도는 미구현)" 라고 명시한다.
  #   ③ block('no_size') — 객체 반길이 미보고
  #   ④ 모드 A — d 가 standoff_floor_m 에 얹혀 _standoff_creep 미호출 (시뮬)
  #   ⑤ 시프트 전 사유 기각 (no_neighbor·solid·occupied·geom·zone·kappa)
  #   ⑥ UNKNOWN 큐 — _is_queue_v2 가 "해제 시한이 없다" 고 명시. 같은 상황의
  #      다른 안전망 _signal_timeout_tick 은 `not _tick_corridor` 를 요구해
  #      큐(=회랑 객체 있음)에서는 시계가 안 돈다. **둘이 동시에 죽는다.**
  # 여기에 시계를 하나 두고 단계적으로 푼다. 각 단계는 여전히 min() **상한**
  # 후보라 PDM 의 IDM·OBB 가 남는다 — 마지막 단계만 예외다 (아래).
  # 절대 풀지 않는 것: 적신호·보행자·정지표지·종점. _ns_cause 가 게이트다.
  # false = 이전 동작.
  # true (2026-09-08): 시뮬 4케이스(양쪽 차단·교차로 안·실선·교차로 앞 회전차로)
  # 가 off 에서 60 s 무진전 → on 24.9~29.9 s 전진. 51 로그 off 지문 동일,
  # 정지 ≥20 s 로그 13건 on/off 동일(=회귀 없음. 실측에서는 아직 무장한 적이
  # 없다 — 시계 최대 15.2 s < 20 s 이고, ≥20 s 로 남은 9건은 적신호·황색 래치
  # 등 **보호 배제**라 푸는 것이 맞지 않다).
  never_stall_enable: true
  # 무진전 상한 [s]. 이 시간을 넘으면 1단계. 20.0 근거: 정상 경로의 최장 해제가
  # BREAKOUT L4 도달 8.5 s + creep_fail_s 6.0 = 14.5 s 이고, 큐 무신호 해제가
  # 10 s 다. 그 위에 여유를 둬 "정상적으로 풀릴 것" 을 앞지르지 않게 한다.
  deadlock_max_s: 20.0
  # 단계 간격 [s]. 1단계(크립) → 2단계(CREEP_FAIL 재진입) → 3단계(최후).
  never_stall_step_s: 5.0
  # 1·2단계 크립 속도 [km/h]. junction_creep_floor_kph 와 같은 눈금.
  never_stall_creep_kph: 3.0
  # 3단계 — **회랑 무시** 전진 [m/s]. 이때만 breakout_creep() 훅을 강제로 열어
  # 선행차·OBB 후보를 무효화한다. 접촉 위험을 감수하는 최후 수단이고, 그래서
  # 속도를 1.0 으로 묶는다 (BREAKOUT creep_v 와 같은 값).
  never_stall_force_v: 1.0
  # ── (c) 회전 차로 복귀 예외 ────────────────────────────────────────────
  # 다음 교차로의 유효 진입 차로(route.pkl 의 valid_entry_lanes, target='pair')
  # 에 현재 차로가 없고, 그 교차로까지 남은 거리가 복귀 전이거리 + 아래 여유
  # 안이면 — **전진보다 복귀가 급하다**. 크립으로 앞으로 나가면 복귀 공간을
  # 그만큼 까먹어 회전 차로에 못 붙고, 그건 정지보다 나쁘다.
  # 그 창 동안 시프트 span 을 원복하고(계획 경로가 회전 차로로 데려간다) 단계
  # 상승을 보류한다. **보류에도 시한이 있다** — never_stall 이 새로운 무한
  # 대기를 만들면 안 되므로, 이 시간이 지나면 그냥 크립으로 넘어간다.
  never_stall_turn_hold_s: 6.0
  never_stall_turn_margin_m: 10.0
  # 전이 길이 속도 비례 계수 [s]. 코사인 전이의 최대 횡가속
  #   a_lat = v²·Δ·π²/(2L²)  →  L = v·√(Δπ²/(2·a_lat))
  # Δ=3.0 m(차로 한 칸), a_lat=1.5 m/s²(쾌적) 이면 L ≈ 3.14·v → 3.0 채택.
  shift_k_s: 3.0
  # 전이 시작을 자차 앞 이만큼으로 강제 [m] — 뒤에서 시작하면 현재 위치의
  # 경로가 옆으로 밀려 정지 상태에서 조향 풀락 (실측 steer +0.480 고정 17.8 s).
  shift_ahead_m: 5.0
  # 객체가 이 시간 이상 정지로 관찰돼야 '정적' [s] (물체별 타이머).
  # 3.0 → 1.5 (D, 2026-09-03): 50 km/h(13.9 m/s)에서 3.0 s 관찰은 42 m 를 소모해
  # 80 m 감지 → s_rel 38 < geom need 49(전이 42 + 여유 7) 로 매 틱 geom 기각이다.
  # 1.5 s 는 21 m 소모 → 59 ≥ 49 통과. 대기열 오탐은 C 의 큐 판정(녹색 3 s 해제)이
  # 막으므로 1.5 가 성립한다. 소비처: _static_ok(회랑 정적·PREEMPT 조건),
  # ped_static(보행자 의도 래치의 '정지 관찰') — 래치가 앞당겨질 뿐이다.
  obj_static_s: 1.5
  # standoff(관찰 감속) 대상 정지 시간 [s] (B-5) — obj_static_s 와 달리 **신호와
  # 무관하게** 센다. obj_ticks 는 적색 중 멈춰 녹색 직후 앞에 선 차량이 '정적'
  # 이 되기까지 3 s 가 더 걸리고 그동안 standoff 감속이 없었다. 회랑 조건(침범·
  # 전방)은 같고, 이 시간 이상 정지한 가장 가까운 객체까지의 거리가 standoff
  # 상한의 기준이 된다. PREEMPT/WAIT 판정은 여전히 obj_static_s. 0 = 이전 동작.
  # 1.5 → 1.0 (C-7): 교통류_02 id27 은 정지 후 1.5 s 동안 자차가 4 m/s 로 6 m 를
  # 더 접근한 뒤에야 대상이 됐다.
  standoff_stop_s: 1.0
  # id 가 잠깐 빠져도 타이머를 유지할 틱 수 (GT '가까운 순 30개' 제한 대비)
  obj_grace_ticks: 10

  # ── 대기열 판별기 3중 교정 (2026-08-30) ─────────────────────────────
  # 형태(종으로 벌어짐 + 횡 비슷)만으로는 1차선을 물고 선 장애물 2개가 그대로
  # 대기열로 잡힌다 (실측 실전주행_교통류_01: 경로기준 횡 +1.75/+0.55 로 1.2 m
  # 차 → 대기열 오판 → 회피 전면 억제 → 49 s 무한 정지 후 미완주).
  # 판별기 ① 옆으로 지나갈 폭이 남으면 대기열이 아니라 회피 대상이다.
  queue_min_clear_m: 0.3
  # 판별기 ② 대기열은 **선두가 정지선을 향해** 선다. 선두 앞 이 거리 안에
  # 정지선·신호가 있어야 대기열로 본다.
  queue_head_max_m: 25.0
  # 1급 안전망 — **시한 없는 억제 금지**. 대기열은 신호 주기로 풀린다.
  # 이 시간 넘게 안 풀리면 판정을 스스로 철회하고 회피·BREAKOUT 을 허용한다.
  # (suppress_mode: legacy 전용. queue_only 는 아래 q_*_release_s 가 대신한다 —
  #  15 s 는 실측 38.8 s 적신호 안에서 큐를 철회해 버린다.)
  queue_hold_s: 15.0
  # ── 억제 단일화 (C, 2026-09-03) ──────────────────────────────────────
  # queue_only: 회피 억제는 _is_queue 하나. 적색은 일시정지(obj_ticks pause·
  # bo_paused·SHIFT_HOLD), 교차로는 side 루프 lane 검사(시프트 금지) + BREAKOUT
  # pause, 정지선 30 m 억제는 없다. 실측 교통류_02: 적신호 억제 1259틱(32.5 %)·
  # junction 억제 446틱이 회피·standoff·BREAKOUT 을 원천 차단해 id27 을 28 m 에서
  # 보고도 standoff 없이 IDM 이 범퍼 0.45 m 에 세웠다.
  # 큐 = 정지 객체 ≥1 ∧ (선두가 정지선 queue_head_max_m 안 ∨ 신호 Red/Yellow ∧
  # 정지 객체 전부가 자차~정지선 사이). legacy = 이전 3중 억제 (바이트 동일).
  suppress_mode: queue_only
  # 큐 해제 — 신호 있음: 녹색이 이 시간 지나도 선두가 정지면 큐가 아니라 장애물.
  q_green_release_s: 3.0
  # 큐 해제 — 무신호 정지선: 이 시간 지나고 보행자 가드(회랑 안 또는 접근 중
  # 보행자)가 없으면 해제. 서 있는 인도 보행자는 가드가 아니다.
  q_nosignal_release_s: 10.0
  # ── 신호 미보고 큐 판정 (2026-09-06, 020738/13 근거) ─────────────────────
  # 9910 은 교차로 연결로 위에서는 신호를 보내지 않고(실측 16런 in_junction 틱
  # 보고율 0.0~2.8 %), 정지선 150 m 밖은 절반만 온다. 못 받은 신호는 플래너
  # 기본값 Green 으로 남아, 교차로 출구 정지선(예: ctrl 167/168·32/33)의 적신호
  # 대기열이 큐가 아니라 장애물로 보였다 — 13_좌회전7: 736틱 전부 미보고 →
  # green_expired 로 큐 해제 → 회피 → junction 기각 → 고착. 켜면 다음 정지선
  # controller 가 signal_stale_s 이상 미보고일 때 UNKNOWN 으로 보고, 큐 판정에서
  # Red 와 같이 다룬다(해제 시한 없음 — 선두가 떠나면 저절로 풀린다). 정지
  # 후보(_stop_target)·SHIFT_HOLD(_red_ahead)는 건드리지 않는다: UNKNOWN 은
  # Green 을 만들지도 Red 를 풀지도 않는다. false = 이전 동작(로그까지 동일).
  signal_stale_queue_enable: true
  # 미보고 판정 시간 [s]. 실측(16런): 정지선 100 m 안·교차로 밖에서 "보였다가
  # 끊긴" 구간 0건 — 깜빡임은 없다. 1.0 s = 20틱이면 충분히 안전하다.
  signal_stale_s: 1.0
  # ── B-3(b) 미보고 적신호 시한 출발 (2026-09-06 승인) ────────────────────
  # Red 로 선 뒤 controller 보고가 끊기면 플래너 state 가 Red 로 남아 영구 정지다.
  # 켜면 앞차 없음(정지 회랑 객체 0 ∧ 아래 clear_m 안 이동 차량 0) ∧ 보행자 래치
  # 없음 ∧ 정지 중 ∧ 미보고가 signal_unknown_timeout_s 이상이면 신호 정지 후보
  # (_stop_target 프로파일·홀드, PDM 적신호 IDM)를 놓고 min() 이 다른 후보로
  # 속도를 정한다. **적신호 통과를 만들 수 있는 유일한 경로다** — 시나리오 xml 의
  # 주기는 26 s(114개)·36 s(181개)·71 s(13개, 적색 60 s)·116 s(1개)이고, 주기
  # 신호에서는 기다린 시간이 적색 확률을 줄이지 않는다: 71 s 주기·적색 60 s 인
  # controller(167/168)에서는 10 s 든 90 s 든 85 % 확률로 적신호 통과(항목 7
  # 중대)다. 실측 020738 16런에서 성립 틱 0 (Red→None 6건은 전부 통과 직후).
  # 10.0 s 는 사용자 지정. false = 이전 동작(영구 정지, 미완주 감수).
  signal_timeout_go_enable: true
  signal_unknown_timeout_s: 10.0
  # ── 앞차가 서 있어도 시한이 돌게 (A3, 2026-09-08) ─────────────────────
  # 지금은 회랑에 정지 객체가 하나라도 있으면 위 시계가 **아예 안 돈다**
  # (`not self._tick_corridor`, 그리고 clear_m 검사도 static_ok=True 라 정지
  # 객체까지 센다). 그런데 같은 상황을 막아 주던 다른 안전망도 같이 죽는다:
  # _is_queue_v2 는 UNKNOWN 큐에 "해제 시한이 없다" 고 명시한다. 즉
  # **미보고 신호 + 안 움직이는 앞차 = 두 안전망이 동시에 죽어 무한 정지**다.
  # (A2 never_stall 이 3단계에서 시한을 주지만 그건 20 s 뒤의 최후 수단이고,
  #  신호 축의 정상 해제가 따로 있어야 한다 — 둘 다 필요하다.)
  #
  # 켜면 **정지** 객체는 시계를 막지 않는다. 움직이는 차량은 그대로 막는다.
  # 안전한 이유: 시한이 만료돼도 푸는 것은 **신호 유래 정지 후보**뿐이고
  # (_stop_target → None), PDM 의 선행차 IDM 은 그대로 살아 앞차 뒤에 선다.
  # "신호를 못 봐서 서 있는 것" 만 풀고 "앞차 때문에 서 있는 것" 은 안 푼다.
  # false = 이전 동작.
  signal_timeout_with_lead_enable: true
  # 해제 보류 — 이 거리 안 회랑에 이동 차량이 있으면 시계를 0 으로 [m]
  signal_timeout_clear_m: 30.0

  # ── WAIT: 앞차 출발 기회 (2026-08-30) ───────────────────────────────
  # 정적 장애물을 봐도 곧장 비켜가지 않고 이 시간까지 관찰한다. 관찰 중에도
  # standoff 속도 상한(④′ 형태)으로 감속해 시프트 전이 공간을 확보한다.
  # 일률 대기는 못 쓴다 — 10.6 m/s 에서 잔여 16 m 인데 전이가 42 m 면 늦는다.
  # 시간 예산 규칙: obj_s ≥ obj_static_s 이고 (d−standoff)/v < (wait−obj_s)
  # 이면 즉시 시프트, 아니면 최대 wait 까지 관찰.
  # 6.0 → 3.0 (E-4, 2026-09-03): 020439/02 는 WAIT 5.75 s 동안 standoff 감속으로
  # 11 → 6.7 m/s 까지 떨어진 뒤에야 첫 시도를 했다. 차량은 obj_static_s(1.5) 관찰
  # 뒤 t_left 예산이 남고, 장애물 클래스(E-1)는 관찰이 없어 t_left 판정만 남는다.
  wait_before_shift_s: 3.0
  # 예산 소진 래치 (E-4). 한 번 PREEMPT/WAIT_EXPIRED 가 된 차단물은 기각돼도 다음
  # 틱 WAIT 로 되돌아가지 않는다 — t_left 는 standoff 감속으로 v 가 떨어지면 다시
  # 커져 예산 3 s 에서는 한 틱 기각 뒤 WAIT 로 튀고, E-3 의 첫 기각 시계가 끊긴다
  # (replay 020439/01 t=38.0 PREEMPT → 38.05 WAIT → 39.85 WAIT_EXPIRED). 차단물이
  # 바뀌거나 시프트에 성공하면 해제. false = 이전 동작.
  preempt_latch_enable: true
  # 점선 커버리지 허용 오차 [m] — 마킹 데이터 이산화 여유.
  dash_slack_m: 2.0

  # ── 규칙 2: 데드락 해제 BREAKOUT (2026-08-30) ────────────────────────
  # 규칙 3(선제)·기존 REACTIVE 로도 못 뚫린 채 정지가 지속되면, 회피 제약을
  # 단계적으로 풀고 마지막에 크립으로 전진을 강제한다. 미완주(사실상 실격)보다
  # 접촉 경미 감점이 유리하다는 손익 판단이 전제다.
  # 발동 게이팅: 정지 원인이 장애물 계열일 때만. 신호·보행자·정지선 홀드·
  # 종점 래치·황색 래치·교차로 통과 가드 중에는 **절대 미발동**.
  # false 면 완전 비활성 = 1차(규칙1+3)까지만 동작한다.
  breakout_enabled: true
  # 정지로 볼 속도 [m/s]
  stuck_eps: 0.2
  # 이 시간 정지(또는 기각, 아래 reject_clock)가 지속되면 BREAKOUT 진입 [s]
  # 10 → 4 (E-3, 2026-09-03): 020439/03 은 정지 10.5 s 뒤에야 L1. 시계를 첫 기각부터
  # 세면 4 s 는 standoff 정지(≈25 m, 6~7 s 소요) 전에 L1 에 닿는 값이다.
  stuck_hard_s: 4.0
  # 단계 상승 간격 [s] — 각 단계에서 진전이 없으면 다음 단계로
  #   L1 회랑 하한·측방 반경 완화 / L2 실선 허용 / L3 여유폭 축소 / L4 크립
  # 2.0 → 1.5 (E-3): 첫 기각 후 4 s L1, 5.5 s L2(zone 완화), 7 s L3.
  escalate_s: 1.5
  # BREAKOUT 시계를 '첫 기각' 부터 (E-3). PREEMPT/WAIT_EXPIRED/REACTIVE 가 양쪽
  # 다 기각된 첫 틱부터 주행 중에도 센다 — 정지(v<stuck_eps) 만 세던 이전 동작은
  # 25 m standoff 정지를 먼저 만든 뒤 10 s 를 더 기다렸다. 기각이 아닌 정지 원인
  # (_obstacle_cause 거짓)은 기존대로 발동하지 않는다. 안전 가드: occupied 완화(L1)
  # 와 크립(L4)은 이 시계로는 열지 않고 **정지 stuck_hard_s 경과** 를 요구한다 —
  # 주행 중 점유 차로로 밀거나 IDM 을 끄면 안 된다. false = 이전 동작.
  breakout_reject_clock_enable: true
  # 크립 목표 속도 [m/s]
  creep_v: 1.0
  # 정상 복귀 판정 — route_s 가 이만큼 늘면 진전으로 보고 BREAKOUT 종료 [m]
  progress_m: 2.0
  # 크립 중 '진전 있음' 으로 볼 최소 증가 [m] (잡음과 구분)
  creep_progress_eps_m: 0.3
  # 크립 실패 판정 [s] — **접촉은 실패 조건이 아니다.** 진전이 있는 한 계속하고,
  # 이 시간 동안 무진전이면 CREEP_FAIL 로 포기하고 정지를 유지한다
  # (충돌 반복 방지). 리스폰 대기·유도는 규정 확인 전까지 미구현.
  creep_fail_s: 6.0
  # ── 시프트 전이 횡가속 상한 (P1, 2026-09-01 실전주행_교통류_01 t=112.4) ──
  # transition_m 은 시프트 **생성 시점** 속도로 정해진다
  # (trans_m = max(transition_m, shift_k_s·v)). 정지 중 생성되면 12 m 로 굳는데,
  # 적신호 SHIFT_HOLD 로 21 s 를 서 있다 6.5 m/s 로 통과하면 코사인 전이의
  # 요구 횡가속이 Δ·π²·v²/(2·L²) = 4.34 m/s² 가 된다 — 조향이 양방향 풀락
  # (±0.480)으로 포화하며 경로 대비 1.45 m 오버슛, 황색 중앙선을 0.94 m 물었다.
  # 경로를 다시 밀지 않고(급조향 금지 원칙) **속도 상한**을 min() 후보로 덧댄다:
  #   κ = |d²(lat_shift)/ds²|,  v_cap = √(a_lat_max / κ)
  # 0 이면 비활성 = 이전 동작.
  a_lat_max: 1.5
  # 위 상한의 하한 [m/s] — 전이 곡률이 아무리 커도 이 밑으로는 안 내린다
  # (전이 한복판에서 완전 정지하면 빠져나올 수 없다).
  shift_cap_min_v: 1.0
  # ── 시프트 기하 계단 검사 (B-7 임시 가드) ────────────────────────────
  # 적용 **전에** 목표 이웃 차로 오프셋의 횡곡률 κ [1/m] 을 재 로그에 남기고,
  # shift_kappa_reject 를 넘으면 그 side 를 기각한다 (그 시점 그 경로 한정 —
  # 재시도 금지 플래그를 걸지 않는다).
  #
  # 실측 2026-09-02, 20260901_174724 배치의 시프트 5건 (간격 1.0 m):
  #   좌24 #1 (계단 2.854 m)  κ_raw = 2.977   ← 결함
  #   좌24 #2 / #3            κ_raw = 0.0002 / 0.0025
  #   좌8  C  / D             κ_raw = 0.0095 / 0.0008
  # 정상 최대 0.0095 대 계단 2.977 = 313 배. 1.0 이면 정상 대비 105 배 위,
  # 계단 대비 3 배 아래다.
  #
  # **기본값 0.0 = 기각하지 않고 계측만 한다.** 켜기 전에 배치에서 확인할 것:
  #   (a) 계단이 장애물보다 앞에 있는가 뒤에 있는가 — 실측 1건은 장애물
  #       13.8 m **뒤**(복귀 전이)라, 기각하면 이미 성공한 회피를 잃는다.
  #   (b) 기각 시 폴백이 실제로 무엇인가 — PREEMPT 경로에서는
  #       ot_blocked_ticks 가 증가하지 않아 REACTIVE 가 무장되지 않는다.
  #       남는 것은 BREAKOUT(정지 10 s 후) 뿐이다.
  shift_kappa_reject: 0.0
  # 위 검사 표본 간격 [m]. 0.1 m 전 해상도는 span 하나에 30 ms 가 넘어 틱
  # 예산(50 ms)의 72% 를 먹는다 — 1.0 m 는 1.7~5.2 ms 이고 계단은 그대로 보인다.
  shift_kappa_step_m: 1.0
  # ── 계획 차선변경 중첩 검사 (B-11) ──────────────────────────────────
  # 회피 시프트 span 안에서 **빌드 시점 계획 횡오프셋**(_lat_build)이 이만큼
  # 넘게 변하면 그 side 를 기각한다. lat_shift = _lat_build ± d 라 두 횡이동이
  # 구조적으로 **합산**되기 때문이다 ([route.py] shift_route_smoothly).
  #
  # 실측 2026-09-02, 20260902_131600 실전주행_교통류_01_좌회전24 t=112.8~134.0:
  #   회피 복귀(+3.0 m) + 계획 LC(+2.94 m) 가 rs 634.5~646.5 에서 12 m 중첩 →
  #   자차가 한 동작으로 **6.25 m (차로폭 3.00 의 2.08 배)** 를 횡단했다.
  #   지시등은 t=112.59~133.09 좌로 연속 1회 점등뿐 — 점등 1회에 차로 경계
  #   좌측 통과 2회(t=128.59, 132.19). 항목13 규정 위반 형태다.
  # 시프트별 lc_var 실측: 문제 건 2.597 / 정상 건 0.000.
  # 계획 LC 블렌드는 37 m 에 걸쳐 약 3 m 이동한다 (경로 전수 16건).
  #
  # **기본값 0.0 = 기각하지 않고 계측만 한다** (reasons.avoid.lc_var).
  # 임계는 배치 전수 분포를 더 모은 뒤 확정한다. 켤 때 권고값 1.0.
  # 켜면 B-10 의 폴백 경로를 함께 봐야 한다 (기각 → REACTIVE 무장 여부).
  shift_lc_overlap_m: 0.0
  # ── 시프트 기하 완성 게이트 (B-12) ──────────────────────────────────
  # 전이가 **장애물 도달 전에 끝나는가**. 안 끝나면 그 side 를 기각한다.
  #   need = trans_m + shift_ahead_m + shift_geom_margin_m  ≤  s_rel(actor)
  #
  # 왜 필요한가 — side 루프의 기존 7게이트(no_neighbor / center_line /
  # span_into_zone / solid / occupied / kappa / lc_overlap)에 이 검사가 없다.
  # 간접 방어인 PREEMPT 의 t_left = (s_rel − standoff)/v 는 저속·근접에서
  # **음수로 크게 벌어져 오히려 더 확실히 발동하는 역방향** 구조다.
  #
  # 실측 2026-09-02, 20260902_131600 실전주행_교통류_01_좌회전24 t=214.85:
  #   s_rel 5.3 m, v 0.00 → standoff 10.0, t_left −47.0 → PREEMPT 통과
  #   trans_m 12.0 + shift_ahead_m 5.0 = 17.0 m 필요, margin = −11.7 m
  #   → 장애물 지점의 경로 횡이동이 3.0 m 중 **0.0046 m (0.15 %)**.
  #     사실상 시프트 없이 경로만 흔들고 접촉(min_gap 0.0) 33.4 s, 미완주.
  #   같은 조건으로 BREAKOUT L1~L3 이 3회 더 재생성했다 (총 4틱, 전부 미완).
  #
  # 임계 근거 (같은 로그 side 루프 진입 5틱 + WAIT 56틱의 margin):
  #   정상 계열 +33.91 ~ +39.20   /   불가 계열 −11.70   → 간극 45.6 m
  # 간극이 넓어 작은 값으로 충분하고, 중간 영역 실측이 없어 큰 값을 정당화할
  # 데이터가 없다. 2.0 은 전이 길이 12 m 의 약 1/6.
  shift_geom_gate_enable: true
  shift_geom_margin_m: 2.0
  # ── 게이트 ↔ BREAKOUT 단계 연동 (B-2, 2026-09-02) ───────────────────
  # BREAKOUT 단계(escalate_s 마다 +1)는 원래 solid·occupied 만 풀었다. 실선은
  # 두 바퀴 구조(B-3)가 대신 보고, 단계는 zone·geom 게이트에 쓴다.
  # center_line·kappa·lc_overlap 은 어느 단계에서도 풀지 않는다.
  # 단계가 이 값 이상이면 span_into_zone 게이트를 건너뛴다. 99 = 절대 안 품.
  zone_gate_relax_level: 2
  # 단계가 이 값 이상이면 전이 시작 여유를 shift_ahead_m 대신 shift_ahead_l3_m
  # 으로 줄인다 → 정지 시 geom need = 12 + 1 + 2 = 15 m (transition_m 하한 12 는
  # 그대로). 99 = 절대 안 줄임.
  geom_relax_level: 3
  shift_ahead_l3_m: 1.0
  # ── solid 두 바퀴 (B-3, 2026-09-02) ──────────────────────────────────
  # 1바퀴는 단계와 무관하게 점선 게이트를 강제한다 (점선이 있으면 거기서 끝).
  # 1바퀴가 solid 로 기각돼 양쪽 다 실패했을 때만 2바퀴를 돌며 solid 게이트만
  # 건너뛴다. 비용: cKDTree 최대 4회 ≈ 21 ms 인데 1바퀴 전부 기각일 때만
  # 도니 정상 주행 비용 0. false 면 1바퀴만 = 이전 동작 (실선 절대 안 넘음).
  solid_second_pass_enable: true

  # ── E: 정적 장애물 반응성 (2026-09-03, 020439 3건 + 003759 5건 분석) ────
  # 증상: 옆 차로가 비었는데 25 m 앞에 서서 10~30 s 기다리거나 끝내 못 갔다.
  # E-1 장애물 클래스 fast path. vtd_adapter/world.classify 가 크기로 나눈
  # cls('obstacle' = 길이 ≤ 3 m 정지 물체, 'vehicle' = 길이 > 3 m)를 읽어, obstacle
  # 은 정지 관찰(obj_static_s·standoff_stop_s) 없이 즉시 정적으로 보고 큐 판정
  # (_is_queue) 대상에서 뺀다 — 박스는 출발할 앞차가 아니고 신호 대기열도 아니다.
  # 실측 020439/01 t=71~90: 박스 id4 가 선두인 큐 B 112틱. false = 이전 동작.
  obstacle_class_fastpath_enable: true
  # E-2 span_into_zone → 기각 대신 연장. span 끝이 정지선을 넘으면 (a) 정지선 뒤에
  # 교차로가 없으면(횡단보도 정지선) 그대로 통과, (b) 교차로가 있으면 옆 차로가
  # 그 교차로를 직진 관통하고(lg 이웃·successor 연속) 경로가 그 안에서 회전·
  # 차선변경을 요구하지 않을 때 extra_after 를 교차로 출구 + zone_exit_margin_m
  # 까지 늘려 교차로 뒤에서 복귀한다. 연장 불가(회전·통과 차로 없음·출구 미상·
  # 연장 상한 초과)일 때만 기각. 적색이면 SHIFT_HOLD 가 옆 차로에서 정지선에 세운다.
  # 실측 020439/02·003759/02: 횡단보도 정지선 304.0 이 span 끝 328/318 을 기각해
  # 25 m 앞 정지 → 미완주. false = 이전 동작(기각).
  zone_extend_enable: true
  zone_extend_max_m: 120.0
  zone_exit_margin_m: 5.0
  # 정지선에서 이 거리 안에 교차로 진입이 있으면 '그 정지선의 교차로' 로 본다
  # (지도 실측: 정지선 → junction_in 0.15 m). 이보다 멀면 정지선만 있는 것.
  zone_junction_gap_m: 5.0
  # E-6 SHIFT_HOLD 정리. 적색이면 span 통과 후에도 SHIFT_HOLD 가 원복 검사보다
  # 먼저 반환해 회랑·standoff·막힘 회계가 전부 멈췄다 — 실측 020439/01 t=52~71,
  # 03 t=47~68: 이미 지나간 span 을 쥔 채 다음 박스에 standoff 없이 접근해 접촉.
  # true = 원복 검사를 먼저 하고, 홀드 중에도 span 활성과 같이 standoff·회계를
  # 돌린다 (span_active_standoff_enable 과 결합). false = 이전 동작.
  shift_hold_restore_enable: true
  # E-7 적색 일시정지 거리 상한 [m]. 다음 적신호 정지선이 이보다 멀면 회피 계층은
  # 적색을 없는 것으로 본다 — 관찰 일시정지(obj_ticks)·큐 B·BREAKOUT 일시정지.
  # 근거(2026-09-03 8로그 리플레이): 진짜 대기열(큐 AB, 교통류)은 정지선 12~52 m
  # 에서 잡혔고, 큐 B 단독은 전부 137~501 m 앞 적신호였다 (정지 차량 1대를 456 m
  # 앞 신호의 대기열로 오판 → 020439/03 12 s, 02 25 s 정지). 0 = 거리 무관(이전).
  red_pause_max_m: 100.0
  # ── E-8 실차 전 보정 (2026-09-03) ────────────────────────────────────
  # ① 마킹 'none' 구간은 점선과 같이 넘을 수 있는 구간으로 센다 — 선이 없으면
  # 실선 차로 변경(항목 6)이 아니다. 실측 020439/02: 정지선 앞 none 구간(lane-local
  # 35.9~57.7)이 안 잡혀 1바퀴 solid 기각 → 2바퀴(실선 생략)로 시프트가 생성됐다.
  # false = 이전 동작(점선만).
  none_marking_crossable: true
  # ② L2 zone 완화 범위 한정 — zone_no_exit / zone_extend_max (와 평가 불가
  # span_into_zone) 만 L2 에서 해제. zone_turn / zone_lane_change /
  # zone_no_through_lane 은 경로가 그 교차로에서 회전·차선변경·통과를 요구하는
  # 경우라 전 단계·전 바퀴 유지 (옆 차로 통과 = 필수 경로 위반). false = 이전 동작
  # (L2 부터 zone 게이트 전체 생략).
  zone_relax_limited: true
  # ── span 국소성 게이트 (2026-09-03 실주행 100310/100458) ──────────────
  # plan_shift_span 은 차단물에 가장 가까운 경로점을 남은 경로 전체에서 찾는다
  # (PDM 원문과 동일). 순환 코스에서 같은 자리를 두 번 지나면 4.5 km 앞 경로점이
  # 잡혀(실측 13건 4550~4595 m) 자차 앞이 아닌 구간이 밀리고 자차는 SHIFT_ACTIVE
  # 로 원복만 기다리며 섰다(100310 158틱). 시프트 시작점이 자차보다 max_m 이상
  # 앞이면 기각(span_too_far). 정상 시프트 실측 5.0~34.7 m. route.py 근본 수정은
  # 범위 밖. false = 이전 동작(거리 무관). 기본 off.
  span_gate_enable: true
  span_gate_max_m: 100.0
  # ── 전이 배치 (2026-09-03 실주행 100310/100458) ────────────────────────
  # 전이 시작이 자차 +shift_ahead_m 고정이라 우측 차로 11 m 의 id3 를 스쳤다(OBB
  # 이격 −0.44, 중심선 0.08). 복귀 끝이 표적 +extra_after_m 고정이라 100458 은 우측
  # 차로 41 m 의 id5 를 복귀 전이로 쳤다(−0.33). 시프트 폭·cos 전이로 자차 궤적을
  # 그려 delay ∈ [0, max_delay] × after ∈ [exit_min, extra_after] 격자에서 최소
  # 이격(임계 percep.obstacle_clearance_m)을 최대화한다. 기본 배치가 이미 임계
  # 이상이면 현행 유지. 전부 미달이면 entry_block 기각. 전이 길이는 안 줄인다.
  # 재구성 경로 계산: 100310 delay 5.5~6 → id3 1.44/id4 1.55, 100458 after 0~4 →
  # id5 1.76~1.88. false = 이전 동작(기본 off, 실차 검증 전).
  shift_entry_enable: true
  # ── gap_fit: 옆 차로 빈 구간에 맞춰 span 을 다시 고른다 (2026-09-05) ──────
  # 문제: span 은 차단물 하나를 중심으로 대칭으로 그려지고 전이 길이가 **결정 시점
  # 속도**에 비례한다(trans = max(transition_m, shift_k_s·v)). 그래서 빠를수록
  # span 이 길어져 목표 차로에 정차한 차를 삼킨다. 실주행 3건이 이 형태로 고착:
  #   202508 / 211215 / 212101 — entry_base_clear −1.27/−1.16/−1.81,
  #   entry_plateau_ids [2], chain [3] → 전부 CREEP_FAIL.
  #   반대로 계속 주행한 3건(211630/211718/212035)은 +1.12~+1.13, 플래토 없음.
  #   **entry_base_clear 의 부호가 결과를 3/3 으로 가른다.**
  # 지그재그 실측(202508, 1차로 rs 57.4 · 2차로 73.5 · 1차로 88.5):
  #   현행  trans 21.2, span 45.1~106.9 → id2·id4 이격 0.00 (두 대 충돌)
  #   최적  trans 12.0, eb 0, ea 0, span 59.3~87.7 → 최소 이격 0.86
  #   전이 21.2 로는 (a,b) 를 어떻게 잡아도 통과 조합이 **하나도 없다**.
  # 판정은 기존 _span_clear_model.clear_at 하나로 한다. 빈 구간은 탐색 범위를
  # 좁히는 진단일 뿐이다 — span 을 빈 구간 **안**에 넣는 규칙은 너무 엄격해서
  # 202508 이 기각된다(빈 구간 21.3 m → 최대 전이 6.0 < transition_m 12.0).
  # 전이 시작·끝에서는 횡변위가 0 이라 옆 차로 객체와 무관하기 때문이다.
  # **기각하지 않는다** — 더 나은 배치를 못 찾으면 현행 그대로 간다. clear_at 이
  # 실제보다 보수적인 경우가 있어(211630/211718 2번째 시프트: clear_at 0.08 인데
  # 실제 통과 이격 1.09/1.06) 기각으로 쓰면 잘 가던 케이스를 막는다.
  # false = 이전 동작. 기본 off (실차 검증 전).
  gap_fit_enable: true
  # 이 이격을 확보하는 **가장 큰** 전이에서 탐색을 멈춘다 [m]. 전이가 길수록
  # 감속이 적으므로 "충분한 첫 T" 에서 멈춘다.
  # 0.6 → 0.9 (2026-09-05 실측): 판정에 쓰는 clear_at 모델이 자차 OBB 스윕보다
  # **낙관적**이다. 202508 에서 0.6 을 목표로 두면 T 15.2·span 56.1~90.9 가 뽑히는데
  # 모델값 0.63 대비 **OBB 실측은 0.30** 이었다(편차 0.33). 0.9 로 두면 T 12.0·
  # span 59.4~87.6 이 뽑히고 모델 0.95 / **OBB 0.86** 으로 오프라인 최적(0.86)과
  # 같아진다. 즉 이 값은 "원하는 실제 이격 + 모델 낙관 편차" 로 잡는다.
  gap_fit_clear_m: 0.9
  # 전이 하향 탐색 간격 [m]. 하한은 기존 transition_m(12.0) 을 그대로 쓴다 —
  # 202508 에서 trans ≤ 13 이면 이격이 0.97 로 포화해 12 아래로 갈 이득이 없다.
  gap_fit_trans_step_m: 2.0
  # gap_fit 이 고른 전이를 실제로 만들려면 v ≤ trans / shift_k_s 여야 한다.
  # 그 속도를 min() 후보로 내고, 도달할 때까지 span 생성을 보류한다.
  # 커밋 2(gap_fit_enable)와 **별개 스위치**다. false = 속도 연동 없음.
  gap_fit_speed_enable: true
  shift_entry_max_delay_m: 15.0
  shift_entry_step_m: 0.5
  shift_exit_min_after_m: 0.0
  # ── span 연장 (2026-09-03 배치 연쇄장애물_01) ───────────────────────────
  # 시프트 생성 시 detect_max_m 밖이던 연쇄 뒷부분이 전진하며 보이면 활성 span 의
  # 끝만 뒤로 민다. 자차 인덱스에서 shift_route_smoothly 를 같은 방향으로 다시 불러
  # 발밑은 그대로(f=0), 앞쪽만 목표 차로로 다시 오른다. 발동 조건 네 개: span 활성 ·
  # standoff 차단물이 span 끝 너머 · 막힌 채 정지 stuck_s 이상 · 연장 후 예상 최소
  # 이격 ≥ percep.obstacle_clearance_m(새 span 전 구간 모든 객체). 실측 01: 연장 후
  # id6 1.45 / id7 0.95, 발밑 변화 0.000000 m. 02(엇갈린 배치)는 이격 미달로 연장 안 함.
  # false = 이전 동작(기본 off, 실차 검증 전).
  span_extend_enable: true
  span_extend_stuck_s: 4.0
  span_extend_max_n: 3
  # ── span 탐색 국소화 (2026-09-04, route.py plan_shift_span) ─────────────
  # PDM 원문은 차단물 최근접 경로점을 route_index 이후 전 구간에서 찾는다. 순환
  # 코스에서 경로가 같은 자리를 두 번 지나면 한 바퀴 뒤 점이 잡혀 자차 앞이 아닌
  # 4.5 km 뒤 구간이 밀렸다 (실측 100310/100458 14건, 4550.1~4595.2 m). 탐색을
  # 자차 앞 leading_vehicles_maximum_detection_radius(80 m, 신규 상수 없음)로
  # 제한해 처음부터 올바른 점만 나오게 한다. kr 가 넘기는 객체는 전부 detect_max_m
  # (80 m) 안이라 정상 시프트(실측 5.0~34.7 m)는 그대로다. span_gate 는 판정 층의
  # 안전망으로 남는다(계층이 다르며 대체 아님). false = PDM 원문 동작.
  span_search_local_enable: true
  # ── 시프트 목표 차로의 기준점 (2026-09-04 실주행 104648/104807) ─────────
  # PDM 원문은 목표를 항상 route_waypoints[idx](경로 **생성 시점** 차로)의 이웃으로
  # 잡는다. 이미 한 번 시프트해 옆 차로에 있으면 같은 쪽을 다시 골라도 목표가
  # 지금 있는 그 차로라 경로가 1 mm 도 안 움직인다. 실측 104648: 자차 (429,3,3),
  # 원 경로 (429,3,2), 빈 차로는 (429,3,4) — 열별 최소 이격은 열2 −1.73 / 열3
  # −1.78 / **열4 +0.68** / 열5 −1.91 이고, 열 4 는 회랑 침범 객체가 0 이다.
  # true 면 기준을 '현재 경로가 놓인 차로' 로 옮긴다 — 한 칸 제한은 그대로다
  # (현재 차로에서 한 칸). 시프트가 없으면 밀림 0 → 1 단계 → 원문과 같은 좌표라
  # 스위치를 켜도 비트 동일이다. 적용(shift_route_smoothly)과 계측
  # (planned_lateral_offsets)이 같은 헬퍼를 쓴다 — 어긋나면 shift_entry·
  # span_extend 의 사전 이격 계측이 실제로 갈 차로가 아닌 곳을 잰다.
  # false = PDM 원문 동작. 기본 off (실차 검증 전).
  shift_target_current_lane_enable: true
  # 원 경로 차로에서 최대 몇 열까지 나갈 수 있나 [열]. 위 기준점 이동의 상한이며
  # 한 번의 시프트가 넘는 차선 수가 아니다. 2 = 104648 의 열2→열4 가 상한.
  # 3 이상이면 편도 3~4 차로에서 반대쪽 갓길·중앙선에 닿고 복귀 횡거리가 열마다
  # 3.2 m 씩 늘어난다. 1 = 원문과 같은 범위(원 경로의 이웃까지).
  shift_target_max_steps: 2
  # ── side 선택 (2026-09-04 실주행 104648/104807) ────────────────────────
  # _side_pass 는 ('left','right') 순으로 보고 먼저 통과한 쪽을 그대로 쓴다.
  # BREAKOUT 은 occupied 게이트를 끄므로(lvl≥1 + 정지 stuck_hard_s, 진입 조건이
  # 곧 그 조건이라 항상 참) 막힌 좌측도 전부 통과해 채택되고 우측은 평가조차
  # 안 된다. 실측 104648 t=42.16: 좌측 base_clear −1.73 / 플래토 [5,6,8] 인데
  # 채택, 우측 +0.68 / 플래토 [] 는 미평가 → 경로가 원래 차로로 되돌아가 고착.
  # true 면 양측을 재고 고른다. 1차 키는 entry_plateau_ids 다 — 배치 점수는
  # '어느 배치로도 못 지나는 객체' 를 목적함수에서 빼므로(_shift_placement 플래토
  # 제외) 막힌 쪽이 오히려 높게 나온다(좌 1.31 > 우 0.68). 둘 다 플래토가 비면
  # **좌측을 유지**한다 — 이격만 비교하면 지금 성공 중인 시프트가 뒤집힌다
  # (추월집중_01 t=10.60 좌 +1.02 실측 OBB 1.02 대 우 +1.20). 24개 로그 시프트
  # 생성 31틱 중 3틱만 바뀌고 전부 개선이다.
  # **shift_entry_enable 이 켜져 있어야 한다** — 1차 키가 _shift_placement
  # 산출물이라, 꺼져 있으면 기준이 없어 현행(좌측 우선)으로 폴백한다.
  # 임계는 percep.obstacle_clearance_m 을 그대로 쓴다(신규 상수 없음).
  # false = 이전 동작(좌측 고정 순서). 기본 off (실차 검증 전).
  side_pick_enable: true

# 시나리오 생성 시작점 분산 (tools/gen_scenarios.py).
# 역할 구분: configs/themes.yaml gen: 은 "완성 경로의 폐기 게이트 임계"(시나리오
# 정의와 함께 검토), 여기는 "후보 선별·추첨 알고리즘 상수"(lane_graph 자산과
# 함께 움직임) — 게이트 완화 금지 원칙과 무관한 층이다 (2026-08-28).
gen_coverage:
  # 시작 차로 최소 길이 [m] (구 58 하드코딩 완화). 가속 확보는 아래 accel 로 분리.
  start_min_lane_m: 35.0
  # 시작 오프셋(8 m) 이후 확보해야 하는 전진 거리 [m] — 짧은 차로는 비교차로
  # successor 를 누적해 채운다 (구 58 m 조건의 실효 가속 50 m 과 동일 기준).
  start_accel_m: 50.0
  # 공간 분산 추첨 격자 셀 크기 [m] — 셀을 먼저 뽑고(사용 셀 감쇠) 셀 안에서 후보 추첨
  grid_cell_m: 200.0
  # 사용된 셀의 역방향(미사용) 셀 가중 배수 — 셀 키가 (격자, 방향 4분면)이므로
  # 억압 해제만으로는 역방향이 우연 수준으로만 뽑힌다 (2026-08-28 실측: 60건 중
  # 양방향 사용 도로 5개, 무가중 기대치 이하). 방문 회랑의 미사용 방향을 능동
  # 우선해 도로×방향 커버리지를 올린다. 1.0 = 부스트 없음.
  reverse_dir_boost: 3.0
  # 시작 후보 재추첨 횟수 상한 (구 300 하드코딩)
  redraw_max: 300
  # walk 경로 최소 길이 [m] — turns 소진 후 목표까지 'any' 교차로 통과를 자동
  # 연장한다. routes 정의의 min_length_m 이 우선(0 = 연장 없음). 기본값은
  # 연속교차로 수준(교차로 6회 ≈ 830 m) 참고 (2026-08-28 실측: turns 수가
  # 경로당 road 수를 선형 지배 — 교차로 1회당 +2~2.5 roads).
  walk_min_length_m: 800.0
  # 길이 연장으로 추가할 교차로 통과 상한 (무한 확장 방지).
  # 주행 검증형 3 km 목표에 필요 — 실측(2026-08-28): 8로는 평균 1.2 km 에
  # 그치고, 20이면 평균 ~2 km·최장 3.2 km (맵 회랑 한계로 3 km 는 보장이
  # 아니라 최대 연장이다). 이벤트 검증형(400)은 연장이 발생하지 않아 무관.
  walk_ext_turns_max: 20
  # 연장 구간 전용 전진 상한 [m] — 필수 turns 의 700 m 가드(교차로 못 찾고
  # 헤매는 것 방지)와 분리해, 교차로 없는 긴 직선 회랑도 길이에 기여시킨다.
  walk_ext_forward_max_m: 2000.0
  # 목표 길이 탐색(백트랙 DFS) 전환 임계 [m] — 주제 목표 길이가 이 값 이상일
  # 때만 그리디 연장 대신 탐색을 쓴다. 그리디는 막다른 회랑에서 되돌아 나올
  # 수 없어 거기서 종료된다 (2026-08-29 실측: start_pool 전수 3 km 도달률
  # 그리디 34.5% vs 백트랙 탐색 93.4%). 이벤트 검증형(400)·혼합형(800)은
  # 그리디로 이미 충족돼 탐색 비용을 쓸 이유가 없다.
  search_min_length_m: 1500.0
  # 탐색 예산 = 회랑 전개 횟수 상한 (백트랙 상한). 실측 확장 평균 18회 —
  # 격자 맵이라 직진 우선 순서면 백트랙이 거의 일어나지 않는다.
  search_expand_max: 4000
  # 탐색 깊이 상한 (연장 구간의 교차로 통과 횟수)
  search_max_depth: 60
  # 'any' 출구 가중의 전방 잔여 회랑 정규화 상한 [m] (0 = 길이 가중 미사용).
  # 미방문 가중 1/(1+n) 과 곱 결합 — 막다른 회랑 출구를 피해 3 km 도달률을
  # 올린다. 값은 2026-08-28 실측 튜닝 (커버리지 손실 없는 지점).
  walk_exit_clear_cap_m: 600.0

# 장거리 다중이벤트 배치 (실전주행 — themes.yaml scale_events: true 주제)
gen_events:
  # 이벤트 밀도: 경로 길이 이 값당 1건 (3 km → 6건). 근거는 이벤트 필요 공간
  # 실측(static_vehicle 30 / ped_blind·narrow 40 / obstacle_chain 개수×18+20 m)
  # + 대응 사이클(감속 12~25 + 정지·재출발 30~50 m) ≈ 이벤트당 최대 ~165 m.
  # 3 km 경로의 가용 구간은 usable_spans 실측 42~58% (평균 52% ≈ 1.6 km,
  # 2026-08-30 실전주행 8건) — 6건이면 가용축 슬롯 간격 ~215~320 m 로
  # 이벤트당 최대 공간(165 m)을 여유 있게 웃돈다. 8건(375 m/건)부터는 짧은
  # 가용 경로에서 간격이 min_gap 근처로 몰린다.
  # 500 → 600 (2026-08-30): 보행자 트리거 역산으로 이벤트 점유 구간이
  # 넓어져(트리거점까지 claim) 500 이면 배치 실패가 잦다. 실전주행 3 km
  # 기준 6~7건 → 5~6건으로 줄지만, 성립 안 하는 6건보다 성립하는 5건이 낫다.
  per_route_m: 600.0
  # 이벤트 시작점 간 최소 간격 [m]: 트리거 선행(25~40) + 이벤트 몸통(최대 74)
  # + 정지·재출발 사이클(~50) 에 여유를 더한 값. 가용 구간이 부족하면 개수를
  # 이 간격이 유지되는 수준까지 줄인다.
  min_gap_m: 150.0
  # 배치 실패 허용: 개별 이벤트가 어느 위치로도 안 놓이면 그 이벤트만 버리고
  # 계속한다. 최종 배치 수 < ceil(목표×이 비율) 이면 시나리오 폐기 → 백필.
  min_keep_ratio: 0.6

gen_placement:
  # 이벤트를 **놓아도 되는 자리**의 조건. usable_spans(교차로·시종점 여유)만으로는
  # 걸러지지 않는, 이벤트 종류별 성립 조건이 여기 온다.
  #
  # pulk 교통류가 켜진 시나리오에 narrow 를 함께 배치하면 GenError 로 폐기한다.
  # 근거(2026-09-02): narrow(침범폭 0.7)는 ego 기준으로는 통과 가능하지만
  # (잔여폭 2.1~2.14 m > 차폭 1.9 m, 엇갈림 14 m) VTD internal-driver 교통류는
  # 이 협착을 지나지 못하고 그 앞에 정체를 만들며, ego 가 정체에 갇혀
  # blocked 로 끝난다.
  #   · 실전주행_교통류_01_좌회전24 (logs/batch/20260902_230229): narrow 20.7 m
  #     앞에서 pulk 차량(id 9, 이력상 최대 15.6 m/s 주행)이 정지, ego 는 그 뒤
  #     9.6 m 에 갇힘. 앞뒤 모두 정지 pulk 차량.
  #   · 정적회피집중_02_우회전 (logs/batch/20260902_231132): ego 가 narrow 직전
  #     5.1 m 에서 정지(blocked), 뒤로 pulk 3대 정체.
  # false 로 두면 종전 동작(동시 배치 허용)이 그대로 재현된다.
  narrow_pulk_guard_enable: true

  # ── 통과 가능성 보장 (2026-09-07) ─────────────────────────────────────
  # 자차가 **합법적으로** 지나갈 경로가 최소 하나 없는 자리에는 장애물을 놓지
  # 않는다. 합법 = 실선·중앙선을 넘지 않고, 이웃 차로가 실재하며 폭이 되고,
  # 연쇄 장애물이면 그 구간 **내내** 같은 쪽이 살아 있는 것.
  #
  # 왜 필요한가: 기존 게이트(require_multi_lane · require_self_lane_width)는
  # **차로 개수와 폭만** 본다 — 차선이 실선인지, 회피 측이 구간 끝까지 유지
  # 되는지는 아무도 안 봤다. 실측 2026-09-07(21개 세트 · 장애물 119개):
  # 한 지점만 보면 불가 0건이지만, 묶인 체인 구간 전체로 보면 1건
  # (실전주행_교통류_18_연속교차로14)이 "구간 내내 유지되는 회피 측 없음"
  # 이었다 — 좌측은 실선으로 끊기고 우측은 이웃이 없다.
  #
  # 이웃 차로 폭 임계는 위 static_vehicle.min_neighbor_width_m 를 그대로
  # 읽는다 (같은 물리량 — 값을 두 곳에 적지 않는다).
  # false 로 두면 차선 종류·구간 유지 검사가 없는 이전 동작이 재현된다.
  require_passable: true
  # 연쇄 장애물 간격 [m]. 이 값보다 좁게 놓인 장애물들은 회피가 하나로 묶여
  # (복귀 전이 shift_ahead_m + extra_after_m + 차 길이 ≈ 19.9 m) 단일 오프셋
  # 으로는 못 빠져나간다 — 좌우 교대 배치라 더 그렇다. 그래서 require_passable
  # 은 체인을 **묶어서** 검사한다.
  # 2026-09-07 이전에는 gen_scenarios.ev_obstacle_chain 에 18.0 이 하드코딩돼
  # 있었다 (상수 이중화 규칙 위반). 값은 그대로 옮겨 왔다 — 산출물 불변.
  chain_gap_m: 18.0
  # ── 차로 내 잔여폭 검사 (기본 off) ────────────────────────────────────
  # 가장자리 장애물(obstacle_chain) · 양측 침범(narrow)에서, 차선변경 없이
  # **차로 안으로** 지나갈 수 있는 폭을 요구한다: 잔여폭 ≥ 차폭 + pass_margin_m.
  #
  # 기본 off 인 이유: 실측 2026-09-07 에서 가장자리 장애물 101개의 잔여폭이
  # min 1.84 / 중앙 2.18 m 로, 필요폭 2.39 m 기준 **86%가 미달**이다. 켜면
  # 체인 배치가 대량으로 버려진다. 다만 그 86%도 합법 차선변경 회피로는
  # 전부 있으므로(한쪽 68 · 양쪽 33) "통과 불가"는 아니다 — **난이도 축**이지
  # 성립 여부가 아니라서 require_passable 과 스위치를 나눴다.
  # 켜기 전에 테마별로 몇 개가 사라지는지 표로 확인할 것.
  pass_margin_enable: false
  pass_margin_m: 0.5

  # ── 종료선 콘 (2026-09-07, 주최측 공지 2건) ──────────────────────────
  # 종료 지점은 정지선 위 라바콘으로 표시되고 뒷축이 두 콘 사이 종료선을
  # 지나면 완주다. 다만 공지는 "콘은 대략적 위치 표시이고 실제 판정은 운영측
  # 제공 종료 지점 좌표 기준" 이라고 못박았다 — 그래서 **판정은 종전 그대로**
  # finish_s(route.pkl 의 finish_xy 투영)이고, 콘은 시각 확인용으로만 세운다.
  # 채점기(tools/score.py)도 콘 사이 통과 여부를 표시만 하고 완주 판정에는
  # 쓰지 않는다. 좌표 계산은 tools/finish_cone.py 한 곳이 낸다.
  #
  # false 로 두면 콘 없는 이전 XML 이 그대로 재현된다.
  finish_cone_enable: true
  # VTD ObjectList 카탈로그(Distros/Current/Config/Players/Objects)의 정의명.
  # 주황 라바콘. 장애물 체인(blk_object 기본값 Fuelcan01)과는 별개 축이다 —
  # 체인은 회피 대상이고 이 콘은 회피 대상이 아니어야 한다.
  cone_model: RdMiscPylon03-32cm
  # 종료 좌표에서 콘까지 = 그 지점 **차로 반폭 + 이 여유** [m] (t 방향 ±).
  # 콘을 차로 경계 밖에 세우기 위한 값이다. 회피 회랑 침범 임계
  # (kr_rules._corridor_blockers: 자차반폭 + 콘반폭 + percep.obstacle_clearance_m
  #  = 0.943 + 0.16 + 0.3 = 1.403 m)보다 콘의 |lat| 이 커야 장애물로 안 잡힌다.
  # 이 맵 차로 폭은 2.6~5.6 m (중앙값 3.0) 이라 반폭 1.3~2.8 m 이므로 0.3 이면
  # |lat| 1.6 m 이상 — 가장 좁은 차로에서도 여유가 남는다. 실측 표는
  # docs/BACKLOG.md 의 콘 항목 참조.
  # 콘을 **도로 양 끝**에 세운다 (주최측 공지: "도로 양 끝에 세운 콘").
  # 기준점이 종료 좌표가 아니라 배치 차로 중심선이고, 좌우 각각 그 방향 마지막
  # 차로의 바깥 경계 + cone_margin_m 다 (좌우 거리가 달라 비대칭일 수 있다).
  # 실측 실경로_01_PathShape03: 폭 2.4 m 연결로에서 종료 좌표가 중심선에서
  # 0.406 m 치우쳐 있어, 종료 좌표 기준 대칭 배치는 오른쪽 콘을 회랑 안
  # (여유 −0.309 m)에 놓았고 자차가 그걸 장애물로 잡아 종료선 17 m 앞에서
  # 영구 정지했다(미완주). 도로 끝 기준이면 ±1.5 로 서서 여유 +0.097 이 된다.
  # false = 이전 동작(종료 좌표 기준 대칭).
  cone_at_road_edge: true
  # 도로 바깥 경계에서 콘까지 [m]. 0.3 → 1.0 → 2.0 (2026-09-09).
  # 왜 넓히나: **대회 콘은 주최측이 도로 양 끝에 세운다** — 우리 배치는
  # 검증용 시나리오를 만들 때만 쓰는 값이라 좁게 둘 이유가 없다. 0.3 일 때
  # 21건 중 12건이 회랑 여유 0.6 m 미만이었고(최소 +0.10, 중앙 +0.51), 그
  # 얇은 여유가 제어기 회귀를 콘 문제로 오염시켰다. 넓히면 "종료선을 못 지난
  # 것이 콘 때문인가 아닌가" 가 로그에서 바로 갈린다.
  # 2.0 으로 다시 올린 이유: 1.0 에서도 여유가 얇은 배치가 남았고, **콘이 좁아
  # 완주 판정이 안 뜨는 쪽이 훨씬 나쁘다** — 콘 통과는 눈으로 보는 확인용이지
  # 채점 15항목에 없다. 넓혀서 잃는 것이 없다.
  # 주최측 콘이 회랑에 들어오는 경우 자체는 speed.finish_gate_ignore_enable
  # (제어기)이 맡는다 — 이 값과 별개다.
  cone_margin_m: 2.0
  # 콘 bbox 반폭 [m] — 회랑 여유 계산과 "콘 안쪽 면" 폭에 쓴다.
  # **VTD 로드 전 가정값이다** (모델명 RdMiscPylon03-32cm 의 32 cm 를
  # 밑면 한 변으로 보고 0.16). VTD 에서 실제 bbox 를 확인하면 그 값으로
  # 정정한다 — 여유가 0.16 m 만큼 바뀔 뿐 배치 좌표는 안 바뀐다.
  cone_half_width_m: 0.16
  # 게이트 안쪽 폭이 **차폭(vehicle.width) 밑으로 내려가지 않게** 받친다.
  # 이 맵에는 소멸 직전 폭 0.11 m·0.0 m 테이퍼 차로가 실재하고(위 static_vehicle
  # 주석), 종료 좌표가 그런 차로에 붙으면 콘 간격이 차폭보다 좁아진다 —
  # 실측 2026-09-07 실전주행_교통류_16_직진20: 배치 차로 (2076,2,-4) 폭 0.75 m
  # → 콘 간격 0.27 m 로 차(1.886 m)가 물리적으로 못 지나간다. 콘은 "통과를
  # 눈으로 확인" 하는 물건이라 지나갈 수 없는 게이트는 무의미하다.
  # 임계는 vehicle.width 를 그대로 읽는다 (새 상수 없음).
  # false 로 두면 차로 반폭만 쓰는 이전 동작이 그대로 재현된다.
  cone_min_gate_from_vehicle: true
  # 콘 z 보정 [m]. 0 = 차로 노면 높이. 모델 원점이 밑면이 아니면 VTD 로드
  # 후 여기서 띄우거나 내린다 (좌표는 안 바뀐다).
  cone_z_offset_m: 0.0
  static_vehicle:
    # 자차로 정중앙 정차 차량은 동일 방향 주행차로가 1개뿐인 구간에서 **회피가
    # 원천 불가**다: 차폭 1.9 m / 이 맵 차로 폭 2.6~3.2 m 라 좌우 여유가
    # 0.35~0.65 m 이고, kr_rules 는 어느 BREAKOUT 단계에서도 황색 중앙선을
    # 넘지 않으며(kr_rules._is_center_mark) 이웃 차로가 없으면 no_neighbor 로
    # 기각한다. 그래서 ego 가 영구히 막히고 런이 blocked 로 끝난다 —
    # 연습이 되지 않고 시나리오만 버려진다.
    #
    # 실측(2026-09-02, seed 0 전수 생성): static_vehicle 배치 113건 중 24건(21%)
    # 이 1차로 구간이었다 (정적회피집중 5/23 · 추월집중 7/30 · 실전주행_교통류
    # 6/27 · 다중이벤트 4/8 · 실전주행 2/20). blocked 로 끝난 기존 런 중
    # 실전주행_02_직진28(202 m, lane (2818,6,-1), 앞 6.5 m 횡 0.1 m 정차차)이
    # 이 원인이었고 제어기 결함으로 잘못 분류돼 있었다.
    #
    # true 면 동일 방향 주행차로가 2개 이상인 구간에만 놓는다. 자리가 없으면
    # 그 이벤트를 버리고 gen_events.min_keep_ratio 게이트 → 백필로 넘어간다.
    # false 로 두면 조건 이전 동작(1차선 배치 허용)이 바이트 단위로 재현된다 —
    # 대회 코스에 1차선 정적차가 나올지 조직위에 확인하지 못했으므로 그 케이스를
    # 만드는 수단을 남긴다 (2026-09-02).
    require_multi_lane: true
    # 이웃 차로로 셀 최소 폭 [m]. 이 맵에는 폭 0 인 테이퍼 차로가 실재해서
    # ((173,3,-1) w=0.0) 개수만 세면 "이웃이 있다" 가 거짓이 된다. 차폭 1.9 m
    # 에 좌우 여유를 더한 값 — 이보다 좁은 이웃은 비켜 설 자리가 아니다.
    min_neighbor_width_m: 2.5
    # 같은 폭 임계를 **자기 차로**에도 건다 (2026-09-04). 폭 검사가 이웃에만
    # 걸려 있어 소멸 직전 테이퍼 차로가 '자차로' 로 뽑혔다 — 추월집중_05_우회전5
    # 의 장애물이 (2756,2,-6) 폭 0.11 m 지점에 놓였고 (그 차로는 12.57 m 동안
    # 1.70 → 0.00 m 로 사라진다), 이웃 (2756,2,-5) 이 2.9 m 라 개수 2 로 게이트를
    # 통과했다. 자차로를 막는 시나리오가 성립하지 않을 뿐 아니라 그 런은 두 번 다
    # blocked 로 끝났다 (logs/batch/20260904_173419, 20260904_181929).
    # 이웃과 같은 값을 쓰는 이유: 서 있을 자리든 비켜 갈 자리든 필요한 물리량이
    # 차폭 1.9 m + 여유로 같다 (값을 두 곳에 적지 않는다).
    # false 로 두면 이전 동작(자기 차로 폭 무검사)이 그대로 재현된다.
    require_self_lane_width: true
    # 2차로 이상 부분구간의 최소 길이 [m] — 이보다 짧은 조각은 후보에서 뺀다.
    # 기준은 overtake.min_corridor_m(25) 이다: kr_rules 는 목표 차로의 점선
    # 회랑이 그만큼 확보돼야 차선변경을 하므로, 그보다 짧은 조각은 옆 차로가
    # 있어도 시프트가 성립하지 않는다. 25 에 여유를 더해 30.
    # 실측 대가 (2026-09-02, 정적회피집중 30경로 · 가용구간 7,079 m):
    #   min_span   0 → 후보 5,385 m (76%) · 후보 0 인 경로 1/30
    #             20 → 5,343 m (75%) · 2/30
    #             30 → 5,034 m (71%) · 3/30      ← 채택
    #             60 → 4,249 m (60%) · 10/30     (급격히 나빠진다)
    min_span_m: 30.0
  obstacle_chain:
    # 1차로 구간의 체인은 슬라럼이 아니라 차단이다 — 실측(2026-09-02,
    # logs/batch/20260902_231132 정적회피집중_01_좌회전0): 1차로 (2818,6,-1)
    # 에서 체인(Fuelcan 엇갈림)이 자차로를 직접 막아 **충돌 1 + blocked** 로
    # 끝났다. static_vehicle 게이트 때는 "가장자리 엇갈림이라 원천 불가 아님"
    # 으로 제외했으나 실측이 반증했다.
    # true 면 static_vehicle 과 같은 _multi_lane_spans 경로로, 체인 전체가
    # 동일 방향 주행차로 2개 이상인 부분구간 안에 들어가는 자리에만 놓는다.
    # 폭(min_neighbor_width_m)·최소구간(min_span_m) 임계는 위 static_vehicle
    # 값을 그대로 읽는다 (같은 물리량 — 값을 두 곳에 적지 않는다).
    # false 면 종전 동작(1차선 배치 허용)이 바이트 단위로 재현된다.
    require_multi_lane: true

gen_traffic:
  # 교통류 **관측 지표** 전용 (tools/event_check.py traffic_metrics).
  # 배치 상수는 여기 없다 — 교통류 생성은 VTD 네이티브 PulkTraffic 이고
  # 그 상수는 아래 pulk.* 다. (2026-08-30 ev_traffic 제거)
  #
  # 로그에는 객체 heading 이 없고 s_rel/on_route 는 PDM 이관 후 항상 None 이다
  # (run_agent._log_objects). 그래서 ego 프레임 종·횡거리를 여기서 직접 계산하고,
  # "동방향 주행 차량" 을 아래 두 임계로 정의한다 — 정차 차량(narrow/static_vehicle,
  # 속도 0)과 회랑 밖 차량을 빼기 위한 값이다.
  observe_moving_mps: 0.5   # 이 속도 이상 움직인 적이 있어야 '주행 중'
  observe_corridor_m: 6.0   # ego 프레임 |횡| 이 이 안일 때만 같은 진행 회랑으로 본다

pulk:
  # VTD 네이티브 교통류 <PulkTraffic><PulkDef/></PulkTraffic> — ego 주변
  # 영역(타원)에 Count 대를 채우고, 영역을 벗어난 차량을 가장자리에 **재배치**한다.
  #
  # 왜 ev_traffic(Path01 고정 배치)을 버렸는가 (2026-08-30 실기 확인):
  #   (1) 6대 × 45 m = 265 m 대역뿐이라 3 km 경로 전 구간을 못 채운다.
  #   (2) ego 와 속도가 다르면 3 km 동안 수백 m 벌어져 후반부가 텅 빈다.
  # PulkTraffic 은 재배치로 두 문제가 모두 사라진다. 이벤트가 아니라 시나리오
  # 전역 속성이라 ctx.claim 도, event 목록 등록도 없다.
  #
  # 스펙 출처: Scenario Editor 2025.2 산출물 (실기 검증 완료).
  # 비율은 전부 0~1 소수이고, 에디터가 두 합계를 검사한다 —
  #   AreaF+AreaB+AreaL+AreaR = 1.0,  Cars+Vans+Buses+Trucks+Bikes = 1.0.
  # gen_scenarios.pulk_def 가 생성 시점에 같은 검사를 하고 어긋나면 GenError 다.
  # **자동 보정하지 않는다** — 조용히 고치면 시나리오마다 다른 값이 들어간다.
  count: 20                 # 영역 내 유지 대수. 축 '교통류대수' 가 있으면 그 값이 이긴다
  semi_major_m: 300.0       # 영역 장반경 [m]. semi_minor 와 같으면 Circle (별도 속성 없음)
  semi_minor_m: 300.0       # 영역 단반경 [m]
  inner_radius_m: 30.0      # ego 주변 이 반경 안에는 스폰하지 않는다 (스폰 즉시 충돌 방지)
  center_offset_m: 50.0     # 영역 중심을 ego 전방으로 민 거리 [m]
  # 영역 4분할 배분 [0~1] — 합 1.0. 전방을 두껍게 둬야 선행차 상황이 자주 잡히고,
  # 좌우를 남겨야 "옆 차로가 비었는지" 판단할 대상이 생긴다.
  area_f: 0.40
  area_b: 0.30
  area_l: 0.15
  area_r: 0.15
  own_side: 0.70            # 같은 진행방향 비율 [0~1]. 나머지가 대향류
  # 차종 구성 [0~1] — 합 1.0
  cars: 0.80
  vans: 0.0
  buses: 0.10
  trucks: 0.10
  bikes: 0.0
  # 축 '교통류밀도' 프리셋 — 같은 Count 를 넓은 영역에 뿌릴수록 성기다.
  # 비율(area_*/차종)은 건드리지 않는다: 두 합계 제약이 축과 무관하게 유지된다.
  density:
    조밀: {semi_major_m: 150.0, semi_minor_m: 150.0, inner_radius_m: 15.0}
    보통: {semi_major_m: 300.0, semi_minor_m: 300.0, inner_radius_m: 30.0}
    성김: {semi_major_m: 450.0, semi_minor_m: 450.0, inner_radius_m: 45.0}
batch:
  # ── 시나리오 타임아웃 (tools/gen_scenarios.timeout_for) ────────────────
  # 예전에는 평균 27 km/h · 배수 1.8 · 오버헤드 90 s 가 코드에 박혀 있었다.
  # 9/6 실주행 실측 평균은 **10.2 km/h** 다 (신호 대기 포함). 그 상수로는
  # 3 km 경로가 810 s 로 잘려 완주 전에 죽는다.
  # 기본값 12 km/h · 1.5 · 120 s → 3 km 에 약 1,470 s.
  # 채점 제한(scoring.time_limit_s 780)과는 별개다 — 저쪽은 규정, 이쪽은 도구다.
  timeout_avg_kph: 12.0
  timeout_factor: 1.5
  timeout_overhead_s: 120.0
  timeout_min_s: 300.0
  # 배치 완주 판정을 채점(tools/score.py detect_finish)과 같은 규칙으로 할지.
  # true = route.pkl 의 finish_xy 를 경로에 투영한 finish_s 를 임계로 쓴다.
  #
  # 아래 end_slack_m 기반 임계(total − end_margin_m)는 route_end.target_mode 가
  # 'route_total' 이던 시절 유도식이다. 지금 기본은 'finish' 라 계획 정지점이
  # finish_s + 2.0 = total − 꼬리 + 2.0 이고, 꼬리 연장(route.finish_tail_m 12 m)
  # 때문에 임계가 계획보다 항상 위에 있다 — 2026-09-04 실측 11개 CSV 전부
  # 계획대로 서면 미완주다 (venue −33.1 m, official_route −78.2 m, 꼬리 15 m 짜리
  # 시나리오들 −4.2 m). 지금까지 완주가 찍힌 건 실주행 오버슈트 덕이고
  # (20260903_173432: 계획 499.9 → 실제 507.0, 여유 3.0 m) 꼬리가 긴 경로에서는
  # 성립하지 않는다.
  # false = 이전 동작(total − end_margin_m).
  finish_judge_use_finish_s: true
  # 완주 임계 = total − (stop_gap + wheelbase + front_overhang + 이 값).
  # **위 스위치가 false 이거나 route.pkl 에 finish_xy 가 없을 때의 폴백 전용**이다.
  # route_s 는 뒷축 기준이고 (route_total 모드의) 계획 정지점이
  # total − stop_gap − 앞범퍼 이므로 임계가 stop_gap 튜닝을 자동으로 따라간다.
  end_slack_m: 1.0

  # ── 종료 판정 시간 4종 (이름이 비슷하니 무엇을 재는지 명시한다) ──────────
  # 각각 "언제부터"가 다르다. 겹칠 때는 먼저 임계에 닿는 것이 이긴다.
  #
  # stop_grace_s   : **완주 지점에 도달한 뒤**, 차가 멈추기(v<0.5)를 기다리는 시간.
  #                  실패가 아니다 — 이 시간이 지나면 굴러가는 중이어도 완주 처리.
  stop_grace_s: 10.0
  # stall_end_s    : **계획은 진행인데(v_target ≥ stall_intent_mps) 차가 안 나가는**
  #                  상태가 지속된 시간. 전방에 정지 사유가 없다는 뜻 = 제어기 문제.
  stall_end_s: 30.0
  # blocked_end_s  : **앞이 막혀(선행차·장애물) 계획도 정지인** 상태가 지속된 시간.
  #                  적신호 대기·보행자 횡단은 제외한다 (정상 정차라 곧 풀린다).
  #                  앞차가 영원히 안 움직이면 우리도 못 가므로 종료 대상이다
  #                  (2026-08-30: 정지 차량 두 대 사이에 끼어 배치가 진행 못 함).
  blocked_end_s: 30.0
  # no_progress_end_s: **route_s 가 progress_eps_m 도 안 늘어난** 시간. 위 예외를
  #                  전부 뚫는 최종 안전망 — 신호가 고장 나 영원히 적색이어도 끝난다.
  #                  적60 대기(60 s)보다 길어야 정상 대기를 안 죽인다.
  no_progress_end_s: 120.0

  # 위 판정이 쓰는 임계값 (하드코딩이던 것을 이관 — 2026-08-30)
  stall_speed_mps: 0.1      # 이 속도 미만이면 '정지'로 본다
  stall_intent_mps: 0.5     # v_target 이 이 값 이상이면 '계획은 진행'으로 본다
  progress_eps_m: 0.5       # route_s 가 이만큼 늘면 '전진'으로 인정 (no_progress 리셋)

  # ── 적신호 큐 대기 면제 (2026-09-06) ────────────────────────────────────
  # blocked 면제를 "누가 세웠나"(reasons.red_light < stall_intent_mps)가 아니라
  # "왜 못 가나"로도 본다: 정지 신호 앞 큐(avoid.suppress=='queue' / queue.green_s
  # ==0 / standoff 대상이 정지 차량)면 면제. 실측 2026-09-06 실전주행_교통류_01:
  # 적신호 선행차 뒤 24.4 m 정상 대기(red_light 후보 1.14 m/s)를 blocked 로 잘랐다.
  # false = 이전 판정 그대로.
  stall_excuse_queue: true
  # 적색 대기 면제 상한 [s] — 위 스위치 on 에서만. 연속 정지가 이보다 길면 면제를
  # 거두고 blocked 타이머를 돌린다 (신호 고장·영원한 큐는 진짜 잠금이다).
  # no_progress_end_s(120) 보다 낮게 둬야 이 상한이 실제로 판정에 들어간다 — 같으면
  # no_progress 가 먼저 끝내고 blocked_reason 이 안 남는다 (2026-09-06 120 → 90).
  # 적색 한 주기(실측 최대 60 s) + 큐 한 번 빠지는 시간을 덮는 값이다.
  red_wait_max_s: 90.0
  # 큐 머리 판정 거리 [m] — standoff 대상(정지 차량)이 정지선에서 이 안이면 큐.
  # 01 실측 3.9 m. 이 조건이 없으면 주차 장애물 뒤 정지(추월집중_05: 정지선 112 m
  # 앞, 정적회피집중_02_직진3: 88 m)까지 큐로 봐서 제어기의 추월 실패를 숨긴다.
  # kr_rules 가 스스로 큐로 판정한 경우(avoid.suppress=='queue')는 이 거리를 안 본다.
  queue_head_gap_m: 10.0

report:
  # tools/batch_run.py 의 logs/batch/<ts>/report.txt 표 — 밤샘 배치를 아침에
  # 한 화면에서 훑기 위한 요약이다. 상세는 <시나리오>.score.txt / report.json 에
  # 그대로 남으므로 여기서는 잘라도 정보가 사라지지 않는다.
  table_width: 100          # 표 전체 표시폭 상한 [칸, 한글 2칸] — 주요위반 칸이 남는 폭을 먹는다
  name_w: 24                # 시나리오명 표시폭 상한 — 넘으면 … 말줄임
  top_violations: 3         # 주요위반 칸에 나열할 항목 수 — 나머지는 " 외N"
  # 축약 항목명 표시폭 상한 [칸] — 넘으면 … 말줄임. 한글 1자가 2칸이므로 12 = 6자.
  # 대부분(차선이탈 8·적신호통과 10)은 그대로 들어가고 최장 '차선변경지시등미점등'
  # (20칸)만 '차선변경지…' 로 줄어든다.
  violation_label_w: 12
  # 주요위반에서 뺄 검출 키 (tools/score.py LABEL 키) — 상태 칸과 중복이라
  # 정작 봐야 할 위반을 상위 3개 밖으로 밀어낸다.
  exclude_violations: [not_finished, stall, off_route]
  # 우측 정렬할 열 이름 — 헤더와 값에 **똑같이** 적용된다 (요약 표 + 정지 지표 표
  # 공통, 목록에 없는 열은 좌측). 숫자 열을 좌측에 두면 자릿수가 안 맞아 헤더와
  # 어긋나 보인다. 값이 아니라 열 이름으로 고른다 — '2:05'(시간)·'0/4'(이벤트)는
  # 값만 보면 숫자인지 애매해서 표마다 정렬이 흔들린다.
  # 좌측 유지: 시나리오·상태·이벤트·주요위반·ctrl·신호 (문자 또는 목록)
  align_right: ['거리[m]', '시간', '평균[km/h]', '감점',
                't[s]', 'route_s', 'slf[m]', '접근[km/h]', '전환', '유지[s]',
                '녹색후출발[s]']

event_trigger:
  # tools/gen_scenarios.py 보행자 이벤트(pedestrian/jaywalk/ped_blind)의 트리거
  # 거리 역산. 고정 25 m 를 쓰던 시절에는 도로 폭에 따라 필요값이 27~87 m 로
  # 변해 원리적으로 성립하지 않았다 — 2026-08-30 실측(실전주행_01_좌회전16):
  # 보행자가 ego 가 지나간 48 m 뒤(4 s 후)에야 차로에 진입, 제어기는 무반응 통과.
  #
  # 역산: 보행자가 ego 차로 근접 가장자리에 닿는 시각(t_near)에서 lead_s 만큼
  # 더 들어간 순간 ego 가 도착하도록 트리거 지점을 잡는다.
  #   t_near = (횡시작거리 − 차로반폭) / 보행속도
  #   trig_d = 예상속도 × (t_near + lead_s) − radius_m
  radius_m: 3.0             # PosAbsolute 반경 [m]. ego 가 구에 **진입**할 때 터지므로
                            # 그만큼 일찍 발동한다 (실측: 반경 10 → −8.7 m 계통 편향).
                            # 20 Hz · 14 m/s 면 틱당 0.7 m 라 3 m 면 놓치지 않는다.
  lead_s: 0.4               # 근접 가장자리를 지나 차로 안으로 들어간 정도 [s].
                            # 조우 창(차로폭/보행속도)이 1~2 s 뿐이라 크게 잡으면
                            # 보행자가 이미 건너가 버린다.
  speed_factor: 0.9         # 예상 주행속도 = 제한속도 × 이 값 (실측 12.4/13.89 = 0.89)
  default_limit_kph: 50.0   # speed_limit 이 None 인 차로의 대체 제한속도
  ped_start_margin_m: 1.5   # 보행자 시작점을 차도 가장자리 밖으로 밀어내는 여유 [m].
                            # _crossing_shape 와 역산이 같은 값을 봐야 한다 (단일 출처).
  trig_min_m: 20.0          # 트리거 거리 하한 — 더 짧으면 ego 가 반응할 수 없다
  trig_max_m: 90.0          # 상한 — 넘으면 claim 구간이 min_gap_m 과 충돌한다
  trig_min_route_s_m: 5.0   # 트리거 지점의 route_s 하한. 이보다 앞이면 경로 밖이라
                            # 스폰 즉시 발동해 버린다(옛 max(1.0, …) 클램프의 조용한 실패).
  # 상·하한을 벗어나면 보행속도를 이 범위 안에서 자동 조정해 성립시키고,
  # 그래도 안 되면 그 이벤트만 폐기한다 (gen_events.min_keep_ratio 가 받아준다).
  walk_speed_min_mps: 1.0
  walk_speed_max_mps: 3.0
  # 이벤트 종류별 기본 보행속도 [m/s]. 무단횡단은 뛰어서 건너므로 빠르다.
  walk_speed_default:
    pedestrian: 1.5         # 정상 횡단보도 보행
    jaywalk: 2.5
    ped_blind: 2.5
  # 이벤트 점유 구간 = [s − trig_d − claim_back_m, s + claim_fwd_m].
  # 트리거 지점까지 점유해야 다른 이벤트의 차량이 그 앞을 막지 않는다.
  claim_back_m: 15.0
  claim_fwd_m: 20.0
  # 조우 성립 판정 (tools/event_check.py): ego 가 이벤트 지점을 지나는 순간
  # 보행자 횡위치가 |lat| ≤ 차로반폭 + 이 값이면 성립.
  meet_tol_m: 1.0

scoring:
  # 2026 HL FMA 안내문 채점 (2026-08-27 공개, tools/score.py score_run):
  # 구간별 독립 100점, (항목,구간)당 1회 감점 — 경미 -3 / 중대 -6,
  # 경미+중대 공존 시 중대 하나. 리스폰은 구간당 free 회 무감점, 초과 -6/회.
  # 미완주면 뒷축이 진입한 구간까지만 만점·감점 집계. 구간 점수 음수 허용.
  # 단일 구간 모드: 대회 당일 경로 CSV 확정 전에는 구간 경계가 무의미하므로
  # 전체 코스를 1구간으로 집계 — (항목)당 1회 감점, 리스폰 전체 1회 무료.
  # CSV 확정 시 false 로 되돌리고 section_bounds_s 를 채운다.
  single_section: true
  section_bounds_s: []          # 구간 경계 route_s [m] 오름차순. 비면 전체 1구간
  minor_penalty: 3
  major_penalty: 6
  respawn_free_per_section: 1
  # 차로유지: 소멸(테이퍼) 차로의 successor 첫 이 거리 [m] 를 판정에서 제외 (P7).
  # 인계 첫 틱들은 자차가 successor 시작점 앞(종거리 −1.3 m)인데 매칭이 s=0.0 으로
  # 클램프돼 t_off 가 −1.34 m 로 튄다 — 자차 실제 횡오프셋은 +0.06 m (2026-09-06
  # 실전주행_교통류_01 rs 1007.2/1067.4/1823.2, 차로유지 4건 중 3건, 각 2~4틱).
  # 0 = 이전 판정(제외 없음). 주최측 기준을 모르므로 기본은 보수적으로 둔다.
  lane_departure_taper_handover_m: 0.0
  # 적신호 원거리 정지(red_stop_far)에 원인 태그(pedestrian / queue / pure)를 붙일지.
  # 판정은 그대로다 — 9/6 실측에서 원거리 정지 2건이 보행자 정지와 적신호 큐 뒤
  # standoff 로 원인이 달라 구분이 필요했다. false = 이전 출력.
  red_stop_far_cause_tag: false
  # 완주 = 뒷바퀴 축이 종료 지점 좌표 통과 (경로 투영 route_s 로 환산 판정).
  # 주행 정지 위치 값. kr_rules._resolve_stop_s 가 읽는다. null 이면 CSV 마지막
  # 행 자동 (build_route 가 route.pkl 에 넣은 finish_xy;
  # route_end.finish_xy_from_route_enable 로 끈다). 둘 다 없으면 기존
  # route_s 임계(end_margin) 방식 유지 + 경고.
  finish_xy: null               # [x, y]
  # 제어 정지 목표의 여유: 뒷축이 종료선을 이만큼 넘어 정지하도록 계획한다
  # (kr_rules.plan_stop_s). 채점 기준이 아니다 — 채점은 finish_s 통과 여부만 본다.
  finish_clearance_m: 2.0
  # 항목 1 (일반 도로 속도 준수) severity [km/h]:
  #   초과 ≤ allow 감점 없음 / allow~major 경미 / > major 중대
  speed_allow_kph: 1.0
  speed_major_kph: 20.0
  # 항목 2 (보호구역 = 붉은 노면 속도 준수) severity [km/h]. 규칙이 더 엄하다:
  #   초과 ≤ 1 허용 / 1 초과 경미 / 5 초과 중대
  # 판정 구간은 lane_graph 의 red_spans 이고, 채점기가 후륜축 (x,y) 를 직접
  # 차로에 투영해 독립적으로 본다 (제어기 로그의 school_zone 을 믿지 않는다).
  speed_school_allow_kph: 1.0
  speed_school_major_kph: 5.0
  # 대회 7번 적색신호 정지 품질 (detect_red_stop): 앞범퍼가 정지선 앞 stop_ok_m
  # 이내 정지 = 정상 / 그보다 멀면 경미 / 선 넘으면 침범(경미) / 통과는 중대.
  # 정지 판정은 v<score.stop_speed_mps 가 stop_hold_s 이상 지속.
  stop_ok_m: 2.0
  stop_hold_s: 0.5
  # 대회 13번 방향지시등: 차선변경 시작(차로 경계 통과) 전 이 시간 이상
  # 해당 방향 turn_signal 이 연속 점등돼 있어야 한다. 미달 = 경미.
  signal_lead_s: 3.0
  # 대회 4번 중앙선 침범: 깊이(t_off + 차폭/2 − 차로폭/2)가 depth 이상,
  # hold 이상 지속 = 중대. left_is_center 차로만, junction 차로 제외.
  center_depth_m: 0.6
  center_hold_s: 0.6
  # 대회 8번 녹색신호 통과: 정지선 앞 dist 이내 + 녹색 + 정차가 minor 이상
  # 지속 = 경미, major 이상 = 중대. 면책: 보행자 존재 / 전방 lead(전방 lead_m·
  # 횡 lead_lat_m 이내 차량) / reasons.winner 에 정당한 정차 원인 기록.
  green_dist_m: 30.0
  green_minor_s: 5.0
  green_major_s: 10.0
  green_lead_m: 15.0
  green_lead_lat_m: 2.0
  # 대회 5번 보도 침범: 깊이(|t_off| + 차폭/2 − sidewalk_dist_at)가 depth 이상,
  # hold 이상 지속 = 중대. 그 쪽 보도 없음(None)은 판정 대상 아님.
  sidewalk_depth_m: 0.5
  sidewalk_hold_s: 0.3
  # 대회 10번 보행자 대응 (detect_pedestrian_response, 2026-08-28 실측 근거 승인):
  # 대응 = (경로 중심선까지 ≤ near) OR (차로 쪽 횡속도 ≥ cross_v), 전방 engage 이내.
  # 횡단 완료 = |lat| > 차로폭/2 + clear. 완료 전 무정차 통과 / 정지 후
  # 완료 전 재출발(v ≥ restart_v) = 중대. 실측: 횡단 횡속도 1.0~2.0 m/s,
  # 차로 반폭 1.5 m, 횡단 시 경로 접근 0.1~0.23 m vs 보도 대기 ≥ 2.26 m.
  ped_near_m: 2.0
  ped_cross_v: 0.3
  ped_engage_m: 40.0
  ped_restart_v: 1.0
  ped_clear_m: 0.5

score:
  # 위반 검출기(tools/score.py) 임계. 배점·감점 없음 — 검출 기준값만 둔다.
  # 충돌·근접: 자차·객체를 회전 사각형으로 보고 **외곽 간 최소 간격** 기준.
  collision_dist_m: 0.1    # 간격 ≤ 이 값 → 충돌로 집계
  near_dist_m: 1.5         # 간격 ≤ 이 값 → 근접 경고 (충돌 미만)
  stop_speed_mps: 0.5      # "정지 상태" 판정 속도 (정지선 침범 검출)
  # 정지 지표 '전환' 을 저크 부호 변화(이전)가 아니라 **가속도 부호 전환**(양↔음,
  # 데드밴드 안은 무시)으로 셀지. 이전 지표는 미세 떨림까지 다 세서(2026-09-06
  # rs 693.2 접근 119회) 정지 프로파일의 품질과 무관하게 커진다. 옛 값은 jerk_flips,
  # 새 값은 accel_flips 로 항상 함께 남고, 이 스위치는 cmd_reversals 가 무엇을
  # 가리키느냐만 정한다. false = 이전(저크).
  cmd_reversals_accel_sign: false
  cmd_reversals_deadband_mps2: 0.1
  time_limit_s: 780.0      # 대회 완주 제한시간 (13분)
  # 초과 구간 병합: 이 시간 이하로 임계 아래로 내려갔다 다시 넘으면 같은 1건
  # (제어기가 임계 바로 밑에서 진동하면 1틱짜리 건이 수백 개로 쪼개진다)
  merge_gap_s: 1.0

log:
  enabled: true
  dir: logs
  path: ""
  flush_every: 20

  # ── 프리즈 진단 계측 (2026-08-30) ────────────────────────────────────────
  # 실사고: 틱 로그에 14.95 s 공백이 생겼는데(완주속도_01_좌회전0 t+373.2),
  # 그 사이 로그 줄이 하나도 없어 "우리 루프가 멈춘 것"인지 "VTD 가 안 보낸 것"
  # 인지 사후에 가릴 수 없었다. 아래 계측은 그 구분을 위한 것이다 — 원인 대응이
  # 아니라 관측 수단이다.
  #
  # 판별법: 공백 구간의 timing.loop_iters 증가량을 본다.
  #   ~300 증가 → 루프는 살아 있었다 (수신이 끊긴 것 = VTD/네트워크 쪽)
  #   ~1  증가 → 프로세스가 멈춰 있었다 (GC·스왑·OS/WSL2 정지 쪽)
  probe_enabled: true
  # getrusage 호출 주기 [틱]. 실측 0.94 µs/회로 틱 예산 50 ms 의 0.002% 라
  # 매 틱(1)이 기본이다. 부하가 문제되면 올린다 (그 틱만 nivcsw/majflt 가 빠진다).
  probe_rusage_every: 1
  # 단일 GC 일시정지가 이 시간을 넘으면 이벤트 줄로 남긴다 [s]
  probe_gc_min_s: 0.05
  # 무수신이 이 시간을 넘으면 공백 구간을 이벤트 줄로 남긴다 [s].
  # 지금은 패킷이 온 틱만 로그에 남아 무수신 구간이 통째로 비어 있다.
  gap_log_s: 1.0
  # 무수신이 이어지는 동안 이 간격으로 진행 상황을 남긴다 [s] (0 = 남기지 않음)
  gap_log_every_s: 5.0

debug:
  print_hz: 1.0

default_speed_kph: 50.0

# PDM GlobalConfig 오버라이드 — run_agent.build_pdm_config 가 주입한다.
# config.py(원문)는 손대지 않는다. 값이 원문과 같으면 동작 불변.
pdm:
  # 선행차 IDM 목표 시간간격 [s] (원문 0.25). 배치 비교용 (B-6, 2026-09-02):
  # 0.25 / 0.5 / 1.0 을 정적회피집중·실전주행_교통류 에서 비교해 케이스 3
  # (선행차 정지 시 범퍼 간격 0.45 m)의 정지 거리·추종 중 최소 간격·완주 시간을
  # 본 뒤 확정한다. 확정 전까지 0.25 = 동작 불변.
  idm_leading_vehicle_time_headway: 0.25
  # forecast_walkers 보행자 상자 최소 반폭 [m] (원문 1.5 → 0.5, A-2 2026-09-03).
  # 1.5 는 인도(차로 중심 ≈3.2 m)에 선 보행자를 차로에 겹치게 봐 무한 정지를 만든다
  # (실전주행_교통류_02_직진11 |lat| 3.17, 121 s). 자차 반폭 0.943 + 0.5 = 1.443 m 가
  # 정지 보행자의 새 겹침 임계. 걸어나오는 보행자는 speed.ped_intent_v 래치가 잡는다.
  # 1.5 = 원문 = 이전 동작 (team_code/config.py 기본값과 같은 축).
  pedestrian_minimum_extent: 0.5

# ── 정적 장애물 회피: 차로 지도 방식 (2026-09-09, 커밋 A) ────────────────────
# 지금 로직의 문제는 "늦게 보고, 한 칸만 보고, 무조건 복귀" 다:
#   · 장애물이 회랑(~22 m)에 들어와야 발견 → standoff 뒤에야 시프트 = 늦다
#   · 후보가 왼쪽 한 칸 → 오른쪽 한 칸뿐이라 두 칸을 못 간다 (1·2차로가 나란히
#     막히고 3차로가 빈 대회장 배치에서 들이받는다)
#   · 걸쳐 선 차를 중심만 보고 한 차로만 막힌 것으로 판정한다
#   · 장애물을 지나면 원래 차로로 무조건 복귀한다
#
# 차로 지도는 자차 앞 lane_map_ahead_m 를 **차로별로** 미리 재 둔 표다.
# 커밋 A 는 **읽기 전용**이다 — 계산해서 reasons.lane_map 으로 로그에만 내보내고
# 아무도 안 읽는다. 후보 선택에 쓰는 것은 커밋 B, 복귀 없음은 커밋 C 다.
avoid_map:
  # 마스터 스위치. false = 지도를 만들지도 않는다 (로그까지 이전과 동일).
  lane_map_avoid_enable: false
  # 자차 차로 기준 좌우 몇 칸까지 볼지. 3 이상도 동작한다 — 커밋 B 의 램프
  # 길이·시작점이 칸 수에 비례해 자동으로 늘어난다.
  lane_map_max_hops: 2
  # 앞을 보는 거리 [m]. 회랑(~22 m)보다 훨씬 앞이라 "늦게 발견" 을 없앤다.
  lane_map_ahead_m: 80.0
  # 통행 가능으로 볼 최소 차로폭 [m]. 소멸 차로를 뺀다 — 폭은 평균이 아니라
  # **그 지점 보간값**으로 잰다 (테이퍼는 끝에서 0 이 된다).
  lane_map_min_width_m: 2.0
  # 창(80 m)이 섹션 경계를 넘을 때 승계(`next`)를 따라 hop 을 이어 센다.
  # xodr 은 폭이 변할 때마다 섹션을 쪼개므로 11~13 m 짜리 섹션이 흔하고, 그러면
  # 창 안의 객체가 **다른 섹션**으로 투영돼 hop 밖으로 빠진다 — 지도가 통째로
  # 비어 free_run 이 전 차로 80.0, blocked_by {} 가 된다.
  # 실측 2026-09-09 run_20260909_232350 t 55.6: 55.7~57.7 m 앞 정지 차량 3대가
  # (2756,0,3/4/5) 로 잡혀 자차 (2756,3,5) 의 hop 밖 → lane_plan null →
  # 방향을 옛 로직이 정보 없이 골라 **막힌 왼쪽**으로 갔다.
  # false = 이전 동작 (자차 섹션 안만 센다).
  lane_map_span_sections_enable: true
  # ── 커밋 B: 후보 선택·시점·감속 ──────────────────────────────────────
  # 트리거 — **내 차로**의 free_run 이 이 거리 밑으로 내려오면 결정을 시작한다 [m].
  # 다른 차로가 막힌 것은 트리거가 아니다 (케이스 10).
  # 50 근거: 램프 길이(아래 식)가 20 km/h·두 칸에서 24.7 m 라, 램프 + 여유
  # (shift_ahead_m 5) + 판단 시간이 들어가려면 그 두 배는 있어야 한다.
  # 2026-09-10: 50 → 80 으로 감지창(lane_map_ahead_m)과 맞춘다. 50 이면 창
  # 안에 장애물이 보이는데도 트리거가 안 걸리는 구간이 생긴다 — 실측
  # run_20260909_232350 t 55.6 은 free_run 57.7 이라 옛 로직이 방향을 정했다.
  lane_map_decide_m: 80.0
  # 트리거 즉시 거는 **속도 상한** [km/h]. 상한형이므로 P + a_cap_dec_max 축이다
  # (err/dt 금지 — CLAUDE.md 확정 사실). 램프를 짧게 만들어 늦은 발견을 흡수한다.
  lane_map_avoid_speed_kph: 20.0
  # 램프(횡전이) 길이는 상수가 아니라 **기하에서 나온다**:
  #     y(x) = Y·(1 − cos(πx/L))/2   →   a_lat = Y·π²·v² / (2L²)
  #     L = v·π·√(Y / (2·a_lat_max)),  Y = 칸 수 × 차로폭
  # a_lat_max 는 overtake.a_lat_max 를 그대로 읽는다 (_shift_speed_cap 과 같은 축).
  # 여기에 새 상수를 두지 않는다.
  # ── 커밋 C: 복귀 없음 ────────────────────────────────────────────────
  # 시프트 span 의 **복귀 전이**를 마지막 장애물 직후(extra_after_m 10 m)가 아니라
  # **데드라인**(다음 회전의 유효 차로로 돌아와 있어야 하는 지점)에 둔다.
  # 왜: 원래 차로에 돌아갈 이유가 없으면 그 복귀는 불필요한 차로변경 두 번이고,
  # 그 사이 또 막히면 처음부터다 (지시등도 두 번 켠다 — 항목 13).
  # 데드라인 재료는 route.pkl 의 valid_entry_lanes 하나이고, never_stall (c)
  # (_ns_turn_lane_pending) 와 **같은 식**을 쓴다 (상수 복제 금지).
  # 데드라인이 없는 세그먼트(target='finish' = 제약 없음)에서는 미루지 않는다 —
  # 경로 끝까지 밀면 span 이 영영 안 풀리는 버그를 다시 만든다
  # (2026-09-09 [1] 의 실경로_02: span 끝 rs 776, 종료선 749.2).
  # false = 이전 동작.
  lane_map_no_return_enable: false
  # 활성 시프트 중에도 차로 지도가 **다른 목표 차로**를 고르면 갈아탈지 (재타겟).
  # 차로 지도는 매 틱 목표를 다시 고르므로 "활성 중엔 생성 금지"(B-9 (5))가
  # 필요 없다 — 필요한 것은 램프를 새로 만드는 것이 아니라 **이어 붙이는** 것이다.
  # 실측 20260909_093415/실전주행_교통류_07 (차로 지도 on replay):
  #   rs 2711.6  blocker 4 를 free_run 79.1 에서 잡음
  #   rs 2714.1  시프트 생성 span [27457, 28409]
  #   rs 2714.6  회피 성공 (blocker None)
  #   rs 2757.6  **새 blocker 6** 등장 — span 활성이라 생성 건너뜀
  #   rs 2805~2822  정지. ot_span 이 **끝까지 None 이 안 된다**
  # 즉 geom 게이트가 기각한 것이 아니라 **게이트까지 가지도 못했다**.
  # 조건은 좁다: 지도가 고른 목표가 지금 향하는 차로와 다르고, 회랑에
  # `ot_ids` 에 없는 새 정지 객체가 있을 때만. 게이트 7개는 그대로 다시 탄다.
  # span 은 합집합으로 이어 붙인다 (원복은 original_route_points 에서 통째로).
  # false = 이전 동작.
  lane_map_retarget_enable: false
  # ── [3] 차로 지도가 시프트를 소유한다 ────────────────────────────────
  # 켜지면 "어디로·언제" 는 lane_plan 만 정하고, 옛 _try_overtake 는 안전
  # 검사(게이트 10개)와 안전망(REACTIVE·BREAKOUT·never_stall)만 한다.
  #  · side 후보가 계획한 쪽 **하나**가 된다 (게이트에서 떨어지면 그 틱은 포기 —
  #    지도가 매 틱 다시 고르므로 다음 틱에 다른 목표가 나온다).
  #  · 실선 2바퀴 완화(solid_second_pass)는 **그대로 돈다** — 건너뛰게 해 봤더니
  #    avoid_sim 7·8 이 0.0 → 23.2 s, 11 이 5.5 → 21.2 s 로 나빠졌다(2026-09-10).
  #  · 시프트 시점은 lane_plan.armed (램프 시작점 통과) 가 정한다.
  # false = 이전 동작 (지도는 side **순서**만 바꾸는 힌트).
  lane_map_owns_shift_enable: false
  # 활성 목표를 갈아탈 최소 이득 [m] — 새 목표의 free_run 이 지금 목표보다
  # 이만큼 길어야 재타겟한다. 0 이면 이전 동작(이득 무관).
  lane_switch_margin_m: 20.0
  # (4) owns_shift 에서 계획한 쪽이 게이트에 떨어지면 **차선책으로 폴백**한다.
  # 폴백이 없으면 그 틱은 끝이라(continue → 루프 종료) 좌우 2바퀴를 돌던 옛
  # 로직보다 오히려 좁아진다. 순서는 ① 계획한 쪽 ② lane_plan 후보 free_run
  # 2위의 쪽 ③ 반대쪽. 게이트 10개는 후보마다 그대로 탄다.
  # false = 이전 동작 (계획한 쪽 하나만).
  lane_map_fallback_side_enable: false
  # 시프트 중 트리거가 **복귀할 차로**도 같이 보게 한다.
  # 밀린 경로 위에 있으면 자차가 물리적으로 선 차로는 (비켜 왔으니) 비어 보여
  # `free_run[자차] = 80.0 ≥ decide_m` 로 트리거가 영영 안 걸린다.
  # 실측 07 rs 2802~2841 의 **248틱 전부 pick=None** 이 그 꼴이다:
  #   물리 차로 (2076,3,4) free_run 80.0 / 복귀 차로 (2076,3,3) free_run 7.5
  #   (콘 5·6·7·9 가 전부 (2076,3,3) 에 있다 — s 138.7·156.7·174.7·210.7)
  # 회랑은 복귀 전이 뒤의 콘 9 를 78.3 m 앞으로 보고 있었다. 둘 다 맞고 재는
  # 대상이 달랐을 뿐이라 **둘 중 나쁜 쪽**을 트리거로 쓴다.
  # false = 이전 동작 (물리적으로 선 차로만).
  lane_map_shift_ref_enable: false
  # (4) 복귀 차로는 **트리거**에만 쓰고, 램프 길이·v_cap 은 자차가 실제로 달리는
  # 차로 기준으로 잰다. 실측 2026-09-10 run_20260910_121651 t 65.7 (2칸 좌 시프트
  # 완료 직후): 물리 차로 (2756,1,3) free_run 80.0 인데 복귀 차로 (2756,1,5) 가
  # 8.7 이라 first=8.7 → late → avail 3.7 → **v_cap 1.12 m/s**. 이미 비켜 나온
  # 차로의 잔여 거리로 램프를 재서, 아무것도 사지 못하는 감속으로 v 4.33 → 1.93
  # 까지 끌려 내려갔다 (램프 한복판 서행 = 채점 항목 3 차선 위 체류).
  # false = 이전 동작 (복귀 차로가 램프까지 정한다).
  lane_map_ramp_by_phys_lane_enable: false
  # (2) 후보 순위에서 **넘어도 되는 선인지**를 free_run 다음으로 본다.
  # `passable` 은 표시를 아예 안 본다 (존재 ∧ 같은 방향 ∧ 폭 ∧ 교차로 아님) —
  # 그래서 실선으로 갈린 차로가 후보에 들어오고, side 게이트가 `right:solid` 로
  # 기각한 뒤에야 반대쪽으로 폴백한다. 실측 run_20260910_121651 t 53.0:
  #   (2756,3,6) free 80.0 1칸 ← pick. 게이트에서 solid 기각
  #   (2756,3,3) free 80.0 2칸 ← 점선. 결국 여기로 갔다 (2.9 s 뒤)
  # 실선 후보를 **빼지는 않는다** — 게이트 2바퀴(solid 완화)가 유일한 길인
  # 경우를 잃지 않기 위해 순위만 올린다. 잣대는 게이트와 같은 `_dashed_ahead_m`
  # + `overtake.dash_slack_m` 이다 (기준을 두 벌 만들지 않는다).
  # false = 이전 동작 (free → hop 수 → 유효차로 → 우측).
  lane_map_prefer_dashed_enable: false
  # 큐로 판정된 객체를 free_run 에서 **빼지 말고 표시만** 한다.
  # 큐 제외의 목적은 "신호 대기 줄을 **추월 후보로 삼지 않기**" 지 "장애물이
  # 없는 셈 치기" 가 아니다. 그런데 제외는 `_tick_corridor`(= **내 차로** 회랑)
  # id 를 쓰므로 구조적으로 **트리거를 만드는 바로 그 객체**만 정확히 지운다.
  # 실측 2026-09-10 run_20260910_110743 rs 500.1: 회랑은 blocker 2 를 6.1 m 로
  # 보는데 지도의 내 차로는 80.0, blocked_by 에 id 2 없음(queue_dropped 1)
  # → pick=None → 두 번째 시프트 없음 → 60 s 정지.
  # 전수: 그 두 로그에서 "회랑 blocker 있는데 지도 내 차로 80.0" 이 741틱(24.4 %),
  # **그 100 % 가 queue_dropped>0 이고 100 % 가 pick=None** 이다.
  # 표시로 바꾸면 트리거는 살고, 후보 선정에서만 그 차로를 뺀다.
  # false = 이전 동작 (뺀다).
  lane_map_queue_mark_enable: false
  # (c) 지도가 목표를 고르면 **즉시** 시프트를 만든다 (옛 시간 예산 우회).
  # 시간 예산 `t_left < wait_s − obj_s` 는 관찰 시간을 **거리로** 사 먹는다.
  # 실측 2026-09-10 run_20260910_115526: pick 이 t 45.6 rs 428.2 (s_rel 79.7,
  # v 11.9 m/s)에 나왔는데 SHIFT_ACTIVE 는 t 49.7 rs 467.3 (s_rel 38.5) —
  # **39 m / 4.1 s 지연**이고 그 사이 STANDOFF→WAIT→WAIT_EXPIRED 로 속도가
  # 11.9 → 6.85 로 떨어졌다. 대가로 두 번째 blocker 에서 avail_m 0.8 <
  # need_m 18.2 (`ramp_too_late`) 가 됐다.
  # `armed` 는 대안이 못 된다 — lane_plan 이 램프를 v_cap(20 km/h)로 재는데
  # 자차는 43 km/h 라 start_s_rel 57.4, armed 는 s_rel ≈ 22 에서야 참이 되어
  # **옛 규칙(38.5)보다 더 늦다**.
  # 관찰의 알맹이(`_static_ok` = obj_static_s 이상 정지)는 그대로 둔다 —
  # 없애는 것은 시간 예산뿐이다. false = 이전 동작.
  lane_map_shift_on_pick_enable: false
  # (e) 적색 홀드(SHIFT_HOLD) 중에도 **목표 갱신**을 평가할지.
  # `if red_hold: return False` 가 `_lm_retarget` 보다 34줄 먼저라, 홀드가 걸린
  # 동안 재타겟이 한 번도 평가되지 않았다 — 같은 로그 t 56.2~68 이 내내
  # SHIFT_HOLD 였고 그 사이 pick 은 (2756,2,3)·(2756,1,3)(둘 다 free_run 80.0)로
  # 옳은 목표를 가리키고 있었다. 원복이 아니라 목표만 바꾸는 것이라
  # "급조향 금지" 와 충돌하지 않는다. false = 이전 동작.
  lane_map_retarget_in_hold_enable: false
