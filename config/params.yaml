# VTD·어댑터 상수의 단일 출처 (vtd_adapter/config.py 가 읽는다)
# 단위: m, m/s, m/s^2, rad. km/h 는 *_kph 키와 로그 출력에서만.
#
# 여기에는 **VTD 연결·차량 제원·추정기·배치 판정** 상수만 둔다.
# 판단(IDM·forecast·lateral PID) 상수는 team_code/config.py (PDM-Lite) 가 단일 출처다.
# 옛 자체 planner/shield 상수(caps/signal/lead/ttc/lane_change/cross/shield)는
# PDM-Lite 이식으로 폐기 — 필요해지면 kr_rules.py 도입 시 여기로 되살린다.

comm:
  host: 192.168.10.1
  port: 9910
  send_hz: 20
  watchdog_s: 1.0
  # 실측 확정 (2026-08-19, VTD 2025.2): +1.0.
  # -1.0 이면 직선 구간에서 발산하며 courseRespawn 리셋이 발생한다.
  # corr(steering, yaw_rate) = -0.93 으로 확인 (logs/run_20260819_185936.jsonl).
  steer_sign: 1.0
  connect_retry_s: 1.0
  recv_bufsize: 65536

camera:
  # IG 표시 전용 팔로워 뷰 — batch_run 이 매 시나리오 Init 완료 후·Start 전에
  # SCP <Camera> 1회로 적용한다. GUI 프리셋 "Relative - follower view" 동일 값.
  # 9910 GT·제어·채점에는 영향 없음. 전송 실패는 경고만 하고 배치는 계속된다.
  # 각도(dh/dp/dr)는 rad (VTD 2025.2 Doc/SCP_HTML: ViewRelative 단위 확인).
  enabled: true
  player: Ego
  dx: -6.5      # 자차 로컬 [m] — 뒤 6.5 m
  dy: 0.0
  dz: 2.6       # 위 2.6 m
  dh: 0.0
  dp: 0.0
  dr: 0.0
  show_owner: true   # <Camera showOwner> — 자차 표시

vehicle:
  # Ioniq 6 제원: 전장 4855 / 축거 2950 / 앞 오버행 855 / 뒤 오버행 1050 mm
  wheelbase: 2.944
  max_steer: 0.48
  length: 4.848
  width: 1.886
  height: 1.507
  front_overhang_m: 0.855
  # 경로 계획의 연결로 통행 금지 임계 (build_route 소비): R_min < 축거/tan(최대조향) × 이 값.
  # 실증 — R 4.52 m 연결로는 통과, R 2.55 m 는 이탈. 0.7 → 임계 3.96 m.
  min_turn_margin: 0.7

speed:
  # 제한속도에서 항상 빼고 달릴 여유. 감점이 시간보다 비싸다.
  # (phase3: VtdRoutePlanner 가 speed_limits 에 반영)
  margin_kph: 5.0
  # 종방향 명령 한계 (phase3 VtdLongitudinalController 가 사용)
  a_max: 2.0
  a_min: -6.0
  a_emergency: -8.0
  jerk_max: 2.0
  # 정지 유지 브레이크 (v_target=0 & v<0.2)
  a_hold: -1.0
  # 보행자 의도 감지 (P4, 2026-09-01 실전주행_교통류_01 t=430 접촉 −6).
  # PDM forecast_walkers 는 등속 2 s 예측(default_forecast_length)이라 예측
  # 도달거리가 v_ped·2 + pedestrian_minimum_extent(1.5) 다. 서 있던 보행자는
  # min_walker_speed(0.5) 하한만 적용돼 2.5 m 밖에 못 뻗어, 횡 6 m 에서
  # 걸어나오면 v_ped 가 1.7 m/s 가 돼서야 회랑에 닿는다 — 실측 0.5 s 지연으로
  # 필요감속이 3.31 → 4.29 m/s² 가 되어 a_dec_max(4.0)를 넘겨버렸다.
  # 여기서는 예측선 교차를 기다리지 않고 **경로 쪽 횡속도**로 후보를 만든다.
  # 0 이면 비활성 = 보행자를 PDM 예측에만 맡기는 이전 동작.
  ped_intent_v: 0.3
  # 위 후보의 필요 감속이 |control.a_dec_max| 의 이 배수를 넘으면 jerk 램프를
  # 건너뛰고 a_emergency 를 즉시 낸다 (보행자 후보 한정). 0 이면 비활성.
  # 실측: 후보 생성 후 −4.0 도달까지 1.0 s 가 걸려 그 사이 12.1 m 를 갔다.
  ped_emergency_ratio: 0.75
  # 경로 종점(route_end) 계획 정지점 = 기준점 − stop_gap_route_end − 앞범퍼.
  # 완주 임계(end_margin_m)가 이 값을 따른다. (구 stop_gap_m — 정지선 정지와는
  # 무관하다: 정지선은 PDM red-light IDM 소관, 아래 stop_gap_stopline_m 참조)
  stop_gap_route_end_m: 4.0
  # 정지선(적신호) 정지: 앞범퍼가 정지선 앞 이 거리에 서도록 run_agent 가
  # PDM 의 idm_red_light_minimum_distance 를 (이 값 + 앞범퍼 3.8)로 주입한다
  # (PDM 원문 무수정). 대회 7번: 범퍼가 선 앞 2 m 이내 정지 = 정상, 통과 = 중대.
  # 실측 오버런 산포 −2.3~+2.2 m — 넘김(중대) 방지를 우선해 1.5 (백로드 완화는
  # 별도 작업으로 후속).
  stop_gap_stopline_m: 1.5
  # 정지선 정지 유지 시간 [s] — 규정 "0.5 s 이상 정지" + 여유 (kr_rules 홀드,
  # 실측 0.4 s 만에 재출발한 사례가 감점 대상이라 도입)
  stopline_hold_s: 1.0
  # 규정이 요구하는 **최소** 정지 시간 [s]. 녹색 전환 시 이미 이만큼 서 있었으면
  # stopline_hold_s 의 잔여를 즉시 버린다 (B-1). 못 채웠으면 모자란 만큼만 남긴다.
  # 실측(2026-09-01 실전주행_교통류_01) 녹색 후 출발 1.65~2.90 s 중 0.30~1.15 s 가
  # 이 잔여였다 — 매 틱 재무장하던 옛 동작 탓이다.
  stopline_hold_min_s: 0.5
  # 정지 유지 홀드를 걸 정지선 근접 창 [m, 앞범퍼 기준] — 언더슛 정지(실측
  # −4.5 m)도 잡아서 최소 0.5 s 는 채운다 (위치 경미는 남아도 무정차 중대는 방어)
  stopline_hold_near_m: 6.0
  # 적신호 정지선 정지 프로파일의 쾌적 감속 [m/s²] (kr_rules._stopline_profile).
  # v_allow = √(2·a·(정지선거리 − s0)) 를 min() 후보로 덧대 단조 감속을 만든다.
  # PDM 의 적신호 IDM 은 차간모형이라 접근 중 가속을 요구하고(실측 err/dt +10.5),
  # 종방향이 브레이크를 풀어 타행 2.5 m → 정지선 −0.12 m 착지가 나왔다.
  # 0 으로 두면 후보를 만들지 않는다 = 이 기능만 끄는 스위치.
  # 3.0 은 잠정값 — 종단 급제동 체감은 실주행 후 튜닝 (2026-08-30).
  stop_profile_a: 3.0
  # 황색 딜레마 원샷 판정의 판정 감속 [m/s²] (kr_rules._yellow_latch).
  # 황색 인지 순간 1회만 판정한다: v ≤ √(2·a_yellow·(정지선거리 − s0)) → STOP
  # (적색과 동일 취급: 프로파일·홀드 발동), 아니면 GO (신호·정지선 유래 후보
  # 미생성, 현재 속도 유지 통과). 결정은 접근당 래치 — GO 중 적색 전환에도
  # 번복하지 않는다 (교차로 한복판 급제동 방지).
  #
  # **STOP 우선**이 채점표에서 나온 편향이다: 황색 정지를 감점하는 항목이 없고
  # (항목8 5 s 카운트는 녹색 틱만 센다), 적색 통과·걸침은 항목7 중대다. 게다가
  # 채점기는 **통과 순간의 신호**로 판정하므로 GO 로 나갔다 적색에 걸리면 그대로
  # 중대다. 그래서 판정 감속을 확실히 실행 가능한 최대(a_dec_max 와 같은 4.0)로
  # 두어 STOP 영역을 최대화하고, GO 는 물리적으로 설 수 없는 영역만 남긴다.
  # 이건 **판정 전용** 상수다. STOP 이면 실행은 stop_profile_a(3.0)로 한다 —
  # 판정과 실행을 같게 두면 STOP 정의상 진입 시 프로파일이 느슨해 늦게 구속되고,
  # 그때는 최대 감속을 여유 0 으로 요구해 jerk 램프인에 진다 (폐루프 12조건에서
  # 걸침 6건). 실행을 작게 두면 진입 즉시 구속되고 여유가 남는다 (걸침 0건).
  # 0 으로 두면 판정하지 않는다 = 황색을 PDM 원문에만 맡기는 기존 동작.
  a_yellow: 4.0
  # 교차로 통과 가드 상한 [m] — 앞범퍼가 정지선을 넘은 뒤 교차로 진입이
  # 관측되지 않아도 이 거리를 지나면 가드를 푼다 (고착 방지).
  yellow_guard_max_m: 60.0

percep:
  horizon_m: 200.0
  coast_s: 1.5
  # courseRespawn 감지 문턱. 실제 리셋 이동량이 3.3 m 남짓이라 그보다 낮아야 한다.
  jump_m: 2.0
  speed_lpf: 0.3
  # 속도 추정 슬라이딩 창 [s] (Σ변위/Σ벽시계 dt). 9910 송신 간격이
  # 40/80 ms 로 불규칙해 틱 단위 d/dt 는 못 쓴다 (2026-08-23 실측).
  speed_win_s: 0.4
  # respawnPoseToleranceM=1.5 라 실제 리셋 이동량은 3 m 남짓이다.
  reset_route_s_drop_m: 5.0
  stall_dt_s: 0.2          # 이보다 긴 틱 간격은 '스톨'로 분류
  stall_teleport_m: 50.0   # 스톨이라도 이동량이 이보다 크면 텔레포트 = 리셋
  reset_speed_factor: 3.0
  reset_abs_speed: 30.0
  reset_toff_jump_m: 2.0
  # 공식 확인: 객체는 수평거리 80 m 이내만, 가까운 순 최대 30개
  gt_range_m: 80.0
  range_margin_m: 5.0
  # ── 정적 장애물 인식 (경로 전방) ────────────────────────────────────────
  # PDM 의 선행차 판정은 "경로 2.5 m 이내 + 진행방향 35° 이내" 다. 정적 장애물
  # (라바콘·공사 자재·비스듬히 선 차·파손물)은 heading 이 아무 방향이나 될 수
  # 있어 35° 조건에서 빠지고, IDM 감속이 안 걸려 OBB 충돌예측이 코앞에서 급제동
  # 하는 것만 남는다. 그래서 **정지한 객체는 방향을 묻지 않고** 경로를 막는지만 본다.
  obstacle_speed_max: 0.5     # 이 속도 미만이면 정적으로 본다 [m/s]
  # 막는가 판정: 경로 중심까지 횡거리 < 차폭/2 + 객체폭/2 + 이 여유 [m].
  # 크기에 비례하므로 라바콘(0.3 m)은 1.4 m 안, 승용차(1.8 m)는 2.1 m 안에서 잡힌다.
  # 갓길에 비켜 선 물체까지 세우지 않으려면 이 값을 키우지 말 것.
  obstacle_clearance_m: 0.3

control:
  # 종방향 (VtdLongitudinalController). 가속: P (kp — 기존 검증값).
  kp: 0.8
  # 감속: PDM IDM 의 target 은 "1틱 전방 속도"라 P 로 따르면 의도 감속이
  # kp·dt(1/25)로 희석돼 정지선을 지나친다 (폐루프 시뮬 11.4 m 오버런).
  # (target−v)/dt = IDM 의도 감속을 이 상한으로 클램프해 실행한다.
  # -4.0 은 실기 신호 접근 감속 실측(-3.98)과 같은 축. a_min(-6)은 hazard 전용.
  a_dec_max: -4.0
  # 감속 방향 jerk 완화 배수 (제동 진입 지연 방지 — 시뮬: ×3 에서 종점 3.5 m 전 정지)
  jerk_dec_mult: 3.0
  # B-2 좁은 패치 — 정지해 있는데 목표가 살아 있으면 제동 잔량을 램프 없이 턴다.
  # 실측 2026-09-01 실전주행_교통류_01 t=414.1~417.1: 교차 차량에 급제동(−4.0)한
  # 뒤 그 차가 지나가 winner=none / v_target=8.33 이 됐는데도 jerk 램프(+0.1/틱)
  # 때문에 3.00 s 를 더 서 있었다 (녹색 신호 중). 정지 후보가 하나도 없고 목표가
  # release_v 이상인데 v < release_eps 면, 남은 제동 명령을 0 으로 즉시 해제한다.
  # ④′ 접근 중에는 v 가 커서 걸리지 않고, 목표 0(홀드·프로파일 종단)은 상위
  # a_hold 분기가 먼저 반환하므로 정지 위치에 영향이 없다.
  # release_eps: 0 이면 비활성 = 이전 동작.
  release_eps: 0.2
  release_v: 0.5

route:
  # 소멸(테이퍼) 차로 꼬리 블렌드 길이 [m] (VtdRoutePlanner._build).
  # 끝 폭이 vehicle.width 미만으로 줄어드는 차로는 중심선이 이웃 경계로 수렴하다
  # successor 중심선(반폭 ≈1.5 m 옆)으로 순간이동한다 — 2026-08-26 실기에서
  # 이 킹크가 조향 풀포화·차선이탈 진동을 만들었다. 마지막 이 길이 구간을
  # successor 중심선으로 코사인 블렌드해 연속으로 만든다.
  taper_blend_m: 15.0
  # 차선변경 실행 시간 [s] — 도로에 진입하면 이 시간 안에 옮겨탄다.
  # 진출로가 회전이면 회전 차로에 미리 붙어 있어야 하므로, 창 맨 앞(=도로 진입로,
  # 점선이 허용하는 가장 이른 지점)에서 시작해 v × 이 시간 만에 끝낸다.
  # 고정 거리(구 LC_TRANSITION_M 25 m)는 속도에 따라 걸리는 시간이 달라져
  # 빠를 때 너무 급하고 느릴 때 너무 늘어졌다. 지시등 선행(signal.lc_lead_s)과
  # 같은 축의 시간이라 "3초 전 점등 → 3초 안에 이동" 으로 읽힌다.
  lc_move_s: 3.0
  # 위 시간으로 환산한 거리의 하한·상한 [m] (저속·고속 방어)
  lc_move_min_m: 20.0
  lc_move_max_m: 45.0

route_check:
  # tools/build_route.py 의 경로 검증 리포트 임계 — 대회날 배포 CSV 를 받자마자
  # 도는 눈 검사다. 가장 위험한 실패는 에러 없이 조용히 옆 차로로 경로가 잡히는
  # 것이라, 아래 둘은 그 조용한 실패를 소리나게 만드는 게 목적이다.
  #
  # (a) 경유점 이탈 경고 = 매칭된 차로 **반폭** × 이 배수. 예전에는 --radius(8 m)
  # 를 임계로 썼는데, 차로 폭이 3 m대라 반폭(≈1.5 m)을 넘어 옆 차로가 더 가까워진
  # 뒤에도 한참 조용했다 (실측: 좌 1.7 m 흔들면 경로가 +956 m 튀는데 '경고 없음').
  # --radius 는 경유점 매칭 반경이라는 별개 용도로 그대로 둔다.
  wp_dev_halfwidth_k: 1.0
  # (b) 총 길이 이상 = 실제 경로 길이 / 경유점 직선연결 길이. 이 배수를 넘으면 경고.
  # 실측 정상 경로 7종: 1.057 ~ 1.175 (최대는 route_official_route.pkl, 회전 포함).
  # 조용히 옆 차로로 샌 케이스(좌 1.7 m): 1.372. 그 사이를 넉넉히 갈라 1.25.
  # 주의: 경유점이 성기면(2~3점) 정상 경로도 이 비율이 커진다 — 대회 형식
  # (시작 + 교차로 짝*N + 종료)처럼 촘촘할 때 의미 있는 지표다.
  length_ratio_max: 1.25

route_end:
  # 종점 정지 (team_code/kr_rules.py): "종점에 정지한 길이 0 유령 선행차"를
  # PDM IDM 에 넣는다. 정지 위치 관례는 정지선과 동일 — 앞범퍼(뒷축 +
  # wheelbase + front_overhang)가 종점 − speed.stop_gap_route_end_m 에 선다.
  # batch 완주 임계(total − end_margin)보다 end_slack_m 만큼 안쪽이라 완주
  # 판정과 자동 정합한다 (tests/test_route_end.py 가 검증).
  # 정지 목표 기준: 'finish' = scoring.finish_xy 를 투영한 종료선을 뒷축이
  # finish_clearance_m 만큼 넘는 위치 (stop_s = min(finish_s + clearance +
  # stop_gap + 앞범퍼, total − end_slack); finish_xy 미설정이면 자동으로
  # route_total 동작 + 경고 1회). 'route_total' = 기존 경로 종점 기준.
  target_mode: finish
  idm_time_headway: 0.1     # 적신호 정지(idm_red_light_desired_time_headway)와 같은 축
  active_m: 150.0           # 이 거리 안에서만 후보 생성 (오검출 방지)
  latch_v: 0.5              # 정지 래치 진입 속도 — batch 완주 판정(v<0.5)과 같은 값
  latch_m: 12.0             # 종점에서 이 안쪽 + 저속이면 래치 (계획 정지점 d_end≈7.8)
  unlatch_m: 30.0           # d_end 가 다시 이보다 커지면(courseRespawn) 래치 해제

signal:
  # 방향지시등 (9910 turnSignal 0=OFF 1=LEFT 2=RIGHT). 채점 동적항목 "방향지시등
  # n초 전 점등". 점등 구간은 route['events'](turn_* / lane_change_*)에서 시작 시
  # 1회 계산하고, 매 틱 route_s 로 고른다 (team_code/kr_rules.py).
  # 회전 선행 점등 [s] — SPEC §3.3 (연결로 진입 전).
  turn_lead_s: 4.0
  # 차로 이동(차선변경·회피 시프트) 선행 점등 [s] — 규정값 미확정(SPEC §7-2).
  lc_lead_s: 3.0
  # 저속·정지 시 하한 [m]. 시간 기준만 쓰면 v→0 에서 선행거리가 0 이 돼
  # 적신호 대기 중 회전 지시등이 안 켜진다. 거리 하한으로 방어한다.
  # (대기 중 점등 유지는 의도된 동작 — 실제 운전과 같다)
  lead_min_m: 20.0
  # 차로 이동 판정: 앞 창 안에서 경로가 차로 중심 기준으로 이만큼 옆으로
  # 갈 예정이면 켠다. 실측(data/route.pkl): 일반 주행 0.00 m / 차선변경 3.0~3.2 m
  # → 0.5 는 블렌드 시작 후 4.7~6.7 m 에서 걸린다(= lead 시간만큼 앞서 점등).
  # 테이퍼(소멸 차로 기하 보정, 지도 전체 최대 2.36 m)는 입력에서 제외돼 있어
  # 임계를 낮게 둘 수 있다.
  lat_shift_on_m: 0.5
  # 최소 점등 [s] — 속도 추정 흔들림에 임계가 같이 흔들려 생기는 0.1 s 깜빡임
  # (2026-08-28 실측 4회) 방지. **상한이 있는 유지**라 고착되지 않는다:
  # 이 시간이 지나면 평소 규칙이 그대로 지배한다. 끄는 임계·래치는 두지 않는다.
  min_on_s: 1.0
  # 소등 지연 [s] — 회전·차로이동을 마친 뒤 이만큼 더 켜 두고 끈다 (실차 자동소등
  # 관례). min_on_s 와 분리한 값이다: min_on 은 "켜자마자 꺼지는 것" 방지이고
  # 이건 "다 돌기 전에 꺼지는 것" 방지라 목적이 다르다. 둘 다 상한이 있어 고착 없음.
  off_delay_s: 0.5

overtake:
  # 정적 장애물 회피 — 앞이 막혀 서 있기만 하면 미완주가 된다 (2026-08-28
  # 차로폭협착_01: 정차 차량에 막혀 353.7/821 m 에서 49 s 정지 후 시나리오 종료).
  # PDM 은 장애물을 "속도 0 인 선행차" 로 보고 뒤에 설 뿐이라 비켜갈 방법이 없다.
  # 발동은 kr_rules 가 VtdRoutePlanner.shift_route_around_actors 로 1회만 한다.
  enabled: true
  # 이 속도 미만이면 '정적' 으로 본다 [m/s]
  blocker_speed_max: 0.5
  # 이 거리 안의 선행차만 대상 [m]
  blocker_dist_max: 20.0
  # 막힌 채 정지가 이 시간 지속되면 발동 [s] — 신호 대기와 구분하는 것이 아니라
  # (신호는 앞차가 없다) 잠깐 멈춘 앞차에 성급히 반응하지 않기 위한 것
  trigger_s: 3.0
  # 목표 차로 점선 회랑 하한 [m] — 실선 차선변경(S2.2.05) 금지. build_route 의
  # LC_MIN_CORRIDOR_M 과 같은 축이다.
  min_corridor_m: 25.0
  # 목표 차로에 이 반경 안에 차가 있으면 금지 [m] (lc_clear 대용)
  clear_radius_m: 30.0
  # 시프트 기하 [m] — 전이 길이 / 장애물 앞뒤 여유
  transition_m: 12.0
  extra_before_m: 5.0
  extra_after_m: 10.0

  # ── 규칙 1: 신호 구역 억제 (2026-08-30) ─────────────────────────────
  # 대기열은 신호 앞에만 선다 — 이 구역에서는 정지 객체를 봐도 회피하지 않고
  # 선행차 추종·정지 유지를 그대로 둔다. 신호 대기 차량을 비켜가면 신호 위반.
  # 1차 키는 planner.distances_to_next_traffic_lights + 교차로 판정이다.
  # (world.summ.dist_stop_line 은 실측 27% 가 null 이고 실제 장애물 정지
  #  지점에서도 null 이었다. 같은 지점에서 1차 키는 214.8 m 로 정상. 무신호
  #  정지선은 lanegraph 원본을 직접 읽어 보조로 본다.)
  stopline_suppress_m: 30.0
  # 대기열 형태 판정 — 정지 객체가 종방향으로 이만큼 벌어져 2대 이상이고
  # 횡 위치가 비슷하면 대기열로 본다 (정지선 데이터가 없는 도로의 사각 보완).
  # 스태거드(케이스 B)는 종방향으로 붙고 횡으로 갈리므로 여기 안 걸린다.
  queue_gap_min_m: 3.0
  queue_lat_max_m: 1.5

  # ── 규칙 3: 선제 회피 (2026-08-30) ──────────────────────────────────
  # 정지 전에 비켜간다. blocker_dist_max(20, REACTIVE 용)와 **분리된** 상수다.
  # 실측: 9910 GT 상한이 80 m 이고 박스류도 정확히 79.9~80.0 m 에서 크기·속도가
  # 모두 채워져 온다 (percep.gt_range_m).
  detect_max_m: 80.0
  # 오프셋 전이를 늦어도 장애물 이만큼 앞에서 시작 [m]
  shift_latest_m: 10.0
  # 전이 길이 속도 비례 계수 [s]. 코사인 전이의 최대 횡가속
  #   a_lat = v²·Δ·π²/(2L²)  →  L = v·√(Δπ²/(2·a_lat))
  # Δ=3.0 m(차로 한 칸), a_lat=1.5 m/s²(쾌적) 이면 L ≈ 3.14·v → 3.0 채택.
  shift_k_s: 3.0
  # 전이 시작을 자차 앞 이만큼으로 강제 [m] — 뒤에서 시작하면 현재 위치의
  # 경로가 옆으로 밀려 정지 상태에서 조향 풀락 (실측 steer +0.480 고정 17.8 s).
  shift_ahead_m: 5.0
  # 객체가 이 시간 이상 정지로 관찰돼야 '정적' [s] (물체별 타이머)
  obj_static_s: 3.0
  # id 가 잠깐 빠져도 타이머를 유지할 틱 수 (GT '가까운 순 30개' 제한 대비)
  obj_grace_ticks: 10

  # ── 대기열 판별기 3중 교정 (2026-08-30) ─────────────────────────────
  # 형태(종으로 벌어짐 + 횡 비슷)만으로는 1차선을 물고 선 장애물 2개가 그대로
  # 대기열로 잡힌다 (실측 실전주행_교통류_01: 경로기준 횡 +1.75/+0.55 로 1.2 m
  # 차 → 대기열 오판 → 회피 전면 억제 → 49 s 무한 정지 후 미완주).
  # 판별기 ① 옆으로 지나갈 폭이 남으면 대기열이 아니라 회피 대상이다.
  queue_min_clear_m: 0.3
  # 판별기 ② 대기열은 **선두가 정지선을 향해** 선다. 선두 앞 이 거리 안에
  # 정지선·신호가 있어야 대기열로 본다.
  queue_head_max_m: 25.0
  # 1급 안전망 — **시한 없는 억제 금지**. 대기열은 신호 주기로 풀린다.
  # 이 시간 넘게 안 풀리면 판정을 스스로 철회하고 회피·BREAKOUT 을 허용한다.
  queue_hold_s: 15.0

  # ── WAIT: 앞차 출발 기회 (2026-08-30) ───────────────────────────────
  # 정적 장애물을 봐도 곧장 비켜가지 않고 이 시간까지 관찰한다. 관찰 중에도
  # standoff 속도 상한(④′ 형태)으로 감속해 시프트 전이 공간을 확보한다.
  # 일률 대기는 못 쓴다 — 10.6 m/s 에서 잔여 16 m 인데 전이가 42 m 면 늦는다.
  # 시간 예산 규칙: obj_s ≥ obj_static_s 이고 (d−standoff)/v < (wait−obj_s)
  # 이면 즉시 시프트, 아니면 최대 wait 까지 관찰.
  wait_before_shift_s: 6.0
  # 점선 커버리지 허용 오차 [m] — 마킹 데이터 이산화 여유.
  dash_slack_m: 2.0

  # ── 규칙 2: 데드락 해제 BREAKOUT (2026-08-30) ────────────────────────
  # 규칙 3(선제)·기존 REACTIVE 로도 못 뚫린 채 정지가 지속되면, 회피 제약을
  # 단계적으로 풀고 마지막에 크립으로 전진을 강제한다. 미완주(사실상 실격)보다
  # 접촉 경미 감점이 유리하다는 손익 판단이 전제다.
  # 발동 게이팅: 정지 원인이 장애물 계열일 때만. 신호·보행자·정지선 홀드·
  # 종점 래치·황색 래치·교차로 통과 가드 중에는 **절대 미발동**.
  # false 면 완전 비활성 = 1차(규칙1+3)까지만 동작한다.
  breakout_enabled: true
  # 정지로 볼 속도 [m/s]
  stuck_eps: 0.2
  # 이 시간 정지가 지속되면 BREAKOUT 진입 [s]
  stuck_hard_s: 10.0
  # 단계 상승 간격 [s] — 각 단계에서 진전이 없으면 다음 단계로
  #   L1 회랑 하한·측방 반경 완화 / L2 실선 허용 / L3 여유폭 축소 / L4 크립
  escalate_s: 2.0
  # 크립 목표 속도 [m/s]
  creep_v: 1.0
  # 정상 복귀 판정 — route_s 가 이만큼 늘면 진전으로 보고 BREAKOUT 종료 [m]
  progress_m: 2.0
  # 크립 중 '진전 있음' 으로 볼 최소 증가 [m] (잡음과 구분)
  creep_progress_eps_m: 0.3
  # 크립 실패 판정 [s] — **접촉은 실패 조건이 아니다.** 진전이 있는 한 계속하고,
  # 이 시간 동안 무진전이면 CREEP_FAIL 로 포기하고 정지를 유지한다
  # (충돌 반복 방지). 리스폰 대기·유도는 규정 확인 전까지 미구현.
  creep_fail_s: 6.0
  # ── 시프트 전이 횡가속 상한 (P1, 2026-09-01 실전주행_교통류_01 t=112.4) ──
  # transition_m 은 시프트 **생성 시점** 속도로 정해진다
  # (trans_m = max(transition_m, shift_k_s·v)). 정지 중 생성되면 12 m 로 굳는데,
  # 적신호 SHIFT_HOLD 로 21 s 를 서 있다 6.5 m/s 로 통과하면 코사인 전이의
  # 요구 횡가속이 Δ·π²·v²/(2·L²) = 4.34 m/s² 가 된다 — 조향이 양방향 풀락
  # (±0.480)으로 포화하며 경로 대비 1.45 m 오버슛, 황색 중앙선을 0.94 m 물었다.
  # 경로를 다시 밀지 않고(급조향 금지 원칙) **속도 상한**을 min() 후보로 덧댄다:
  #   κ = |d²(lat_shift)/ds²|,  v_cap = √(a_lat_max / κ)
  # 0 이면 비활성 = 이전 동작.
  a_lat_max: 1.5
  # 위 상한의 하한 [m/s] — 전이 곡률이 아무리 커도 이 밑으로는 안 내린다
  # (전이 한복판에서 완전 정지하면 빠져나올 수 없다).
  shift_cap_min_v: 1.0
  # ── 시프트 기하 계단 검사 (B-7 임시 가드) ────────────────────────────
  # 적용 **전에** 목표 이웃 차로 오프셋의 횡곡률 κ [1/m] 을 재 로그에 남기고,
  # shift_kappa_reject 를 넘으면 그 side 를 기각한다 (그 시점 그 경로 한정 —
  # 재시도 금지 플래그를 걸지 않는다).
  #
  # 실측 2026-09-02, 20260901_174724 배치의 시프트 5건 (간격 1.0 m):
  #   좌24 #1 (계단 2.854 m)  κ_raw = 2.977   ← 결함
  #   좌24 #2 / #3            κ_raw = 0.0002 / 0.0025
  #   좌8  C  / D             κ_raw = 0.0095 / 0.0008
  # 정상 최대 0.0095 대 계단 2.977 = 313 배. 1.0 이면 정상 대비 105 배 위,
  # 계단 대비 3 배 아래다.
  #
  # **기본값 0.0 = 기각하지 않고 계측만 한다.** 켜기 전에 배치에서 확인할 것:
  #   (a) 계단이 장애물보다 앞에 있는가 뒤에 있는가 — 실측 1건은 장애물
  #       13.8 m **뒤**(복귀 전이)라, 기각하면 이미 성공한 회피를 잃는다.
  #   (b) 기각 시 폴백이 실제로 무엇인가 — PREEMPT 경로에서는
  #       ot_blocked_ticks 가 증가하지 않아 REACTIVE 가 무장되지 않는다.
  #       남는 것은 BREAKOUT(정지 10 s 후) 뿐이다.
  shift_kappa_reject: 0.0
  # 위 검사 표본 간격 [m]. 0.1 m 전 해상도는 span 하나에 30 ms 가 넘어 틱
  # 예산(50 ms)의 72% 를 먹는다 — 1.0 m 는 1.7~5.2 ms 이고 계단은 그대로 보인다.
  shift_kappa_step_m: 1.0
  # ── 계획 차선변경 중첩 검사 (B-11) ──────────────────────────────────
  # 회피 시프트 span 안에서 **빌드 시점 계획 횡오프셋**(_lat_build)이 이만큼
  # 넘게 변하면 그 side 를 기각한다. lat_shift = _lat_build ± d 라 두 횡이동이
  # 구조적으로 **합산**되기 때문이다 ([route.py] shift_route_smoothly).
  #
  # 실측 2026-09-02, 20260902_131600 실전주행_교통류_01_좌회전24 t=112.8~134.0:
  #   회피 복귀(+3.0 m) + 계획 LC(+2.94 m) 가 rs 634.5~646.5 에서 12 m 중첩 →
  #   자차가 한 동작으로 **6.25 m (차로폭 3.00 의 2.08 배)** 를 횡단했다.
  #   지시등은 t=112.59~133.09 좌로 연속 1회 점등뿐 — 점등 1회에 차로 경계
  #   좌측 통과 2회(t=128.59, 132.19). 항목13 규정 위반 형태다.
  # 시프트별 lc_var 실측: 문제 건 2.597 / 정상 건 0.000.
  # 계획 LC 블렌드는 37 m 에 걸쳐 약 3 m 이동한다 (경로 전수 16건).
  #
  # **기본값 0.0 = 기각하지 않고 계측만 한다** (reasons.avoid.lc_var).
  # 임계는 배치 전수 분포를 더 모은 뒤 확정한다. 켤 때 권고값 1.0.
  # 켜면 B-10 의 폴백 경로를 함께 봐야 한다 (기각 → REACTIVE 무장 여부).
  shift_lc_overlap_m: 0.0
  # ── 시프트 기하 완성 게이트 (B-12) ──────────────────────────────────
  # 전이가 **장애물 도달 전에 끝나는가**. 안 끝나면 그 side 를 기각한다.
  #   need = trans_m + shift_ahead_m + shift_geom_margin_m  ≤  s_rel(actor)
  #
  # 왜 필요한가 — side 루프의 기존 7게이트(no_neighbor / center_line /
  # span_into_zone / solid / occupied / kappa / lc_overlap)에 이 검사가 없다.
  # 간접 방어인 PREEMPT 의 t_left = (s_rel − standoff)/v 는 저속·근접에서
  # **음수로 크게 벌어져 오히려 더 확실히 발동하는 역방향** 구조다.
  #
  # 실측 2026-09-02, 20260902_131600 실전주행_교통류_01_좌회전24 t=214.85:
  #   s_rel 5.3 m, v 0.00 → standoff 10.0, t_left −47.0 → PREEMPT 통과
  #   trans_m 12.0 + shift_ahead_m 5.0 = 17.0 m 필요, margin = −11.7 m
  #   → 장애물 지점의 경로 횡이동이 3.0 m 중 **0.0046 m (0.15 %)**.
  #     사실상 시프트 없이 경로만 흔들고 접촉(min_gap 0.0) 33.4 s, 미완주.
  #   같은 조건으로 BREAKOUT L1~L3 이 3회 더 재생성했다 (총 4틱, 전부 미완).
  #
  # 임계 근거 (같은 로그 side 루프 진입 5틱 + WAIT 56틱의 margin):
  #   정상 계열 +33.91 ~ +39.20   /   불가 계열 −11.70   → 간극 45.6 m
  # 간극이 넓어 작은 값으로 충분하고, 중간 영역 실측이 없어 큰 값을 정당화할
  # 데이터가 없다. 2.0 은 전이 길이 12 m 의 약 1/6.
  shift_geom_gate_enable: true
  shift_geom_margin_m: 2.0

# 시나리오 생성 시작점 분산 (tools/gen_scenarios.py).
# 역할 구분: configs/themes.yaml gen: 은 "완성 경로의 폐기 게이트 임계"(시나리오
# 정의와 함께 검토), 여기는 "후보 선별·추첨 알고리즘 상수"(lane_graph 자산과
# 함께 움직임) — 게이트 완화 금지 원칙과 무관한 층이다 (2026-08-28).
gen_coverage:
  # 시작 차로 최소 길이 [m] (구 58 하드코딩 완화). 가속 확보는 아래 accel 로 분리.
  start_min_lane_m: 35.0
  # 시작 오프셋(8 m) 이후 확보해야 하는 전진 거리 [m] — 짧은 차로는 비교차로
  # successor 를 누적해 채운다 (구 58 m 조건의 실효 가속 50 m 과 동일 기준).
  start_accel_m: 50.0
  # 공간 분산 추첨 격자 셀 크기 [m] — 셀을 먼저 뽑고(사용 셀 감쇠) 셀 안에서 후보 추첨
  grid_cell_m: 200.0
  # 사용된 셀의 역방향(미사용) 셀 가중 배수 — 셀 키가 (격자, 방향 4분면)이므로
  # 억압 해제만으로는 역방향이 우연 수준으로만 뽑힌다 (2026-08-28 실측: 60건 중
  # 양방향 사용 도로 5개, 무가중 기대치 이하). 방문 회랑의 미사용 방향을 능동
  # 우선해 도로×방향 커버리지를 올린다. 1.0 = 부스트 없음.
  reverse_dir_boost: 3.0
  # 시작 후보 재추첨 횟수 상한 (구 300 하드코딩)
  redraw_max: 300
  # walk 경로 최소 길이 [m] — turns 소진 후 목표까지 'any' 교차로 통과를 자동
  # 연장한다. routes 정의의 min_length_m 이 우선(0 = 연장 없음). 기본값은
  # 연속교차로 수준(교차로 6회 ≈ 830 m) 참고 (2026-08-28 실측: turns 수가
  # 경로당 road 수를 선형 지배 — 교차로 1회당 +2~2.5 roads).
  walk_min_length_m: 800.0
  # 길이 연장으로 추가할 교차로 통과 상한 (무한 확장 방지).
  # 주행 검증형 3 km 목표에 필요 — 실측(2026-08-28): 8로는 평균 1.2 km 에
  # 그치고, 20이면 평균 ~2 km·최장 3.2 km (맵 회랑 한계로 3 km 는 보장이
  # 아니라 최대 연장이다). 이벤트 검증형(400)은 연장이 발생하지 않아 무관.
  walk_ext_turns_max: 20
  # 연장 구간 전용 전진 상한 [m] — 필수 turns 의 700 m 가드(교차로 못 찾고
  # 헤매는 것 방지)와 분리해, 교차로 없는 긴 직선 회랑도 길이에 기여시킨다.
  walk_ext_forward_max_m: 2000.0
  # 목표 길이 탐색(백트랙 DFS) 전환 임계 [m] — 주제 목표 길이가 이 값 이상일
  # 때만 그리디 연장 대신 탐색을 쓴다. 그리디는 막다른 회랑에서 되돌아 나올
  # 수 없어 거기서 종료된다 (2026-08-29 실측: start_pool 전수 3 km 도달률
  # 그리디 34.5% vs 백트랙 탐색 93.4%). 이벤트 검증형(400)·혼합형(800)은
  # 그리디로 이미 충족돼 탐색 비용을 쓸 이유가 없다.
  search_min_length_m: 1500.0
  # 탐색 예산 = 회랑 전개 횟수 상한 (백트랙 상한). 실측 확장 평균 18회 —
  # 격자 맵이라 직진 우선 순서면 백트랙이 거의 일어나지 않는다.
  search_expand_max: 4000
  # 탐색 깊이 상한 (연장 구간의 교차로 통과 횟수)
  search_max_depth: 60
  # 'any' 출구 가중의 전방 잔여 회랑 정규화 상한 [m] (0 = 길이 가중 미사용).
  # 미방문 가중 1/(1+n) 과 곱 결합 — 막다른 회랑 출구를 피해 3 km 도달률을
  # 올린다. 값은 2026-08-28 실측 튜닝 (커버리지 손실 없는 지점).
  walk_exit_clear_cap_m: 600.0

# 장거리 다중이벤트 배치 (실전주행 — themes.yaml scale_events: true 주제)
gen_events:
  # 이벤트 밀도: 경로 길이 이 값당 1건 (3 km → 6건). 근거는 이벤트 필요 공간
  # 실측(static_vehicle 30 / ped_blind·narrow 40 / obstacle_chain 개수×18+20 m)
  # + 대응 사이클(감속 12~25 + 정지·재출발 30~50 m) ≈ 이벤트당 최대 ~165 m.
  # 3 km 경로의 가용 구간은 usable_spans 실측 42~58% (평균 52% ≈ 1.6 km,
  # 2026-08-30 실전주행 8건) — 6건이면 가용축 슬롯 간격 ~215~320 m 로
  # 이벤트당 최대 공간(165 m)을 여유 있게 웃돈다. 8건(375 m/건)부터는 짧은
  # 가용 경로에서 간격이 min_gap 근처로 몰린다.
  # 500 → 600 (2026-08-30): 보행자 트리거 역산으로 이벤트 점유 구간이
  # 넓어져(트리거점까지 claim) 500 이면 배치 실패가 잦다. 실전주행 3 km
  # 기준 6~7건 → 5~6건으로 줄지만, 성립 안 하는 6건보다 성립하는 5건이 낫다.
  per_route_m: 600.0
  # 이벤트 시작점 간 최소 간격 [m]: 트리거 선행(25~40) + 이벤트 몸통(최대 74)
  # + 정지·재출발 사이클(~50) 에 여유를 더한 값. 가용 구간이 부족하면 개수를
  # 이 간격이 유지되는 수준까지 줄인다.
  min_gap_m: 150.0
  # 배치 실패 허용: 개별 이벤트가 어느 위치로도 안 놓이면 그 이벤트만 버리고
  # 계속한다. 최종 배치 수 < ceil(목표×이 비율) 이면 시나리오 폐기 → 백필.
  min_keep_ratio: 0.6

gen_placement:
  # 이벤트를 **놓아도 되는 자리**의 조건. usable_spans(교차로·시종점 여유)만으로는
  # 걸러지지 않는, 이벤트 종류별 성립 조건이 여기 온다.
  #
  # pulk 교통류가 켜진 시나리오에 narrow 를 함께 배치하면 GenError 로 폐기한다.
  # 근거(2026-09-02): narrow(침범폭 0.7)는 ego 기준으로는 통과 가능하지만
  # (잔여폭 2.1~2.14 m > 차폭 1.9 m, 엇갈림 14 m) VTD internal-driver 교통류는
  # 이 협착을 지나지 못하고 그 앞에 정체를 만들며, ego 가 정체에 갇혀
  # blocked 로 끝난다.
  #   · 실전주행_교통류_01_좌회전24 (logs/batch/20260902_230229): narrow 20.7 m
  #     앞에서 pulk 차량(id 9, 이력상 최대 15.6 m/s 주행)이 정지, ego 는 그 뒤
  #     9.6 m 에 갇힘. 앞뒤 모두 정지 pulk 차량.
  #   · 정적회피집중_02_우회전 (logs/batch/20260902_231132): ego 가 narrow 직전
  #     5.1 m 에서 정지(blocked), 뒤로 pulk 3대 정체.
  # false 로 두면 종전 동작(동시 배치 허용)이 그대로 재현된다.
  narrow_pulk_guard_enable: true
  static_vehicle:
    # 자차로 정중앙 정차 차량은 동일 방향 주행차로가 1개뿐인 구간에서 **회피가
    # 원천 불가**다: 차폭 1.9 m / 이 맵 차로 폭 2.6~3.2 m 라 좌우 여유가
    # 0.35~0.65 m 이고, kr_rules 는 어느 BREAKOUT 단계에서도 황색 중앙선을
    # 넘지 않으며(kr_rules._is_center_mark) 이웃 차로가 없으면 no_neighbor 로
    # 기각한다. 그래서 ego 가 영구히 막히고 런이 blocked 로 끝난다 —
    # 연습이 되지 않고 시나리오만 버려진다.
    #
    # 실측(2026-09-02, seed 0 전수 생성): static_vehicle 배치 113건 중 24건(21%)
    # 이 1차로 구간이었다 (정적회피집중 5/23 · 추월집중 7/30 · 실전주행_교통류
    # 6/27 · 다중이벤트 4/8 · 실전주행 2/20). blocked 로 끝난 기존 런 중
    # 실전주행_02_직진28(202 m, lane (2818,6,-1), 앞 6.5 m 횡 0.1 m 정차차)이
    # 이 원인이었고 제어기 결함으로 잘못 분류돼 있었다.
    #
    # true 면 동일 방향 주행차로가 2개 이상인 구간에만 놓는다. 자리가 없으면
    # 그 이벤트를 버리고 gen_events.min_keep_ratio 게이트 → 백필로 넘어간다.
    # false 로 두면 조건 이전 동작(1차선 배치 허용)이 바이트 단위로 재현된다 —
    # 대회 코스에 1차선 정적차가 나올지 조직위에 확인하지 못했으므로 그 케이스를
    # 만드는 수단을 남긴다 (2026-09-02).
    require_multi_lane: true
    # 이웃 차로로 셀 최소 폭 [m]. 이 맵에는 폭 0 인 테이퍼 차로가 실재해서
    # ((173,3,-1) w=0.0) 개수만 세면 "이웃이 있다" 가 거짓이 된다. 차폭 1.9 m
    # 에 좌우 여유를 더한 값 — 이보다 좁은 이웃은 비켜 설 자리가 아니다.
    min_neighbor_width_m: 2.5
    # 2차로 이상 부분구간의 최소 길이 [m] — 이보다 짧은 조각은 후보에서 뺀다.
    # 기준은 overtake.min_corridor_m(25) 이다: kr_rules 는 목표 차로의 점선
    # 회랑이 그만큼 확보돼야 차선변경을 하므로, 그보다 짧은 조각은 옆 차로가
    # 있어도 시프트가 성립하지 않는다. 25 에 여유를 더해 30.
    # 실측 대가 (2026-09-02, 정적회피집중 30경로 · 가용구간 7,079 m):
    #   min_span   0 → 후보 5,385 m (76%) · 후보 0 인 경로 1/30
    #             20 → 5,343 m (75%) · 2/30
    #             30 → 5,034 m (71%) · 3/30      ← 채택
    #             60 → 4,249 m (60%) · 10/30     (급격히 나빠진다)
    min_span_m: 30.0
  obstacle_chain:
    # 1차로 구간의 체인은 슬라럼이 아니라 차단이다 — 실측(2026-09-02,
    # logs/batch/20260902_231132 정적회피집중_01_좌회전0): 1차로 (2818,6,-1)
    # 에서 체인(Fuelcan 엇갈림)이 자차로를 직접 막아 **충돌 1 + blocked** 로
    # 끝났다. static_vehicle 게이트 때는 "가장자리 엇갈림이라 원천 불가 아님"
    # 으로 제외했으나 실측이 반증했다.
    # true 면 static_vehicle 과 같은 _multi_lane_spans 경로로, 체인 전체가
    # 동일 방향 주행차로 2개 이상인 부분구간 안에 들어가는 자리에만 놓는다.
    # 폭(min_neighbor_width_m)·최소구간(min_span_m) 임계는 위 static_vehicle
    # 값을 그대로 읽는다 (같은 물리량 — 값을 두 곳에 적지 않는다).
    # false 면 종전 동작(1차선 배치 허용)이 바이트 단위로 재현된다.
    require_multi_lane: true

gen_traffic:
  # 교통류 **관측 지표** 전용 (tools/event_check.py traffic_metrics).
  # 배치 상수는 여기 없다 — 교통류 생성은 VTD 네이티브 PulkTraffic 이고
  # 그 상수는 아래 pulk.* 다. (2026-08-30 ev_traffic 제거)
  #
  # 로그에는 객체 heading 이 없고 s_rel/on_route 는 PDM 이관 후 항상 None 이다
  # (run_agent._log_objects). 그래서 ego 프레임 종·횡거리를 여기서 직접 계산하고,
  # "동방향 주행 차량" 을 아래 두 임계로 정의한다 — 정차 차량(narrow/static_vehicle,
  # 속도 0)과 회랑 밖 차량을 빼기 위한 값이다.
  observe_moving_mps: 0.5   # 이 속도 이상 움직인 적이 있어야 '주행 중'
  observe_corridor_m: 6.0   # ego 프레임 |횡| 이 이 안일 때만 같은 진행 회랑으로 본다

pulk:
  # VTD 네이티브 교통류 <PulkTraffic><PulkDef/></PulkTraffic> — ego 주변
  # 영역(타원)에 Count 대를 채우고, 영역을 벗어난 차량을 가장자리에 **재배치**한다.
  #
  # 왜 ev_traffic(Path01 고정 배치)을 버렸는가 (2026-08-30 실기 확인):
  #   (1) 6대 × 45 m = 265 m 대역뿐이라 3 km 경로 전 구간을 못 채운다.
  #   (2) ego 와 속도가 다르면 3 km 동안 수백 m 벌어져 후반부가 텅 빈다.
  # PulkTraffic 은 재배치로 두 문제가 모두 사라진다. 이벤트가 아니라 시나리오
  # 전역 속성이라 ctx.claim 도, event 목록 등록도 없다.
  #
  # 스펙 출처: Scenario Editor 2025.2 산출물 (실기 검증 완료).
  # 비율은 전부 0~1 소수이고, 에디터가 두 합계를 검사한다 —
  #   AreaF+AreaB+AreaL+AreaR = 1.0,  Cars+Vans+Buses+Trucks+Bikes = 1.0.
  # gen_scenarios.pulk_def 가 생성 시점에 같은 검사를 하고 어긋나면 GenError 다.
  # **자동 보정하지 않는다** — 조용히 고치면 시나리오마다 다른 값이 들어간다.
  count: 20                 # 영역 내 유지 대수. 축 '교통류대수' 가 있으면 그 값이 이긴다
  semi_major_m: 300.0       # 영역 장반경 [m]. semi_minor 와 같으면 Circle (별도 속성 없음)
  semi_minor_m: 300.0       # 영역 단반경 [m]
  inner_radius_m: 30.0      # ego 주변 이 반경 안에는 스폰하지 않는다 (스폰 즉시 충돌 방지)
  center_offset_m: 50.0     # 영역 중심을 ego 전방으로 민 거리 [m]
  # 영역 4분할 배분 [0~1] — 합 1.0. 전방을 두껍게 둬야 선행차 상황이 자주 잡히고,
  # 좌우를 남겨야 "옆 차로가 비었는지" 판단할 대상이 생긴다.
  area_f: 0.40
  area_b: 0.30
  area_l: 0.15
  area_r: 0.15
  own_side: 0.70            # 같은 진행방향 비율 [0~1]. 나머지가 대향류
  # 차종 구성 [0~1] — 합 1.0
  cars: 0.80
  vans: 0.0
  buses: 0.10
  trucks: 0.10
  bikes: 0.0
  # 축 '교통류밀도' 프리셋 — 같은 Count 를 넓은 영역에 뿌릴수록 성기다.
  # 비율(area_*/차종)은 건드리지 않는다: 두 합계 제약이 축과 무관하게 유지된다.
  density:
    조밀: {semi_major_m: 150.0, semi_minor_m: 150.0, inner_radius_m: 15.0}
    보통: {semi_major_m: 300.0, semi_minor_m: 300.0, inner_radius_m: 30.0}
    성김: {semi_major_m: 450.0, semi_minor_m: 450.0, inner_radius_m: 45.0}
batch:
  # 완주 임계 = total − (stop_gap + wheelbase + front_overhang + 이 값).
  # route_s 는 뒷축 기준이고 계획 정지점이 total − stop_gap − 앞범퍼 이므로
  # 임계가 stop_gap 튜닝을 자동으로 따라간다.
  end_slack_m: 1.0

  # ── 종료 판정 시간 4종 (이름이 비슷하니 무엇을 재는지 명시한다) ──────────
  # 각각 "언제부터"가 다르다. 겹칠 때는 먼저 임계에 닿는 것이 이긴다.
  #
  # stop_grace_s   : **완주 지점에 도달한 뒤**, 차가 멈추기(v<0.5)를 기다리는 시간.
  #                  실패가 아니다 — 이 시간이 지나면 굴러가는 중이어도 완주 처리.
  stop_grace_s: 10.0
  # stall_end_s    : **계획은 진행인데(v_target ≥ stall_intent_mps) 차가 안 나가는**
  #                  상태가 지속된 시간. 전방에 정지 사유가 없다는 뜻 = 제어기 문제.
  stall_end_s: 30.0
  # blocked_end_s  : **앞이 막혀(선행차·장애물) 계획도 정지인** 상태가 지속된 시간.
  #                  적신호 대기·보행자 횡단은 제외한다 (정상 정차라 곧 풀린다).
  #                  앞차가 영원히 안 움직이면 우리도 못 가므로 종료 대상이다
  #                  (2026-08-30: 정지 차량 두 대 사이에 끼어 배치가 진행 못 함).
  blocked_end_s: 30.0
  # no_progress_end_s: **route_s 가 progress_eps_m 도 안 늘어난** 시간. 위 예외를
  #                  전부 뚫는 최종 안전망 — 신호가 고장 나 영원히 적색이어도 끝난다.
  #                  적60 대기(60 s)보다 길어야 정상 대기를 안 죽인다.
  no_progress_end_s: 120.0

  # 위 판정이 쓰는 임계값 (하드코딩이던 것을 이관 — 2026-08-30)
  stall_speed_mps: 0.1      # 이 속도 미만이면 '정지'로 본다
  stall_intent_mps: 0.5     # v_target 이 이 값 이상이면 '계획은 진행'으로 본다
  progress_eps_m: 0.5       # route_s 가 이만큼 늘면 '전진'으로 인정 (no_progress 리셋)

report:
  # tools/batch_run.py 의 logs/batch/<ts>/report.txt 표 — 밤샘 배치를 아침에
  # 한 화면에서 훑기 위한 요약이다. 상세는 <시나리오>.score.txt / report.json 에
  # 그대로 남으므로 여기서는 잘라도 정보가 사라지지 않는다.
  table_width: 100          # 표 전체 표시폭 상한 [칸, 한글 2칸] — 주요위반 칸이 남는 폭을 먹는다
  name_w: 24                # 시나리오명 표시폭 상한 — 넘으면 … 말줄임
  top_violations: 3         # 주요위반 칸에 나열할 항목 수 — 나머지는 " 외N"
  # 축약 항목명 표시폭 상한 [칸] — 넘으면 … 말줄임. 한글 1자가 2칸이므로 12 = 6자.
  # 대부분(차선이탈 8·적신호통과 10)은 그대로 들어가고 최장 '차선변경지시등미점등'
  # (20칸)만 '차선변경지…' 로 줄어든다.
  violation_label_w: 12
  # 주요위반에서 뺄 검출 키 (tools/score.py LABEL 키) — 상태 칸과 중복이라
  # 정작 봐야 할 위반을 상위 3개 밖으로 밀어낸다.
  exclude_violations: [not_finished, stall, off_route]
  # 우측 정렬할 열 이름 — 헤더와 값에 **똑같이** 적용된다 (요약 표 + 정지 지표 표
  # 공통, 목록에 없는 열은 좌측). 숫자 열을 좌측에 두면 자릿수가 안 맞아 헤더와
  # 어긋나 보인다. 값이 아니라 열 이름으로 고른다 — '2:05'(시간)·'0/4'(이벤트)는
  # 값만 보면 숫자인지 애매해서 표마다 정렬이 흔들린다.
  # 좌측 유지: 시나리오·상태·이벤트·주요위반·ctrl·신호 (문자 또는 목록)
  align_right: ['거리[m]', '시간', '평균[km/h]', '감점',
                't[s]', 'route_s', 'slf[m]', '접근[km/h]', '전환', '유지[s]',
                '녹색후출발[s]']

event_trigger:
  # tools/gen_scenarios.py 보행자 이벤트(pedestrian/jaywalk/ped_blind)의 트리거
  # 거리 역산. 고정 25 m 를 쓰던 시절에는 도로 폭에 따라 필요값이 27~87 m 로
  # 변해 원리적으로 성립하지 않았다 — 2026-08-30 실측(실전주행_01_좌회전16):
  # 보행자가 ego 가 지나간 48 m 뒤(4 s 후)에야 차로에 진입, 제어기는 무반응 통과.
  #
  # 역산: 보행자가 ego 차로 근접 가장자리에 닿는 시각(t_near)에서 lead_s 만큼
  # 더 들어간 순간 ego 가 도착하도록 트리거 지점을 잡는다.
  #   t_near = (횡시작거리 − 차로반폭) / 보행속도
  #   trig_d = 예상속도 × (t_near + lead_s) − radius_m
  radius_m: 3.0             # PosAbsolute 반경 [m]. ego 가 구에 **진입**할 때 터지므로
                            # 그만큼 일찍 발동한다 (실측: 반경 10 → −8.7 m 계통 편향).
                            # 20 Hz · 14 m/s 면 틱당 0.7 m 라 3 m 면 놓치지 않는다.
  lead_s: 0.4               # 근접 가장자리를 지나 차로 안으로 들어간 정도 [s].
                            # 조우 창(차로폭/보행속도)이 1~2 s 뿐이라 크게 잡으면
                            # 보행자가 이미 건너가 버린다.
  speed_factor: 0.9         # 예상 주행속도 = 제한속도 × 이 값 (실측 12.4/13.89 = 0.89)
  default_limit_kph: 50.0   # speed_limit 이 None 인 차로의 대체 제한속도
  ped_start_margin_m: 1.5   # 보행자 시작점을 차도 가장자리 밖으로 밀어내는 여유 [m].
                            # _crossing_shape 와 역산이 같은 값을 봐야 한다 (단일 출처).
  trig_min_m: 20.0          # 트리거 거리 하한 — 더 짧으면 ego 가 반응할 수 없다
  trig_max_m: 90.0          # 상한 — 넘으면 claim 구간이 min_gap_m 과 충돌한다
  trig_min_route_s_m: 5.0   # 트리거 지점의 route_s 하한. 이보다 앞이면 경로 밖이라
                            # 스폰 즉시 발동해 버린다(옛 max(1.0, …) 클램프의 조용한 실패).
  # 상·하한을 벗어나면 보행속도를 이 범위 안에서 자동 조정해 성립시키고,
  # 그래도 안 되면 그 이벤트만 폐기한다 (gen_events.min_keep_ratio 가 받아준다).
  walk_speed_min_mps: 1.0
  walk_speed_max_mps: 3.0
  # 이벤트 종류별 기본 보행속도 [m/s]. 무단횡단은 뛰어서 건너므로 빠르다.
  walk_speed_default:
    pedestrian: 1.5         # 정상 횡단보도 보행
    jaywalk: 2.5
    ped_blind: 2.5
  # 이벤트 점유 구간 = [s − trig_d − claim_back_m, s + claim_fwd_m].
  # 트리거 지점까지 점유해야 다른 이벤트의 차량이 그 앞을 막지 않는다.
  claim_back_m: 15.0
  claim_fwd_m: 20.0
  # 조우 성립 판정 (tools/event_check.py): ego 가 이벤트 지점을 지나는 순간
  # 보행자 횡위치가 |lat| ≤ 차로반폭 + 이 값이면 성립.
  meet_tol_m: 1.0

scoring:
  # 2026 HL FMA 안내문 채점 (2026-08-27 공개, tools/score.py score_run):
  # 구간별 독립 100점, (항목,구간)당 1회 감점 — 경미 -3 / 중대 -6,
  # 경미+중대 공존 시 중대 하나. 리스폰은 구간당 free 회 무감점, 초과 -6/회.
  # 미완주면 뒷축이 진입한 구간까지만 만점·감점 집계. 구간 점수 음수 허용.
  # 단일 구간 모드: 대회 당일 경로 CSV 확정 전에는 구간 경계가 무의미하므로
  # 전체 코스를 1구간으로 집계 — (항목)당 1회 감점, 리스폰 전체 1회 무료.
  # CSV 확정 시 false 로 되돌리고 section_bounds_s 를 채운다.
  single_section: true
  section_bounds_s: []          # 구간 경계 route_s [m] 오름차순. 비면 전체 1구간
  minor_penalty: 3
  major_penalty: 6
  respawn_free_per_section: 1
  # 완주 = 뒷바퀴 축이 종료 지점 좌표 통과 (경로 투영 route_s 로 환산 판정).
  # null 이면 기존 route_s 임계(end_margin) 방식 유지 + 경고.
  # 실제 좌표는 9/3 접속 테스트에서 확보 후 기입.
  finish_xy: null               # [x, y]
  # 제어 정지 목표의 여유: 뒷축이 종료선을 이만큼 넘어 정지하도록 계획한다
  # (kr_rules.plan_stop_s). 채점 기준이 아니다 — 채점은 finish_s 통과 여부만 본다.
  finish_clearance_m: 2.0
  # 제한속도 severity [km/h]: 초과 ≤allow 감점 없음 / ~major 경미 / >major 중대
  speed_allow_kph: 1.0
  speed_major_kph: 20.0
  # 대회 7번 적색신호 정지 품질 (detect_red_stop): 앞범퍼가 정지선 앞 stop_ok_m
  # 이내 정지 = 정상 / 그보다 멀면 경미 / 선 넘으면 침범(경미) / 통과는 중대.
  # 정지 판정은 v<score.stop_speed_mps 가 stop_hold_s 이상 지속.
  stop_ok_m: 2.0
  stop_hold_s: 0.5
  # 대회 13번 방향지시등: 차선변경 시작(차로 경계 통과) 전 이 시간 이상
  # 해당 방향 turn_signal 이 연속 점등돼 있어야 한다. 미달 = 경미.
  signal_lead_s: 3.0
  # 대회 4번 중앙선 침범: 깊이(t_off + 차폭/2 − 차로폭/2)가 depth 이상,
  # hold 이상 지속 = 중대. left_is_center 차로만, junction 차로 제외.
  center_depth_m: 0.6
  center_hold_s: 0.6
  # 대회 8번 녹색신호 통과: 정지선 앞 dist 이내 + 녹색 + 정차가 minor 이상
  # 지속 = 경미, major 이상 = 중대. 면책: 보행자 존재 / 전방 lead(전방 lead_m·
  # 횡 lead_lat_m 이내 차량) / reasons.winner 에 정당한 정차 원인 기록.
  green_dist_m: 30.0
  green_minor_s: 5.0
  green_major_s: 10.0
  green_lead_m: 15.0
  green_lead_lat_m: 2.0
  # 대회 5번 보도 침범: 깊이(|t_off| + 차폭/2 − sidewalk_dist_at)가 depth 이상,
  # hold 이상 지속 = 중대. 그 쪽 보도 없음(None)은 판정 대상 아님.
  sidewalk_depth_m: 0.5
  sidewalk_hold_s: 0.3
  # 대회 10번 보행자 대응 (detect_pedestrian_response, 2026-08-28 실측 근거 승인):
  # 대응 = (경로 중심선까지 ≤ near) OR (차로 쪽 횡속도 ≥ cross_v), 전방 engage 이내.
  # 횡단 완료 = |lat| > 차로폭/2 + clear. 완료 전 무정차 통과 / 정지 후
  # 완료 전 재출발(v ≥ restart_v) = 중대. 실측: 횡단 횡속도 1.0~2.0 m/s,
  # 차로 반폭 1.5 m, 횡단 시 경로 접근 0.1~0.23 m vs 보도 대기 ≥ 2.26 m.
  ped_near_m: 2.0
  ped_cross_v: 0.3
  ped_engage_m: 40.0
  ped_restart_v: 1.0
  ped_clear_m: 0.5

score:
  # 위반 검출기(tools/score.py) 임계. 배점·감점 없음 — 검출 기준값만 둔다.
  # 충돌·근접: 자차·객체를 회전 사각형으로 보고 **외곽 간 최소 간격** 기준.
  collision_dist_m: 0.1    # 간격 ≤ 이 값 → 충돌로 집계
  near_dist_m: 1.5         # 간격 ≤ 이 값 → 근접 경고 (충돌 미만)
  stop_speed_mps: 0.5      # "정지 상태" 판정 속도 (정지선 침범 검출)
  time_limit_s: 300.0      # 대회 완주 제한시간 (5분)
  # 초과 구간 병합: 이 시간 이하로 임계 아래로 내려갔다 다시 넘으면 같은 1건
  # (제어기가 임계 바로 밑에서 진동하면 1틱짜리 건이 수백 개로 쪼개진다)
  merge_gap_s: 1.0

log:
  enabled: true
  dir: logs
  path: ""
  flush_every: 20

  # ── 프리즈 진단 계측 (2026-08-30) ────────────────────────────────────────
  # 실사고: 틱 로그에 14.95 s 공백이 생겼는데(완주속도_01_좌회전0 t+373.2),
  # 그 사이 로그 줄이 하나도 없어 "우리 루프가 멈춘 것"인지 "VTD 가 안 보낸 것"
  # 인지 사후에 가릴 수 없었다. 아래 계측은 그 구분을 위한 것이다 — 원인 대응이
  # 아니라 관측 수단이다.
  #
  # 판별법: 공백 구간의 timing.loop_iters 증가량을 본다.
  #   ~300 증가 → 루프는 살아 있었다 (수신이 끊긴 것 = VTD/네트워크 쪽)
  #   ~1  증가 → 프로세스가 멈춰 있었다 (GC·스왑·OS/WSL2 정지 쪽)
  probe_enabled: true
  # getrusage 호출 주기 [틱]. 실측 0.94 µs/회로 틱 예산 50 ms 의 0.002% 라
  # 매 틱(1)이 기본이다. 부하가 문제되면 올린다 (그 틱만 nivcsw/majflt 가 빠진다).
  probe_rusage_every: 1
  # 단일 GC 일시정지가 이 시간을 넘으면 이벤트 줄로 남긴다 [s]
  probe_gc_min_s: 0.05
  # 무수신이 이 시간을 넘으면 공백 구간을 이벤트 줄로 남긴다 [s].
  # 지금은 패킷이 온 틱만 로그에 남아 무수신 구간이 통째로 비어 있다.
  gap_log_s: 1.0
  # 무수신이 이어지는 동안 이 간격으로 진행 상황을 남긴다 [s] (0 = 남기지 않음)
