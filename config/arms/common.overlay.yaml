# 판정값 — 이것만 바꾼다. 주행에는 영향이 없다 (batch_run 의 종료 판정만 읽는다).
batch:
  # 논문의 "무한 정지" = 면책 사유(적신호·보행자) 없이 60 s 정지.
  # stall = 계획은 진행인데 못 감, blocked = 계획도 정지. 둘의 합이 무한 정지다.
  # no_progress_end_s 는 params 값(99999) 그대로다 — 면책이 끝없이 이어지는 런은
  # 시나리오 timeout 으로 끝나고 무한 정지와 따로 센다.
  stall_end_s: 60.0
  blocked_end_s: 60.0
