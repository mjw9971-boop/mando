# 시나리오 자동 생성 프리셋 — tools/gen_scenarios.py 가 읽는다.
#
#   python3 tools/gen_scenarios.py 보행자집중 급정거집중 --count 3 --seed 1
#
# [routes]  경로 풀. 이름 → 정의.
#   csv:  검증된 대회형식 CSV 재사용 (시작 + 교차로 진입/진출 짝 + 종료)
#   walk: lane_graph 를 걸어 대회형식 CSV 를 합성한다
#         turns: 교차로마다 고를 방향 [straight|right|left|any]
#         require: school_zone | speed_change  (경로가 반드시 포함해야 하는 성질)
#         max_gap_m: 교차로 사이 최대 간격 (연속교차로용)
#         tail_m: 마지막 교차로 뒤 여유 주행 거리
#         min_length_m: 경로 최소 길이 — turns 소진 후 'any' 교차로 통과를 자동
#                       연장 (기본 params gen_coverage.walk_min_length_m, 0=연장 없음)
#
# [themes]  주제 프리셋.
#   event:  이벤트 종류 나열 — pedestrian jaywalk ped_blind lead_brake slow_lead
#           static_vehicle cut_in oncoming signal obstacle_chain narrow none
#   routes: 위 경로 풀 이름들
#   vary:   흔들 축. 축별 값 풀은 같은 이름의 키로 재정의할 수 있다 (없으면 코드 기본값)
#   combine: N  → 한 시나리오에 이벤트 N개 동시 배치 (다중이벤트)
#   rotate: true → 시나리오마다 event 목록을 순환하며 하나씩 (전체회귀)
#   random_axes: true → 축 값을 전수조합 대신 시드 난수로 뽑는다 (랜덤카오스)
#   min_length_m: 주제의 walk 경로 목표 길이 [m] — routes 개별 지정보다 우선,
#          미지정 시 params gen_coverage.walk_min_length_m (800).
#          이벤트 검증형 400(검증 밀도 우선) / 주행 검증형 3000(대회 3 km 급,
#          맵 회랑 한계로 보장이 아닌 최대 연장) — 2026-08-28 분류 확정.
#   start: 고정|자유 → walk 경로의 시작점 모드. 고정(기본)이면 같은 경로 풀
#          이름은 실행 내에서 주제가 달라도 같은 경로를 공유하고, 자유면 주제·
#          경로변형마다 맵 전체 후보 풀에서 다른 시작점을 뽑는다 (맵 커버리지용).
#          csv 경로는 시작점이 파일에 고정이라 영향 없음.
#
# 로직이 아직 대응 못 하는 주제(대향차·컷인 등)도 생성은 된다 — 실패 목록이
# 곧 미구현 우선순위 자료다.

# [gen] 생성 검증 게이트 상수 (하드코딩 금지 — gen_scenarios.spawn_gate 가 읽는다)
gen:
  # 스폰-경로 정합: XML 의 Ego 스폰(Path01 첫 waypoint + PathRef StartS/StartLane)을
  # lane_graph 로 되짚은 해석의 heading 이 경로 시작 heading 과 이보다 크게 다르면
  # 그 시나리오를 폐기하고 다른 시작점으로 재시도한다.
  # 실측(2026-08-26, 완주속도_01_속도전환2): 첫 waypoint 뒤(−s)로도 둘째 waypoint
  # 도로에 닿는 우회가 있으면 VTD 가 Path 를 역방향 차로망으로 해석해 반대편
  # 연결로 (3174,0,-1) 에 스폰했다 (heading 차 173°, 조향 포화 → courseRespawn 반복).
  spawn_heading_max_deg: 30.0
  # 역방향 우회가 "정방향 경로거리 × 이 값" 이내로 존재할 때만 역방향 해석이
  # 실재한다고 본다 (VTD 라우터 메트릭을 모르므로 통행방향 무시 탐색, 보수적).
  reverse_ratio_max: 2.0
  # 경로 폴리라인 연속 간격 상한 [m] (VtdRoutePlanner 재샘플 10 cm 기준).
  # 이보다 큰 점프(테이퍼 킹크 등 — 2026-08-26 실기 1.5 m 점프 → 조향 풀포화)가
  # 있는 경로는 폐기. route.taper_blend_m 수정과 독립적인 이중 방어.
  max_polyline_step_m: 0.3

routes:
  기본:
    csv: waypoints.csv        # 검증된 연습 경로 (교차로 짝 1)
  직진:
    walk: {turns: [straight, straight], tail_m: 120}
  우회전:
    walk: {turns: [right], tail_m: 100}
  좌회전:
    walk: {turns: [left], tail_m: 100}
  스쿨존:
    walk: {turns: [any], require: school_zone, tail_m: 80}
  연속교차로:
    walk: {turns: [any, any, any, any, any, any], tail_m: 80}
  속도전환:
    walk: {turns: [any, any], require: speed_change, tail_m: 100}
  # 정지선 정지 프로파일(④′) 검증용 — 접근 속도만 다르게 같은 상황을 밟는다.
  정지선저속:
    walk:
      turns: [straight]
      require: signalized_slow
      tail_m: 100
  정지선고속:
    walk:
      turns: [straight]
      require: signalized_fast
      tail_m: 120

  직진신호:
    walk: {turns: [straight], require: signalized, tail_m: 100}
  우회전신호:
    walk: {turns: [right], require: signalized, tail_m: 100}
  좌회전신호:
    walk: {turns: [left], require: signalized, tail_m: 100}
  


themes:
  보행자집중:
    min_length_m: 400
    event: [pedestrian]
    # 회전 경로 포함 — 회전 중 이벤트 대응이 더 까다롭고 커버리지도 늘어난다 (2026-08-28 확정)
    routes: [직진, 우회전, 좌회전]
    # 트리거거리 축 제거 (2026-08-30): 보행자 트리거는 도로 폭·보행속도에서
    # 역산한다 (params event_trigger.*) — 축으로 주면 무시돼 중복 시나리오만 는다.
    vary: [위치, 보행속도, 신호]
    start: 자유
    보행속도: [1.0, 1.5, 2.0]

  무단횡단집중:
    min_length_m: 400
    event: [jaywalk]
    # 회전 경로 포함 — 회전 중 이벤트 대응 검증 (2026-08-28 확정)
    routes: [직진, 우회전, 좌회전]
    vary: [위치, 보행속도, 지점]        # 트리거거리는 역산 (event_trigger.*)
    start: 자유
    # 무단횡단은 뛰어서 건넌다 — params event_trigger.walk_speed_default.jaywalk(2.5) 대역
    보행속도: [2.0, 2.5, 3.0]
    지점: [횡단보도, 도로중간]      # 신호 무시 + 횡단보도 밖 지점 포함

  보행자사각:
    min_length_m: 400
    event: [ped_blind]
    # 회전 경로 포함 — 회전 중 이벤트 대응 검증 (2026-08-28 확정)
    routes: [직진, 우회전, 좌회전]
    vary: [위치, 보행속도, 차폐물]      # 트리거거리는 역산 (event_trigger.*)
    start: 자유
    보행속도: [2.0, 2.5, 3.0]       # 차폐물 뒤에서 뛰어나온다 (ped_blind 기본 2.5)
    차폐물: [버스, 승용차]

  추월집중:
    min_length_m: 400
    event: [static_vehicle]
    # 회전 추가는 보류 후보 — 회전 구간은 차선변경 공간이 좁아 회피가 성립하지
    # 않을 수 있어 폐기율 실측으로 판단한다 (2026-08-28)
    routes: [직진, 우회전, 좌회전]
    vary: [위치, 차선, 대향차]
    start: 자유

  급정거집중:
    min_length_m: 400
    event: [lead_brake]
    # 회전 경로 포함 — 회전 중 이벤트 대응 검증 (2026-08-28 확정)
    routes: [직진, 우회전, 좌회전]
    vary: [감속강도, 발동거리, 재출발]
    감속강도: [3.0, 5.0, 7.0]
    start: 자유

  저속선행차:
    min_length_m: 400
    event: [slow_lead]
    routes: [직진, 우회전]
    vary: [간격]
    간격: [30, 50, 80]
    속도_kph: 15
    start: 자유

  대향차직진:
    min_length_m: 400                # 이벤트 검증형 — 대향차 조우 1회 검증
    event: [oncoming]
    routes: [직진]
    vary: [위치, 개수, 속도]
    개수: [2, 4, 6]
    속도: [30, 50]
    start: 자유

  # ④′ 정지선 정지 프로파일 검증 (2026-08-30). 저속·고속 진입 각 1개.
  정지선접근:
    min_length_m: 400
    event: [signal]
    routes: [정지선저속, 정지선고속]
    vary: [신호]
    신호: [적60, 딜레마]
    start: 자유

  교차로집중:
    min_length_m: 400                # 이벤트 검증형 — 신호 대응 1회 검증
    event: [signal]
    routes: [직진신호, 우회전신호, 좌회전신호]
    vary: [신호]
    신호: [적60, 딜레마, 짧은녹색]
    start: 자유

  연속교차로:
    min_length_m: 3000
    event: [none]
    routes: [연속교차로]
    vary: []
    start: 자유

  속도구간집중:
    min_length_m: 3000
    event: [none]
    routes: [속도전환, 스쿨존]
    vary: []
    start: 자유

  연쇄장애물:
    min_length_m: 400
    event: [obstacle_chain]
    # 회전 경로 포함 — 회전 중 이벤트 대응 검증 (2026-08-28 확정)
    routes: [직진, 우회전, 좌회전]
    vary: [위치, 개수]
    개수: [3, 4, 6]
    start: 자유

  차로폭협착:
    min_length_m: 400
    event: [narrow]
    routes: [직진]
    vary: [위치, 침범폭]
    침범폭: [0.4, 0.7, 1.0]         # 양측 정차 차량이 차로 안으로 무는 폭 [m]
    start: 자유

  다중이벤트:
    min_length_m: 400
    event: [pedestrian, lead_brake, static_vehicle, obstacle_chain]
    combine: 2
    routes: [직진, 우회전, 좌회전]
    # 위치 축 제거 (2026-08-28 실측): combine>1 이면 gen_one 이 위치를 슬롯
    # (0.3/0.65/0.9)으로 강제해 값을 바꿔도 XML 이 동일했다
    vary: []
    start: 자유

  완주속도:
    min_length_m: 3000
    event: [none]
    start: 자유
    routes: [직진, 우회전, 좌회전, 속도전환]
    vary: []

  실전주행:
    # 대회 실전형 — 3 km 단일 경로에 이벤트를 길이 비례로 분산 배치.
    # 개수·간격·실패 처리는 params gen_events.* (500 m 당 1건, 최소 간격 150 m,
    # 60% 미만 배치 시 폐기). 종류는 시나리오마다 무작위 조합(중복 허용) —
    # 랜덤카오스의 random_axes 방식. 백트랙 탐색(작업2)으로 3 km 가 안정적으로
    # 나오면서 성립한 주제 (2026-08-30).
    min_length_m: 3000
    event: [pedestrian, jaywalk, ped_blind, lead_brake, slow_lead,
            static_vehicle, obstacle_chain, signal, narrow]
    scale_events: true
    random_axes: true
    start: 자유
    routes: [직진, 우회전, 좌회전, 연속교차로]
    # 위치 축 없음 — scale_events 가 균등 슬롯으로 강제. 신호 축 없음 —
    # signal 이벤트는 기본 적60 (랜덤카오스와 같은 이유, 2026-08-28).
    # 보행속도·트리거거리 축 제거 (2026-08-30): 한 시나리오에 pedestrian 과
    # jaywalk 가 섞여 단일 보행속도 축이 둘 다에 맞을 수 없다. 이벤트별
    # params event_trigger.walk_speed_default.* 를 쓰고 트리거는 역산한다.
    vary: [감속강도, 발동거리, 개수, 속도, 차선]

  실전주행_교통류:
    # 실전주행 + VTD 네이티브 교통류(PulkTraffic). 기존 실전주행은 ego 앞 1대뿐이라
    # "정적 장애물을 피하려는데 옆·뒤 차가 방해한다" 를 만들 수 없다 — 회피 판단은
    # 옆 차로가 비었는지에 달려 있는데 그 조건을 만드는 이벤트가 없었다.
    # 기존 실전주행 테마는 회귀 비교 기준이므로 손대지 않고 따로 세운다.
    min_length_m: 3000
    # oncoming/cut_in 은 UNSUPPORTED(대응 미구현)라 실전주행과 같이 제외.
    event: [static_vehicle, obstacle_chain, narrow,
            pedestrian, jaywalk, lead_brake, signal]
    scale_events: true
    random_axes: true
    start: 자유
    routes: [직진, 우회전, 좌회전, 연속교차로]
    # 교통류는 **이벤트가 아니라 시나리오 전역 속성**이다 (2026-08-30 실기 확인 후
    # ev_traffic 대체). PulkTraffic 은 ego 주변 영역을 벗어난 차량을 가장자리에
    # 재배치하므로, 고정 배치(ev_traffic)의 두 한계 — 대역이 265 m 뿐인 것과
    # 3 km 동안 ego 와 벌어져 후반부가 비는 것 — 이 모두 사라진다.
    # 그래서 event 목록이 아니라 이 플래그로 켠다. 상수는 params pulk.*.
    pulk: true
    # 교통류대수 → PulkDef Count, 교통류밀도 → 영역 크기(반경 + 내부 반경) 프리셋.
    # 시드가 바뀌면 이 두 축이 다시 뽑혀 교통류 밀도가 실제로 달라진다.
    vary: [감속강도, 발동거리, 개수, 속도, 차선, 교통류대수, 교통류밀도]
    교통류대수: [12, 20, 30]
    교통류밀도: [조밀, 보통, 성김]

  전체회귀:
    min_length_m: 800               # 이벤트 순환형 — 여러 이벤트를 고루 담으려면 400보다 여유 필요
    event: [pedestrian, jaywalk, ped_blind, lead_brake, slow_lead,
            static_vehicle, oncoming, signal, obstacle_chain, none]
    rotate: true
    start: 자유
    routes: [직진]
    vary: [위치]

  랜덤카오스:
    min_length_m: 800                # 이벤트 혼합 — 전체회귀와 같은 축
    event: [pedestrian, jaywalk, ped_blind, lead_brake, slow_lead,
            static_vehicle, cut_in, oncoming, signal, obstacle_chain, narrow]
    random_axes: true
    start: 자유
    routes: [직진, 우회전, 좌회전, 연속교차로]
    # 신호 축 제거 (2026-08-28 실측): 값 풀이 이벤트별로 상충 — signal 이벤트는
    # 적60/딜레마/짧은녹색만 유효해서 랜덤 조합의 기본/적색이 폐기를 유발했다.
    # signal 은 기본값 적60 으로 생성되고, 보행자 적색 변형은 보행자집중이 커버.
    vary: [위치, 감속강도, 발동거리, 개수, 속도, 차선]   # 보행속도·트리거거리는 역산
