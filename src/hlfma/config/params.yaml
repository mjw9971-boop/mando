# HL FMA 2026 컨트롤러 파라미터 (모든 튜닝 값의 단일 출처)
# 단위: m, m/s, m/s^2, rad. km/h 는 이 파일과 로그 출력에서만.
# 노드가 모두 같은 값을 봐야 하므로 와일드카드로 한 번에 준다.
#
# 이 파일은 nodes/params.py 의 DEFAULTS 로부터 생성한다:
#   python3 -c "import sys;sys.path.insert(0,'src/hlfma');from hlfma.nodes.params import render_yaml;print(render_yaml())" \
#     > src/hlfma/config/params.yaml
/**:
  ros__parameters:
    graph_path: data/lane_graph.pkl
    route_path: data/route.pkl

    # ── comm ──
    comm.host: "192.168.10.1"
    comm.port: 9910
    comm.send_hz: 20
    comm.watchdog_s: 1.0
    # 실측 확정 (2026-08-19, VTD 2025.2): +1.0.
    # -1.0 이면 직선 구간에서 발산하며 courseRespawn 리셋이 발생한다.
    # corr(steering, yaw_rate) = -0.93 으로 확인 (logs/run_20260819_185936.jsonl).
    # 뒤집히면 control 의 SteerSignMonitor 가 주행 5초 안에 경고를 띄운다.
    comm.steer_sign: 1.0
    comm.connect_retry_s: 1.0
    comm.recv_bufsize: 65536
    # /cmd 가 이 시간 이상 안 오면 vtd_bridge 가 조향만 0 으로 감쇠해 재송신.
    # (2026-08-21 주행: 풀락 조향 -0.480 이 0.32 s 유지된 채 3.5 m → 도로이탈)
    # 가속은 유지 — 적신호 대기와 구분 불가. 완전 단절은 watchdog_s 의 SAFE_STOP.
    comm.hold_decay_s: 0.15
    # ── vehicle ──
    vehicle.wheelbase: 2.944
    vehicle.max_steer: 0.48
    vehicle.length: 4.848
    # 뒷바퀴축 → 앞범퍼 (Ioniq 6: 앞 오버행 855 mm). 정지 목표 = 앞범퍼가 정지선 − stop_gap.
    vehicle.front_overhang_m: 0.855
    # 연결로 통행 금지 임계계수: R_min < 최소회전반경 x 이 값이면 경로에서 배제.
    # 실증: R 4.52 m 통과(t_off 0.85), R 2.55 m 탈선 → 0.7(임계 3.96 m)이 경계를 가른다
    vehicle.min_turn_margin: 0.7
    vehicle.width: 1.886
    vehicle.height: 1.507
    # ── speed ──
    speed.margin_kph: 5.0
    speed.a_comf: 1.5
    speed.a_plan_factor: 0.7
    speed.stop_latch_v: 1.5
    speed.a_max: 2.0
    speed.a_min: -6.0
    speed.a_emergency: -8.0
    speed.jerk_max: 2.0
    # 정지 목표 선행 보상 [s]: P 제어 추종 지연(≈a_plan/kp) 만큼 목표를 v·lag 앞당긴다.
    # 폐루프 시뮬: 0.6 → 앞범퍼 정지선 −1.0~−1.2 m, 시간 손실 0 (0 이면 +1.1 m 침범)
    # 지도 곡률 이상치 방어: 이웃 중앙값의 이 배수를 넘는 고립 곡률은 무시 (0=끔)
    speed.curv_outlier_ratio: 5.0
    speed.stop_lag_s: 0.6
    # 래치 뒤 0 으로 스냅하지 않고 _approach 곡선을 v=0 까지 연속으로 낸다.
    # 스냅은 목표를 한 틱에 6 km/h -> 0 으로 떨어뜨려(30 m/s^2) 마지막에 감속도가
    # -1.29 -> -1.87 로 튄다("킥"). 연속이면 -1.56 까지만 올라가고 목표 낙차는
    # 5.3 m/s^2 로 줄어든다 (2026-08-23 15:48 런 + 폐루프 시뮬).
    speed.stop_continuous: true
    speed.a_lat_max: 2.0
    speed.stop_gap_m: 4.0
    speed.a_hold: -1.0
    # ── caps_kph ──
    caps_kph.school_zone: 28.0
    caps_kph.junction: 30.0
    caps_kph.blind: 25.0
    # ── signal ──
    signal.yellow_s: 3.0
    signal.lead_s: 3.0
    signal.margin_s: 1.0
    signal.flash_mode: "yield"
    # 계획 차선변경은 해당 방향 지시등이 이 시간 이상 연속 점등된 뒤에만 실행
    signal.lc_lead_min_s: 3.0
    # RTOR(적신호 우회전): 완전 정지 유지 시간, 서행 통과 속도, 스위치(조직위 답변에 따라 끌 것)
    signal.stop_dwell_s: 1.0
    signal.rtor_speed_kph: 20.0
    signal.rtor_enabled: true
    # ── lead ──
    lead.time_headway_s: 2.0
    lead.min_gap_m: 5.0
    # ── 정차 차량 추월 (blocked) ──
    lead.blocked_dwell_s: 2.0
    lead.blocked_ignore_stopline_m: 30.0
    # 추월 대상 뒤 정지 간격 — 12 m 미만이면 횡이동이 끝나기 전에 그 차에 도달한다(폐루프 실측)
    lead.blocked_gap_m: 12.0
    # 최근 이 속도를 넘겨 달린 이력이 blocked_recent_move_s 안에 있으면 추월 금지
    # (2_lead_brake: 앞차가 15 s 뒤 재출발 — 잠깐 선 차를 추월하면 안 된다)
    lead.blocked_recent_move_v: 2.0
    lead.blocked_recent_move_s: 20.0
    # ── ttc ──
    ttc.warn_s: 4.0
    ttc.brake_s: 2.5
    ttc.emergency_s: 1.5
    # ── lane_change ──
    lane_change.back_m: 30.0
    lane_change.front_m: 50.0
    lane_change.min_window_m: 20.0
    lane_change.transition_s: 3.0
    lane_change.transition_min_m: 20.0
    lane_change.done_t_off_m: 0.3
    lane_change.done_heading_deg: 5.0
    # 차선변경 최소 속도 [m/s] — 저속에서는 블렌드가 진행되지 않아 조향이 고착된다
    lane_change.v_min_mps: 2.0
    # blocked 추월(정지 출발) 전용 크립 속도 / 전이 정체 중단 시간
    lane_change.creep_kph: 8.0
    lane_change.stall_abort_s: 3.0
    # ── cross ──
    cross.margin_s: 2.0
    # ── percep ──
    percep.horizon_m: 200.0
    percep.coast_s: 1.5
    # courseRespawn 리셋 감지 문턱. 실제 리셋 이동량이 3.3 m 남짓이라 그보다 낮아야 한다.
    percep.jump_m: 2.0
    percep.speed_lpf: 0.3
    # 속도 추정 슬라이딩 창 [s] (Σ변위/Σ벽시계 dt). 송신 간격 40/80 ms 불규칙 대응.
    percep.speed_win_s: 0.4
    percep.reset_route_s_drop_m: 5.0
    percep.stall_dt_s: 0.2
    percep.stall_teleport_m: 50.0
    percep.reset_speed_factor: 3.0
    percep.reset_abs_speed: 30.0
    percep.reset_toff_jump_m: 2.0
    percep.ped_extrapolate_s: 2.0
    # 횡단보도 폴리곤 근사 (RTOR 안전 확인 + 횡단보도 보행자 정지 공용)
    percep.crosswalk_half_w_m: 8.0
    percep.crosswalk_back_m: 3.0
    percep.crosswalk_fwd_m: 7.0
    # 차도 밖(인도) 정지 + 진입 예측 없음 객체는 blocker 제외 (2026-08-25 실사고:
    # 횡단 완료 후 인도에 선 보행자가 폴리곤에 남아 172 s 정지 고착 → 완주 실패).
    # 차도 가장자리는 lane_graph 차로폭 합, 못 구하면 제외 안 함(보수적).
    percep.crosswalk_still_v: 0.3
    percep.crosswalk_edge_margin_m: 0.5
    # 공식 확인: 객체는 수평거리 80 m 이내만, 가까운 순 최대 30개.
    percep.gt_range_m: 80.0
    percep.range_margin_m: 5.0
    # ── control ──
    control.kp: 0.8
    control.ki: 0.15
    control.k_ld: 0.8
    control.ld_min: 5.0
    control.ld_max: 20.0
    control.ki_band_mps: 1.0
    control.k_curv: 12.0
    control.ld_curve_min: 3.0
    control.steer_rate_max: 1.0
    # ── shield ──
    shield.edge_margin_m: 0.3
    shield.lane_side_m: 1.0
    # ── batch ── (배치 회귀 종료 판정 — 컨트롤러 정지 정책과 같은 params 사용)
    # 완주 임계 = total − (stop_gap + wheelbase + front_overhang + end_slack).
    # 2026-08-25: stop_gap 1→4 튜닝 후 고정 임계 5 m 에 7.9 m 못 미쳐
    # 정상 완주(계획 정지점 도달)가 timeout 처리 — 임계를 stop_gap 연동으로 변경.
    batch.end_slack_m: 1.0
    # 정지(v<0.1)인데 계획은 진행(v_target≥0.5)이 지속되면 stall 종료
    batch.stall_end_s: 20.0
    # route_s 무전진 지속 시 no_progress 종료 (적60 대기 60 s 보다 길게 둘 것)
    batch.no_progress_end_s: 120.0
    # ── log ──
    log.enabled: true
    log.dir: "logs"
    log.path: ""
    log.flush_every: 20
    # ── debug ──
    debug.enabled: false
    debug.const_speed_kph: 20.0
    debug.path_dist_m: 40.0
    debug.path_step_m: 0.5
    debug.print_hz: 1.0
    # ── default_speed_kph ──
    default_speed_kph: 50.0

